    @keyframes tvSway { 0%, 100% { transform: translateX(-50%) rotate(-1.6deg); } 50% { transform: translateX(-50%) rotate(1.6deg); } }

    .tv-shell {
      position: relative; z-index: 1; border-radius: 26px 26px 15px 15px; padding: 14px 14px 0;
      background:
        radial-gradient(120% 90% at 18% -8%, var(--shell-hi), transparent 55%),
        linear-gradient(165deg, var(--shell) 0%, var(--shell-lo) 100%);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.22),
        inset 0 -20px 26px -20px rgba(0,0,0,.55),
        0 18px 34px -18px rgba(0,0,0,.65);
      transition: transform .12s ease;
    }
    .tv-grommet {
      position: absolute; top: 3px; width: 13px; height: 13px; border-radius: 50%; z-index: 3;
      background: radial-gradient(circle at 35% 30%, var(--chrome), var(--chrome-dk));
      box-shadow: inset 0 1px 2px rgba(0,0,0,.5), 0 1px 1px rgba(255,255,255,.15);
    }
    .tv-grommet.l { left: 21%; } .tv-grommet.r { right: 21%; }

    .tv-screen-frame {
      border-radius: 13px; padding: 2.5px; margin-top: 8px;
      background: linear-gradient(160deg, rgba(0,0,0,.65), rgba(0,0,0,.85));
      box-shadow: 0 2px 8px -3px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);
    }
    .tv-screen { position: relative; aspect-ratio: 16/10; border-radius: 11px; overflow: hidden; background: #050308; }
    /* .tv-clip: the real banner.mp4 loop, layered above .reel by z-index so
       ordering in the markup doesn't matter. .reel stays as the backdrop that
       shows through before the video has decoded a first frame, and is what
       renders if the browser can't play the file at all. */
    .tv-clip { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
    .reel {
      position: absolute; inset: -25%;
      background:
        radial-gradient(closest-side, rgba(124,92,255,.85), transparent 70%) 20% 30%/55% 55% no-repeat,
        radial-gradient(closest-side, rgba(255,77,141,.8), transparent 70%) 75% 60%/60% 60% no-repeat,
        radial-gradient(closest-side, rgba(245,182,74,.5), transparent 70%) 55% 12%/45% 45% no-repeat,
        #0c0812;
      filter: blur(18px) saturate(1.35);
    }
    @media (prefers-reduced-motion: no-preference) { .reel { animation: tvDrift 14s ease-in-out infinite alternate; } }
    @keyframes tvDrift {
      0% { background-position: 20% 30%, 75% 60%, 55% 12%; }
      100% { background-position: 35% 55%, 55% 30%, 70% 40%; }
    }
    .scanlines { position: absolute; inset: 0; z-index: 2; background: repeating-linear-gradient(180deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; opacity: .5; }
    .vignette { position: absolute; inset: 0; z-index: 2; background: radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
    .rec { position: absolute; z-index: 3; top: 8px; left: 9px; display: flex; align-items: center; gap: 5px; font-family: ui-monospace, monospace; font-size: 9.5px; letter-spacing: .06em; color: #ffb3c8; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
    .rec i { width: 6px; height: 6px; border-radius: 50%; background: #ff4d6a; box-shadow: 0 0 6px #ff4d6a; font-style: normal; }
    @media (prefers-reduced-motion: no-preference) { .rec i { animation: tvBlink 1.6s ease-in-out infinite; } }
    @keyframes tvBlink { 50% { opacity: .25; } }
    .neuron-badge { position: absolute; z-index: 3; top: 8px; right: 9px; display: flex; align-items: center; gap: 5px; color: var(--ink); }
    .neuron-mark { width: 15px; height: 15px; flex: none; filter: drop-shadow(0 0 3px rgba(255,255,255,.8)) drop-shadow(0 0 1px #fff); }
    .neuron-badge b { font-family: ui-monospace, monospace; font-size: 9.5px; font-weight: 600; letter-spacing: .08em; text-shadow: 0 1px 2px rgba(0,0,0,.6); }

    .tv-deck { display: flex; align-items: center; gap: 10px; padding: 11px 12px 13px; }
    .pwr {
      width: 30px; height: 30px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 35% 30%, #2a2016, #120d08);
      box-shadow: inset 0 1px 1px rgba(255,255,255,.12), inset 0 -2px 4px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
      color: var(--amber); font-size: 13px;
    }
    .plate { flex: 1; min-width: 0; }
    .plate b { display: block; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: #fbe9cf; opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 1px rgba(0,0,0,.4); }
    .plate small { display: block; font-size: 10.5px; color: #fbe9cf; opacity: .68; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .deck-right { display: flex; align-items: center; gap: 8px; flex: none; }
    .led { width: 7px; height: 7px; border-radius: 50%; background: #ff5a4d; box-shadow: 0 0 7px #ff5a4d; display: block; }
    @media (prefers-reduced-motion: no-preference) { .led { animation: tvPulse 2.1s ease-in-out infinite; } }
    @keyframes tvPulse { 50% { opacity: .35; box-shadow: 0 0 2px #ff5a4d; } }
    .grille { width: 34px; height: 20px; border-radius: 4px; background: repeating-linear-gradient(90deg, var(--shell-lo) 0 3px, transparent 3px 6px); opacity: .85; }

    .tv-foot { position: absolute; bottom: -7px; width: 20px; height: 9px; border-radius: 0 0 6px 6px; background: var(--shell-lo); }
    .tv-foot.l { left: 13%; } .tv-foot.r { right: 13%; }

    /* 2-tile Фото/Видео entry grid — replaces the 4-item "Что создаём" rail;
       discovery for text-to-image/product now happens via the gallery below. */
    .tile2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile {
      position: relative; height: 118px; border-radius: 20px; overflow: hidden; border: 1px solid var(--line);
      padding: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
      text-align: left; color: inherit; font: inherit; cursor: pointer;
    }
    .tile-photo { background: linear-gradient(150deg, rgba(255,77,141,.24), rgba(124,92,255,.07) 62%), var(--surface); }
    .tile-video { background: linear-gradient(150deg, rgba(124,92,255,.3), rgba(180,77,255,.06) 62%), var(--surface); }
    .tile .em { font-size: 24px; line-height: 1; }
    .tile b { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
    .tile span { font-size: 11px; color: var(--muted); }

    /* Home-gallery-only chrome: "Все ›" link, and the Фото/Видео segment.
       The segment overrides .seg's fill-the-active-button convention with a
       sliding indicator: one absolutely-positioned pill animates its `left`
       between the two halves, so the change reads as a single object moving
       rather than one button lighting up while the other goes dark. Position
       comes from [data-k], set in JS rather than inferred with :has(), so it
       stays deterministic on older Telegram WebViews. */
    .seeall { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; white-space: nowrap; cursor: pointer; padding: 8px 0; }
    .gallseg {
      position: relative; margin: 0 0 10px; height: 44px; padding: 3px;
      background: #14111c; border: 1px solid rgba(255,255,255,.07); border-radius: 14px;
    }
    .gallseg::before {
      content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px);
      border-radius: 11px; background: #1b1726; border: 1px solid rgba(255,255,255,.08);
      transition: left .24s cubic-bezier(.4,0,.2,1); pointer-events: none;
    }
    .gallseg[data-k="video"]::before { left: 50%; }
    /* Both buttons stay transparent — the indicator behind them is the only
       fill, so .seg's `background: var(--aurora)` must not win here. */
    .gallseg button, .gallseg button.on {
      position: relative; z-index: 1; background: transparent; border-radius: 11px;
      font-size: 14px; font-weight: 600; padding: 0; transition: color .2s;
    }
    .gallseg button { color: var(--muted); }
    .gallseg button.on { color: var(--ink); }
    /* The design gives this one section a real title instead of the small-caps
       eyebrow .sec-h uses elsewhere; scoped so every other section keeps it. */
    .gallery-sec .sec-h { align-items: center; margin-bottom: 10px; }
    .gallery-sec .sec-h h2 {
      font-size: 17px; font-weight: 700; letter-spacing: -.2px;
      text-transform: none; color: var(--ink);
    }
    .gallery-sec .pcards { margin-top: 4px; }

    /* ————— duration slider —————
       Video length used to be two chips because the registry only offered two
       lengths. The endpoints accept every second in a range (Seedance 4–15,
       Kling 3.0 3–15), so the control is a slider over the ALLOWED list by
       index — it can only ever land on a value the provider accepts, including
       for the two models that really do offer just two.

       The price sits in the head row, next to the seconds, because that is the
       number the choice is actually about: seconds are what you set, patrons
       are what you pay, and putting them anywhere but side by side makes the
       user hunt for the consequence of their own drag. */
    .durbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 13px 15px 9px; }
    .durhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .durhead .dursec { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    .durhead .durprice { white-space: nowrap; }
    /* Dramatic before/after price — reuses the same visual language as
       .fp-now/.fp-was (first-pack gift box) and .msale (sale pill), so a
       discount always looks the same everywhere it appears (duration slider,
       model picker rows). Wrapper (.durprice / .mrow .price / .mpick .price)
       stacks now-over-was; the pieces themselves are unscoped so any price
       spot in the app can opt in just by calling priceBlockHtml(). */
    .durprice, .mrow .price, .mpick .price { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
    .pd-now { font-weight: 800; color: var(--amber); font-size: 15px; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .pd-was { font-size: 11px; color: var(--faint); text-decoration: line-through; font-variant-numeric: tabular-nums; }
    .pd-badge {
      display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .02em;
      background: linear-gradient(90deg, #ff8a3d, #ff4d8d); color: #fff;
      padding: 2px 6px; border-radius: 999px;
    }
    .durbox input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; margin: 12px 0 2px;
      background: transparent; height: 26px; display: block; cursor: pointer;
    }
    /* The travelled part of the track is filled, so "how long did I ask for" is
       readable without finding the thumb first. --fill is a percentage kept in
       sync by wireDurationSlider; 0% and 100% both render correctly because the
       stop is hard rather than a gradient blur. */
    .durbox input[type="range"]::-webkit-slider-runnable-track {
      height: 6px; border-radius: 999px;
      background: linear-gradient(90deg, #7c5cff 0 var(--fill, 0%), var(--surface-2) var(--fill, 0%) 100%);
    }
    .durbox input[type="range"]::-moz-range-track {
      height: 6px; border-radius: 999px;
      background: linear-gradient(90deg, #7c5cff 0 var(--fill, 0%), var(--surface-2) var(--fill, 0%) 100%);
    }
    /* 22px thumb: below ~20px a drag target on a phone is a coin flip, and this
       one sets the price. */
    .durbox input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%;
      background: var(--aurora); border: 2px solid var(--bg-2); box-shadow: 0 2px 10px rgba(124,92,255,.55);
      margin-top: -8px;
    }
    .durbox input[type="range"]::-moz-range-thumb {
      width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--bg-2);
      background: #b44dff; box-shadow: 0 2px 10px rgba(124,92,255,.55);
    }
    .durbox input[type="range"]:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
    .durends { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }

    /* quiz chips (story builder) */
    .quiz-q { font-size: 13px; font-weight: 700; color: var(--muted); margin: 14px 0 8px; }
    /* Tap-to-explain tooltip trigger next to a non-obvious control. Tap, not
       hover — there is no hover on the phones this app actually runs on. */
    .qhint {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; margin-left: 5px; padding: 0; vertical-align: middle;
      border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2);
      color: var(--muted); font: 700 10px/1 inherit; cursor: pointer;
    }
    .qhint:hover { color: var(--ink); border-color: rgba(124,92,255,.5); }
    .hint { font-size: 12px; color: var(--muted); margin: 6px 0 2px; opacity: .85; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: 999px; padding: 8px 13px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .chip.on { background: var(--aurora); border-color: transparent; color: #fff; }
    /* Video "story" quiz — one question at a time in a FIXED-height card, so
       answering doesn't reflow everything below it. Picking an option
       auto-advances; "Назад" steps back to revise; past the last question the
       whole thing collapses into a summary row. */
    .storyq { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
    .storyq.active { height: 150px; display: flex; flex-direction: column; gap: 8px; }
    .storyq .sq-head { display: flex; align-items: baseline; justify-content: space-between; }
    .storyq .sq-head b { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
    .storyq .sq-ct { font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
    .storyq .sq-q { font-size: 13.5px; font-weight: 650; }
    .storyq .sq-chips { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; flex: 1; min-height: 0; overflow-y: auto; }
    .storyq .sq-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .storyq .sq-back {
      border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-weight: 650;
      padding: 4px 2px; cursor: pointer;
    }
    .storyq .sq-back:disabled { opacity: .35; cursor: default; }
    .storyq .sq-skip { border: 0; background: transparent; color: var(--faint); font: inherit; font-size: 11.5px; padding: 4px 2px; cursor: pointer; }
    .storyq.slide-fwd .sq-body { animation: sqSlideFwd .22s ease; }
    .storyq.slide-back .sq-body { animation: sqSlideBack .22s ease; }
    @keyframes sqSlideFwd { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes sqSlideBack { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .storyq.slide-fwd .sq-body, .storyq.slide-back .sq-body { animation: none; } }
    /* Done state: a plain summary row, reopenable — same visual language as
       the preset tag row (.ptagrow/.ptag) elsewhere in this composer. */
    .storyq .sq-done { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .storyq .sq-done .sq-tags { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; min-width: 0; }
    .storyq .sq-tag {
      font-size: 11px; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line);
      border-radius: 999px; padding: 4px 9px;
    }
    .storyq .sq-edit { border: 0; background: transparent; color: var(--violet); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; flex: none; }
    /* S12–S15: render params pinned as one card directly above the CTA (docs/
       wireframes/home-studio, v3) — aspect/quality/count/duration grouped
       so "what you're spending on" reads as one unit right before the button
       that spends it. Each param is a compact pill showing its current value;
       tapping opens a popup with the full list — one uniform pattern instead
       of a chip row for some params and a bespoke drag reel/slider for others. */
    .paramscard {
      background: var(--surface-2); border: 1px solid rgba(124,92,255,.28); border-radius: var(--radius-s);
      padding: 10px 12px; margin: 16px 0 0;
    }
    .ppills { display: flex; gap: 8px; flex-wrap: wrap; }
    .ppill {
      flex: 1; min-width: 84px; border: 1px solid var(--line); background: var(--surface); border-radius: 11px;
      padding: 7px 10px; text-align: left; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 1px;
    }
    .ppill small { font-size: 8.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
    .ppill b { font-size: 13px; font-weight: 700; color: var(--ink); }
    .ppill:active { border-color: rgba(124,92,255,.5); }
    /* The popup itself — a small nested bottom sheet, same slide-up/backdrop
       language as the main composer sheet (.sheet/.sheet-bg), scoped to its
       own overlay so it can sit on top of the composer without touching it. */
    .param-popup { position: fixed; inset: 0; z-index: 75; }
    .param-popup-backdrop { position: absolute; inset: 0; background: rgba(4,3,8,.6); backdrop-filter: blur(4px); }
    .param-popup-sheet {
      position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 720px;
      background: var(--bg-2); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0;
      padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 70dvh; overflow-y: auto;
      animation: ppSheetUp .22s cubic-bezier(.2,.9,.3,1);
    }
    @keyframes ppSheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .param-popup-sheet { animation: none; } }
    .pp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .pp-head b { font-size: 15px; font-weight: 700; }
    .pp-x {
      width: 28px; height: 28px; border-radius: 999px; border: 0; background: var(--surface-2); color: var(--muted);
      font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .pp-list { display: flex; flex-direction: column; gap: 6px; }
    .pp-row {
      border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px;
      padding: 12px 14px; text-align: left; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
    }
    .pp-row.on { border-color: rgba(124,92,255,.5); background: rgba(124,92,255,.1); color: var(--violet); }
    /* Popup gallery browser — reuses .param-popup's overlay/sheet, just a
       taller sheet and a thumbnail grid instead of a row list. */
    .gallery-link {
      border: 0; background: transparent; color: var(--violet); font: inherit; font-size: 11.5px; font-weight: 650;
      padding: 6px 2px; cursor: pointer;
    }
    .gallery-sheet { max-height: 82dvh; }
    .gfav-toggle {
      border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); border-radius: 999px;
      padding: 5px 10px; font: inherit; font-size: 11px; font-weight: 650; cursor: pointer;
    }
    .gfav-toggle.on { border-color: rgba(245,182,74,.5); background: rgba(245,182,74,.12); color: var(--amber); }
    .gallery-empty { padding: 40px 10px; text-align: center; color: var(--muted); font-size: 13px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .gitem { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; border: 2px solid transparent; cursor: pointer; }
    .gitem img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gitem.on { border-color: var(--violet); box-shadow: 0 0 14px rgba(124,92,255,.5); }
    .gstar {
      position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0;
      background: rgba(0,0,0,.5); backdrop-filter: blur(4px); color: #fff; font-size: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .gstar.on { color: var(--amber); }
    .gcheck {
      position: absolute; bottom: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%;
      background: var(--violet); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .gallery-pager { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 12px; color: var(--muted); }
    /* S5–S7, S16: photo / extra angles / audio-video refs / final frame, one
       card instead of four scattered blocks (docs/wireframes — home-studio
       wireframe, version 2). The 4-icon row up top is "what's filled at a
       glance" — the actual upload widgets underneath (photo picker, extras
       grid + subject toggle, audio/video rows, end-frame picker) are the
       SAME functions/ids/handlers as before, just nested in one container
       instead of standing alone; the slots aren't independently tappable
       (each already has its own visible widget right below it — a second,
       separate tap target for the same upload would just be two ways to do
       one thing). */
    .inputscard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
    .inputs-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
    .inputs-head b { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
    .inputs-ct { font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
    /* Status readout, not a control — no card chrome, no dashed "tap me" border.
       These mirror the real interactive slots below; nothing here is clickable. */
    .inputs-slots { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .islot { display: flex; align-items: center; gap: 3px; color: var(--faint); cursor: default; }
    .islot .iic { font-size: 12px; line-height: 1; opacity: .55; }
    .islot .ilbl { font-size: 8.5px; font-weight: 600; letter-spacing: .01em; }
    .islot.on { color: var(--violet); }
    .islot.on .iic { opacity: 1; }
    .inputscard .quiz-q:first-of-type { margin-top: 0; }
    .inputscard > *:last-child { margin-bottom: 0; }
    input.words {
      width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
      border-radius: var(--radius-s); padding: 12px 14px; font: inherit; font-size: 14px; margin-top: 8px;
    }
    input.words:focus { outline: 2px solid rgba(124,92,255,.5); }
    /* Per-character/location free-text description (docs/ui-rebuild-v2.md's
       "character prompt"): woven into the assembled Seedance prompt server-side
       (enhance.ts entityLine), never sent to the sheet render itself. */
    textarea.dm-text {
      width: 100%; min-height: 52px; resize: vertical; background: var(--surface); color: var(--ink);
      border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px 12px; font: inherit; font-size: 13px;
    }
    textarea.dm-text:focus { outline: 2px solid rgba(124,92,255,.5); }

    /* "from my works" source strip */
    .mini { display: grid; grid-auto-flow: column; grid-auto-columns: 74px; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px; }
    .mini::-webkit-scrollbar { display: none; }
    .mini img { width: 74px; height: 74px; object-fit: cover; border-radius: 12px; border: 2px solid transparent; cursor: pointer; display: block; }
    .mini img.on { border-color: var(--violet); box-shadow: 0 0 14px rgba(124,92,255,.5); }

    .drop {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-align: center;
      border: 1.5px dashed rgba(124,92,255,.5); border-radius: var(--radius); background: rgba(124,92,255,.06);
      padding: 18px 16px; cursor: pointer; transition: background .2s ease;
    }
    .drop:hover { background: rgba(124,92,255,.12); }
    .drop .em { font-size: 24px; }
    .drop b { font-size: 13.5px; }
    .drop span { color: var(--muted); font-size: 11px; }
    .drop input { display: none; }
    .photo-preview { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
    .photo-preview img { width: 100%; max-height: 42dvh; object-fit: contain; display: block; background: #000; }
    /* Studio "Референсы" — dark card (matches the user-approved wireframe,
       replacing #94's two-dashed-action-card version). One shared .xtra card
       shell holds: a counted N/limit photo-slot grid (filled slots show the
       photo, empty ones are dashed add-targets) with progressive disclosure
       past a handful — a 9-wide wall of empty boxes is noise for the common
       case of adding just one more angle, so only DEFAULT_SHOWN render until
       "+ Ещё N слотов" is tapped — and, in refMediaBlock's own card right
       below it, the audio/video reference rows (see there). */
    .xtra {
      background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-s);
      padding: 14px; margin-top: 10px;
    }
    .xtra > .quiz-q:first-child, .refhead .quiz-q { margin-top: 0; }
    .refhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .refcount {
      font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap;
      background: var(--surface-2); border: 1px solid var(--line); padding: 3px 9px; border-radius: 999px;
    }
    .refgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .refslot { position: relative; aspect-ratio: 1; border-radius: var(--radius-s); overflow: hidden; }
    .refslot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .refslot.filled { border: 1px solid var(--line); }
    /* Subtle bottom-scrim on every filled slot — legibility for the index tag
       over a real photo thumbnail, and a bit of depth on the icon tiles. */
    .refslot.filled::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, transparent 58%, rgba(0,0,0,.55) 100%);
    }
    .refslot .rf-idx {
      position: absolute; z-index: 1; left: 5px; bottom: 5px;
      font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .02em;
      color: rgba(255,255,255,.8); background: rgba(0,0,0,.45); padding: 2px 5px; border-radius: 5px;
    }
    /* Named .add/.ghost rather than the more obvious ".empty" — that class
       already exists, unscoped, as the generic "no results" grid placeholder
       (search this file), and its grid-column: 1/-1 would silently blow a
       refslot up to full width the moment the two rules' names collided. */
    .refslot.add {
      border: 1px dashed var(--violet); background: rgba(124,92,255,.06);
      display: flex; align-items: center; justify-content: center; color: var(--violet); font-size: 20px; cursor: pointer;
    }
    /* Video reference slots dashed pink, not violet — matches .refsub.video. */
    .refslot.add.video { border-color: var(--magenta); background: rgba(255,77,141,.06); color: var(--magenta); }
    .refslot.ghost { border-color: rgba(255,255,255,.12); background: var(--surface-2); color: var(--muted); cursor: default; }
    .refslot input { display: none; }
    .xdel { width: 20px; height: 20px; border: 0; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; font: inherit; font-size: 11px; line-height: 20px; padding: 0; cursor: pointer; }
    .refslot .xdel { position: absolute; z-index: 1; top: 4px; right: 4px; }
    .rights { display:flex; gap:8px; align-items:flex-start; margin-top:8px; font-size:12.5px; line-height:1.35;
      color:var(--muted); cursor:pointer; }
    .rights input { margin-top:2px; flex:0 0 auto; width:16px; height:16px; }
    /* Audio/video reference rows: same .refgrid/.refslot 3-up grid as the photo
       block above, not the old pair of dashed "attach" cards — up to 3 of each
       now (REF_LIMITS in src/media.ts), so a single-slot card no longer told
       the whole story. Violet accent for audio, pink for video. */
    .refsub { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 0; }
    .refsub .reflabel { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; }
    .refsub.audio .reflabel { color: var(--violet); }
    .refsub.video .reflabel { color: var(--magenta); }
    .refslot.filled.audio, .refslot.filled.video {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    }
    .refslot.filled.audio { background: linear-gradient(155deg, rgba(124,92,255,.38), rgba(124,92,255,.08) 70%), var(--surface-2); }
    .refslot.filled.video { background: linear-gradient(155deg, rgba(255,77,141,.38), rgba(255,77,141,.08) 70%), var(--surface-2); }
    .refslot .rf-ic { position: relative; z-index: 1; font-size: 17px; line-height: 1; }
    .refslot .rf-dur { position: relative; z-index: 1; font-size: 10px; font-weight: 800; color: #fff; }
    /* Unified reference grid (docs/wireframes — home-studio wireframe, version
       2, S5-S7·S16): source extras, the end frame, and — Director Mode on —
       named character/location cards all render as cells of the SAME grid,
       replacing the old separate extras grid + two collapsible accordions.
       .person/.place mirror .filled.audio/.video's color-coded-background
       convention just above. */
    .refslot.person, .refslot.place {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px;
    }
    .refslot.person { background: linear-gradient(155deg, rgba(124,92,255,.32), rgba(124,92,255,.06) 70%), var(--surface-2); }
    .refslot.place { background: linear-gradient(155deg, rgba(245,182,74,.32), rgba(245,182,74,.06) 70%), var(--surface-2); }
    .refslot .rf-lbl {
      position: relative; z-index: 1; font-size: 9.5px; font-weight: 700; text-align: center; line-height: 1.2;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px;
    }
    .refslot .rf-spin {
      width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--violet); border-top-color: transparent;
      animation: dmspin 1s linear infinite;
    }
    .refslot.error { border-color: rgba(232,105,125,.5); }
    .refslot .rf-err { font-size: 15px; }
    .refslot.final { border: 1px dashed var(--amber); background: rgba(245,182,74,.06); color: var(--amber); }
    .refslot.final.filled { border-style: solid; }
    /* A ready character/location card excluded from this render (x.use false)
       — dimmed rather than removed, so re-including it is one tap back. */
    .refslot.unused { opacity: .4; }

    /* ————— Director Mode (Seedance) — iOS-style toggle on the aurora gradient,
       three optional accordions (Персонажи / Локации / Кадр), storyboard
       candidate cards and the assemble CTA. Ported from the approved
       director-mode wireframe, recolored onto the app's own tokens. ————— */
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s);
      padding: 12px; margin-top: 14px;
    }
    .toggle-row .lbl { font-size: 14px; font-weight: 700; }
    .toggle-row .lbl small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; margin-top: 1px; }
    .ios-toggle { position: relative; width: 46px; height: 27px; flex: none; }
    .ios-toggle input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 2; }
    .ios-toggle .track { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); transition: background .18s; }
    .ios-toggle input:checked ~ .track { background: var(--aurora); border-color: transparent; }
    .ios-toggle .knob {
      position: absolute; top: 2px; left: 2px; width: 23px; height: 23px; border-radius: 50%;
      background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.4); transition: transform .18s cubic-bezier(.4,0,.2,1);
    }
    .ios-toggle input:checked ~ .knob { transform: translateX(19px); }
    .ios-toggle input:focus-visible ~ .track { outline: 2px solid var(--magenta); outline-offset: 2px; }
    .acc { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-top: 10px; }
    .acc-head {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      padding: 13px 14px; cursor: pointer; gap: 10px; border: 0; background: none; color: var(--ink); font: inherit; text-align: left;
    }
    .acc-head .t { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .acc-head .n {
      width: 22px; height: 22px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--muted); flex: none;
    }
    .acc-head b { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .acc-head .state { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: auto; }
    .acc-head .chev { color: var(--faint); font-size: 11px; flex: none; transition: transform .15s; }
    .acc.open .chev { transform: rotate(180deg); }
    .acc-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
    .acc-hint { font-size: 11.5px; color: var(--muted); margin: 0; line-height: 1.45; }
    @keyframes dmspin { to { transform: rotate(360deg); } }
    .char-add-card { display: flex; flex-direction: column; gap: 8px; border: 1.5px dashed var(--line); border-radius: 13px; padding: 11px; }
    .char-add-row { display: flex; align-items: flex-start; gap: 8px; }
    .char-add-row > div { flex: 1; min-width: 0; }
    .char-add-row b { font-size: 12.5px; font-weight: 700; display: block; }
    .char-add-row small { font-size: 10.5px; color: var(--muted); display: block; margin-top: 1px; }
    .char-add-cancel {
      flex: none; width: 22px; height: 22px; border: 0; border-radius: 50%; background: var(--surface-2);
      color: var(--muted); font: inherit; font-size: 11px; cursor: pointer;
    }
    .char-add-card .refgrid { margin-top: 0; }
    .char-gen-btn {
      text-align: center; padding: 10px; border-radius: 10px; border: 1px solid rgba(245, 182, 74, .4);
      background: rgba(245, 182, 74, .12); color: var(--amber); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .char-gen-btn:disabled { opacity: .55; cursor: default; }
    .char-alt { border: 0; background: none; text-align: center; font: inherit; font-size: 11px; color: var(--muted); cursor: pointer; padding: 2px; }
    .scenario-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; }
    .scenario-box textarea {
      width: 100%; min-height: 64px; resize: none; border: 0; background: transparent; color: var(--ink);
      font: inherit; font-size: 13px; line-height: 1.45; padding: 0; outline: none; display: block;
    }
    .split-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 11px;
      border-radius: 11px; border: 1px solid rgba(124, 92, 255, .45); background: rgba(124, 92, 255, .12);
      color: #c9bfff; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
    }
    .split-btn:disabled { opacity: .55; cursor: default; }
    .cand-list { display: flex; flex-direction: column; gap: 7px; }
    .cand-head { display: flex; align-items: baseline; justify-content: space-between; margin: 2px 0 0; }
    .cand-head span { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .cand-head small { font-size: 10.5px; color: var(--faint); }
    .cand-card {
      display: flex; flex-direction: column; gap: 5px; width: 100%; text-align: left;
      border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 11px;
      cursor: pointer; font: inherit; color: var(--ink);
    }
    .cand-card b { font-size: 12.5px; font-weight: 600; line-height: 1.35; }
    .cand-tag {
      align-self: flex-start; font-size: 9.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); color: var(--muted);
    }
    .cand-refs { font-size: 10px; color: var(--muted); }
    .cand-card.on { border-color: var(--magenta); background: linear-gradient(160deg, rgba(124, 92, 255, .16), rgba(255, 77, 141, .1)); }
    .cand-card.on .cand-tag { background: var(--aurora); border-color: transparent; color: #fff; }
    .sw-cast { display: flex; flex-direction: column; gap: 6px; }
    .sw-cast-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px solid var(--line);
      background: var(--surface-2); border-radius: 11px; padding: 8px 10px; font-size: 12px;
    }
    .sw-cast-row.done { border-color: rgba(124,92,255,.35); }
    .sw-cast-row b { font-size: 12.5px; font-weight: 700; margin-right: auto; }
    .sw-status { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .sw-actions { display: flex; gap: 6px; width: 100%; }
    .sw-chip {
      flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: 9px; padding: 7px 8px; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .sw-chip:disabled { opacity: .55; cursor: default; }
    .manual-toggle { border: 0; background: none; display: block; width: 100%; text-align: center; padding: 6px; font: inherit; font-size: 11.5px; color: var(--muted); cursor: pointer; }
    .shot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .shot-card {
      display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); background: var(--surface-2);
      border-radius: 13px; padding: 10px; cursor: pointer; font: inherit; color: var(--ink); text-align: left;
    }
    .shot-card .ico { width: 26px; height: 26px; border-radius: 8px; background: var(--bg-2); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); }
    .shot-card b { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
    .shot-card small { font-size: 10px; color: var(--muted); line-height: 1.25; }
    .shot-card.on { border-color: var(--magenta); background: linear-gradient(160deg, rgba(124, 92, 255, .16), rgba(255, 77, 141, .1)); }
    .shot-card.on .ico { background: var(--aurora); color: #fff; }
    .assemble-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%;
      padding: 12px; margin-top: 12px; border: 0; border-radius: var(--radius-s); background: var(--aurora); color: #fff;
      font: inherit; font-size: 13.5px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 24px -12px rgba(124, 92, 255, .7);
    }
    .assemble-btn small { font-size: 10.5px; font-weight: 600; opacity: .85; }
    .assemble-btn:disabled { opacity: .6; cursor: default; }
    .assemble-btn.pulse { animation: dmpulse 2.2s ease-in-out infinite; }
    @keyframes dmpulse { 50% { box-shadow: 0 10px 34px -8px rgba(255, 77, 141, .8); transform: scale(1.015); } }

    /* Generation detail rows (openViewer) + the failed-render strip in «Мои работы». */
    .gmeta { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 2px 13px; margin-top: 12px; }
    .gmeta .mr { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
    .gmeta .mr:last-child { border-bottom: 0; }
    .gmeta .mr span { color: var(--muted); flex: none; }
    .gmeta .mr b { font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }
    .gbadge {
      display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .03em;
      background: rgba(124, 92, 255, .16); border: 1px solid rgba(124, 92, 255, .45); color: #c9bfff;
      padding: 2px 8px; border-radius: 999px; vertical-align: 2px;
    }
    .failcard {
      grid-column: 1 / -1; display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid rgba(245, 182, 74, .35); border-radius: var(--radius-s); padding: 10px 12px;
    }
    .failcard .fx { flex: 1; min-width: 0; }
    .failcard .fx b { display: block; font-size: 12.5px; }
    .failcard .fx small { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .failcard button {
      border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 999px;
      padding: 7px 12px; font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; flex: none;
    }
    .failcard .fdis { width: 26px; height: 26px; padding: 0; border-radius: 50%; color: var(--muted); }
    .photo-preview .redo { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); border: 0; color: #fff; border-radius: 999px; padding: 8px 13px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }

    /* Drag-resize handle above the prompt textarea — a full-width, thumb-sized
       grab zone rather than the browser's native corner-grip, which is tiny
       and frequently suppressed entirely inside Telegram's in-app WebView. */
    .promptwrap { position: relative; margin-top: 12px; }
    /* Handle sits at the BOTTOM edge — the box's top stays put as you type;
       dragging the handle down is what "make more room below" should feel
       like, matching a native textarea's bottom-right resize corner. */
    .promptgrip {
      position: absolute; bottom: -12px; left: 0; right: 0; height: 22px; z-index: 2;
      display: flex; align-items: center; justify-content: center; cursor: ns-resize; touch-action: none;
    }
    .promptgrip i { width: 34px; height: 4px; border-radius: 999px; background: var(--line); transition: background .15s; }
    .promptgrip.active i { background: var(--violet); }
    textarea.prompt {
      width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
      border-radius: var(--radius-s); padding: 13px 14px 18px; font: inherit; font-size: 14px; resize: none; min-height: 76px;
      transition: border-color .15s;
    }
    textarea.prompt:focus { outline: 2px solid rgba(124,92,255,.5); }
    textarea.prompt.gripping { border-color: var(--violet); }

    .progress { text-align: center; padding: 26px 10px 10px; }
    .orb { width: 74px; height: 74px; margin: 0 auto 18px; border-radius: 26px; background: var(--aurora); box-shadow: 0 0 60px rgba(180,77,255,.5); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.12); filter: brightness(1.2); } }
    .progress h4 { margin: 0 0 6px; font-size: 17px; }
    .progress p { color: var(--muted); margin: 0; font-size: 13px; }

    .result-media { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: #000; }
    .result-media img, .result-media video { width: 100%; max-height: 52dvh; object-fit: contain; display: block; }
    .row { display: flex; gap: 10px; margin-top: 14px; }
    .stack { display: grid; gap: 10px; margin-top: 14px; }

    .toast {
      position: fixed; z-index: 60; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
      background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); border-radius: 999px;
      padding: 11px 18px; font-size: 13.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s ease;
      max-width: 90vw; text-align: center;
    }
    .toast.on { opacity: 1; transform: translateX(-50%); }
    /* A hint is a sentence, not a status pill — squarer, left-aligned, roomier.
       Explicit width, not max-width: the base toast is `left: 50%` with auto
       width, so shrink-to-fit caps it at HALF the viewport and a sentence
       wraps into a narrow column. */
    .toast.wide { border-radius: 16px; text-align: left; font-weight: 500; line-height: 1.45; width: min(92vw, 420px); }

    @media (prefers-reduced-motion: reduce) {
      .sky i, .orb, .shot.pending .rip, .assemble-btn.pulse, .rf-spin { animation: none; }
      .shot.pending .rip { opacity: .5; transform: scale(1.6); } /* static ring instead of ripple */
      .reveal { opacity: 1; transform: none; transition: none; }
      .btn, .act, .shot, .pack, .sheet, .sheet-bg, .pcard { transition: none; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"><i></i><i></i></div>
  <div class="wrap" id="root">
    <div class="skel"></div>
  </div>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-top"><div class="grip"></div><button class="sheet-x" id="sheetX" type="button" aria-label="Закрыть">✕</button></div><div id="sheetBody"></div></div>
  <div class="welcome" id="welcome" role="dialog" aria-modal="true" style="display:none"></div>
  <div class="toast" id="toast"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready(); tg?.expand();
    try { tg?.setHeaderColor?.("#08070c"); tg?.setBackgroundColor?.("#08070c"); } catch (e) { /* older clients */ }

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

    // Patron currency mark — the one place to rebrand it. Swap to a different emoji
    // or an <img> tag here and it updates everywhere in the Mini App (mirrors
    // UNIT_EMOJI in src/text.ts). scripts/check-patron-emoji.mjs guards against
    // raw patron-emoji literals sneaking back in outside this definition.
    const PATRON = "\u{1F52B}";
    const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const plural = (n, one, few, many) => { const m100 = Math.abs(n) % 100, m10 = Math.abs(n) % 10;
      return m100 >= 11 && m100 <= 14 ? many : m10 === 1 ? one : m10 >= 2 && m10 <= 4 ? few : many; };
    /** "4100" → "4.1K" for a compact usage-count pill; small counts stay exact. */
    const formatCount = (n) => (n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "K" : String(n));
    // Custom icon + background photo per campaign — keyed by real CAMPAIGNS ids
    // (models.ts), not the emoji in the label (that stays in bot messages
    // untouched). Falls back to the label's own emoji if a campaign is added
    // without art yet, so nothing silently disappears. Top-level so both the
    // hero carousel and the home gallery's Video tab can read it.
    const CAMP_ART = {
      skazka: { icon: "book", bg: "skazka" },
      oldphoto: { icon: "pocketwatch", bg: "oldphoto" },
      poster: { icon: "ticket", bg: "poster" },
      minifilm: { icon: "reel", bg: "minifilm" },
      odyssey: { icon: "compass", bg: "odyssey" },
    };

    // Session auth: inside Telegram exchange fresh initData for a Bearer token;
    // outside (installed PWA / browser) reuse the cached token.
    const TOKEN_KEY = "neuroshot_session";
    let AUTH = "";
    async function authHeader() {
      if (AUTH) return AUTH;
      const initData = tg?.initData || "";
      if (initData) {
        try {
          const r = await fetch("/api/auth", { method: "POST", headers: { Authorization: "tma " + initData } });
          if (r.ok) { const d = await r.json(); localStorage.setItem(TOKEN_KEY, d.token); return (AUTH = "Bearer " + d.token); }
        } catch (e) { /* fall through to raw initData */ }
        return (AUTH = "tma " + initData);
      }
      const tok = localStorage.getItem(TOKEN_KEY);
      return (AUTH = tok ? "Bearer " + tok : "");
    }
    async function api(path, opts = {}) {
      const auth = await authHeader();
      const headers = Object.assign({ Authorization: auth }, opts.body ? { "Content-Type": "application/json" } : {});
      const r = await fetch(path, Object.assign({}, opts, { headers }));
      let d = null; try { d = await r.json(); } catch (e) { /* non-JSON error */ }
      return { status: r.status, data: d };
    }

    function openBot(username, payload) {
      const url = "https://t.me/" + username + (payload ? "?start=" + payload : "");
      if (tg?.initData) tg.openTelegramLink(url); else location.href = url;
    }
    /** `opts.wide` = a full sentence (explanations) rather than a status pill;
     *  `opts.ms` overrides how long it stays — a sentence needs longer to read. */
    function toast(msg, opts) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.toggle("wide", !!(opts && opts.wide));
      t.classList.add("on");
      clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), (opts && opts.ms) || 2600);
    }
    function haptic(kind) { try { tg?.HapticFeedback?.notificationOccurred?.(kind); } catch (e) { /* optional */ } }
    /* Telegram splits its haptics: notificationOccurred takes success/error/warning,
       impactOccurred takes the physical weights. A slider tick is an impact — passing
       "light" to the notification API would just be silently ignored. */
    function hapticTick() { try { tg?.HapticFeedback?.impactOccurred?.("light"); } catch (e) { /* optional */ } }

    function reveal() {
      const io = new IntersectionObserver((es) => es.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add("on"); io.unobserve(e.target); }
      }), { threshold: 0.12 });
      document.querySelectorAll(".reveal").forEach((el, i) => { el.style.transitionDelay = Math.min(i * 60, 240) + "ms"; io.observe(el); });
    }
    function gate(text, btnLabel, href) {
      document.getElementById("root").innerHTML = "";
      document.getElementById("root").appendChild($(`
        <div class="gate">
          <div class="dot"></div>
          <h1>NeuroShot</h1>
          <p>${text}</p>
          <a class="btn primary" href="${href}">${btnLabel}</a>
        </div>`));
    }

    // ————— welcome / first-launch onboarding —————
    // Shown whenever the welcome bonus is unclaimed (see claimWelcomeBonus in
    // db.ts) — a brand-new signup, or a returning user who tapped "Продолжить
    // без патронов" last time. There's no separate "seen it" flag: /api/me is
    // the single source of truth, so the claim is never permanently stranded —
    // it just resurfaces on the next open until actually claimed.
    function sparklesHtml() {
      return `<span class="wsparkles"><i style="left:12%;top:18%;animation-delay:.2s"></i>` +
        `<i style="left:80%;top:14%;animation-delay:1.1s"></i>` +
        `<i style="left:42%;top:34%;animation-delay:.6s"></i>` +
        `<i style="left:86%;top:46%;animation-delay:1.8s"></i>` +
        `<i style="left:22%;top:52%;animation-delay:2.3s"></i></span>`;
    }
    function heroHtml(img, step, title) {
      return `<div class="whero"><img src="${img}" alt="" />${sparklesHtml()}` +
        `<div class="wherotext"><div class="kicker">Шаг ${step} из 5</div><h2>${title}</h2></div></div>`;
    }
    function closeWelcome() {
      document.getElementById("welcome").style.display = "none";
      if (ME) ME.onboardingSeen = true;
      api("/api/ack-onboarding", { method: "POST" }).catch(() => {});
    }

    /** force=true replays the slideshow on demand (the "Ещё" tab link),
     *  bypassing the onboardingSeen gate that otherwise limits it to once. */
    function renderWelcome(d, force) {
      const wb = d.welcomeBonus || { pending: 0, claimed: true };
      if (!force && d.onboardingSeen) return;
      const claimable = !wb.claimed && wb.pending > 0;
      const el = document.getElementById("welcome");
      const c = d.catalog;
      const videoMin = c.videoModels.reduce((a, m) => Math.min(a, m.credits), 1e9);
      // The onboarding ladder shows the STANDING prices. The entry tier is left
      // out on purpose: this slide teaches "bigger pack, cheaper patron", and a
      // one-off below every rung is the exception that makes the rule unreadable
      // — the buy tab shows it in its own right, on its own tile.

     * is handed a POSITION on it and never the table.

     * Three states, because a progression screen that lies is worse than none:
     *  • not switched on (the shipped default) — say so plainly rather than

     *  • max level — a full bar, no phantom "0 to next";
     *  • normal — level ring, XP counter, and the exact XP left to the next.
     */
    /**
     * The header chip. Returns "" while the ladder is unconfigured (progress
     * .active === false) so the header simply doesn't carry it — the Профиль
     * card already explains the "скоро" state in words, and a stuck 0% meter in
     * permanent view would say the opposite.
     */
    function levelMiniHtml(p) {
      if (!p || !p.active) return "";
      const pct = p.nextAt == null ? 100 : Math.round((p.into / p.span) * 100);
      const title = p.nextAt == null
        ? `Максимальный уровень · ${p.xp} XP`
        : `Уровень ${p.level} · ещё ${p.nextAt - p.xp} XP до ${p.level + 1}`;

    /**
     * Fly "+N XP" from wherever it was earned up to the header chip, then let
     * the chip count up and the bar fill to the new position.
     *
     * Why bother: XP that simply appears has already happened by the time you
     * look at it, and reads as bookkeeping. Watching it travel from the thing
     * you just did to the meter is what makes the meter feel like yours.
     *
     * Degrades to nothing, deliberately, in three cases — the chip is absent
     * (the ladder isn't switched on), the browser has no Web Animations API,
     * or the user asked for reduced motion. In all three the numbers still
     * update; only the flight is skipped.
     */
    function flyXp(delta, originEl, after) {
      const chip = document.querySelector("#lvlHost .lvlmini");
      const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!chip || delta <= 0 || reduce || !document.body.animate) { after && after(); return; }

      const to = chip.getBoundingClientRect();
      // Fall back to the middle of the viewport when the origin is off-screen
      // or gone (a result card can be replaced before the poll returns).
      const r = originEl && originEl.isConnected ? originEl.getBoundingClientRect() : null;
      const from = r && r.width
        ? { x: r.left + r.width / 2, y: r.top + r.height / 2 }
        : { x: innerWidth / 2, y: innerHeight * 0.55 };

      const pill = document.createElement("div");
      pill.className = "xpfly";
      pill.textContent = `+${delta} XP`;
      pill.style.left = from.x + "px";
      pill.style.top = from.y + "px";
      document.body.appendChild(pill);

      const dx = to.left + to.width / 2 - from.x;
      const dy = to.top + to.height / 2 - from.y;
      const anim = pill.animate(
        [
          { transform: "translate(-50%,-50%) scale(.6)", opacity: 0 },
          { transform: "translate(-50%,-50%) scale(1.15)", opacity: 1, offset: 0.16 },
          // Arc: rise before crossing, so it reads as thrown rather than dragged.
          { transform: `translate(calc(-50% + ${dx * 0.55}px), calc(-50% + ${dy * 0.25 - 46}px)) scale(1)`, opacity: 1, offset: 0.6 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.45)`, opacity: 0 },
        ],
        { duration: 1000, easing: "cubic-bezier(.4,.05,.25,1)" },
      );
      anim.onfinish = () => {
        pill.remove();
        chip.classList.add("xpland");
        setTimeout(() => chip.classList.remove("xpland"), 500);
        haptic("success");
        after && after();
      };
      // A cancelled animation (tab hidden, element torn down) must still land
      // the numbers, or the meter silently stops matching the account.
      anim.oncancel = () => { pill.remove(); after && after(); };
    }

    /** Count the chip's XP label from one value to another as the bar fills. */
    function countXpTo(progress, fromXp) {
      const host = document.getElementById("lvlHost");
      if (!host) return;
      const label = host.querySelector(".lvlmini small");
      if (!label) { setLevelMini(progress); return; }
      const start = performance.now();
      const dur = 700;
      const tick = (t) => {
        const k = Math.min(1, (t - start) / dur);
        const shown = Math.round(fromXp + (progress.xp - fromXp) * k);
        label.textContent = `${shown} XP`;
        if (k < 1) requestAnimationFrame(tick);
        else setLevelMini(progress); // settle on the authoritative render
      };
      // Fill the bar immediately: its CSS transition runs over the same window,
      // so the number and the bar arrive together.
      const bar = host.querySelector(".lvlmbar i");
      if (bar) bar.style.width = (progress.nextAt == null ? 100 : Math.round((progress.into / progress.span) * 100)) + "%";
      requestAnimationFrame(tick);
    }

    /**
     * Compare the XP we last rendered against what the server now reports and,
     * if it grew, play the gain. The DELTA comes from the server's own numbers
     * rather than being predicted client-side — the client has no idea which
     * rewards fired (breadth bonuses, daily caps, an unconfigured reward paying
     * nothing), and a guessed +N that disagrees with the real total is worse
     * than no animation at all.
     */
    let lastXpSeen = null;
    function playXpGain(progress, originEl) {
      if (!progress || !progress.active) { lastXpSeen = progress ? progress.xp : null; return; }
      const before = lastXpSeen;
      lastXpSeen = progress.xp;
      // First paint of the session has nothing to compare against, and a lost
      // level (impossible today, but XP is append-only by design) must not
      // animate backwards.
      if (before == null || progress.xp <= before) { setLevelMini(progress); return; }
      const delta = progress.xp - before;
      flyXp(delta, originEl, () => countXpTo(progress, before));
    }

    /** Repaint the header chip in place after XP moves, without a full re-render. */
    function setLevelMini(p) {

    const BADGE_GLYPH = {

      patron: "👑", inviter: "🤝", circle: "🫂", level_3: "🔺",
    };

    /**
     * The ways to earn XP, in the order the Rewards sheet explains them.
     *
     * `action` is the SERVER's award id (`xp.<action>` in economy_config, and the
     * reason written to xp_ledger). Two things hang off it:
     *
     *  - the sheet renders only the actions the server says are switched on
     *    (`ME.xpActions`). Listing an action that pays nothing today is a promise
     *    we do not keep: the user does it, watches the bar not move, and decides
     *    the whole system is decorative;
     *  - a test asserts these ids and `XP_AWARD_ACTIONS` in `src/db.ts` agree
     *    both ways, so a new award cannot ship without copy and copy cannot
     *    describe an award that does not exist.
     *
     * Amounts are never stated — those are private tuning. Neither is frequency

     * (`xp.<action>.dailycap`), so "каждый раз" would go quiet the day a cap is
