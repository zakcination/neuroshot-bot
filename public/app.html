    const XP_ACTIONS = [
      { action: "generate", icon: "🖼", title: "Создавайте работы", hint: "Готовый рендер приносит опыт" },
      { action: "model", icon: "🧭", title: "Попробуйте новую модель", hint: "Один раз за каждую модель, при первой попытке" },
      { action: "video", icon: "🎬", title: "Снимите видео", hint: "Один раз, при первом видео" },
      { action: "image", icon: "🖌", title: "Сделайте первую картинку", hint: "Один раз, за первую работу с фото" },
      { action: "text", icon: "✍️", title: "Сгенерируйте по тексту", hint: "Один раз, при первом текстовом запросе" },
      { action: "preset", icon: "🎨", title: "Попробуйте новый стиль", hint: "Один раз за каждый пресет, при первой попытке" },
      { action: "scenario", icon: "📖", title: "Откройте сценарий", hint: "Один раз, за первый сценарий" },
      { action: "upload", icon: "📤", title: "Загрузите своё фото", hint: "Один раз, за первую загрузку" },
      { action: "save", icon: "💾", title: "Сохраняйте результаты", hint: "За сохранённую работу" },
      { action: "share", icon: "📣", title: "Делитесь результатом", hint: "За работу, которой поделились" },
      // The trigger here is the friend CLAIMING their welcome gift, not buying:
      // db.ts awards it inside claimWelcomeBonus, deliberately — "a bonus claimed
      // is a real human who arrived, whereas a click is free to manufacture".
      // The friend's PURCHASE is a separate award (refpurchase) with its own row.
      { action: "referral", icon: "🤝", title: "Пригласите друга", hint: "Когда друг заберёт свой стартовый подарок" },
      { action: "refpurchase", icon: "🌟", title: "Друг совершил покупку", hint: "Доля опыта с покупок приглашённых" },
      { action: "purchase", icon: "💳", title: "Пополняйте баланс", hint: "Оплата тоже приносит опыт" },
    ];

    /**
     * Wall sections, Apple Fitness Awards style ("Close Your Rings", "Monthly
     * Challenges"...) — order here is the order they render in. Labels and
     * the group→colour mapping live in docs/achievements.md; this is just the
     * client-side copy needed to render a header per section.
     */
    const GROUP_LABEL = {
      output: "Работы", formats: "Форматы", exploration: "Исследование",
      engagement: "Мастерство", support: "Поддержка", community: "Сообщество",
      progress: "Уровень",
    };
    const GROUP_ORDER = ["output", "formats", "exploration", "engagement", "support", "community", "progress"];

    /**
     * One badge. The <img> is attempted first and removes itself on 404, so a
     * shelf mixes produced artwork and glyph fallbacks without either looking
     * broken — the same graceful-degradation rule the preset cards use.
     */
    function badgeHtml(a) {
      const glyph = BADGE_GLYPH[a.id] || "\u2605";
      // The glyph is ALWAYS rendered, and bespoke artwork — once it exists —
      // simply covers it and removes it on load. The reverse (img first,
      // swapped in on error) needs the fallback markup inside an HTML
      // attribute, and an SVG carries quotes: the attribute terminates early
      // and the rest leaks into the page as text. Layering avoids the whole
      // class of problem, and a missing asset costs nothing.
      return `<div class="badge tier-${a.tier} grp-${a.group || "output"}${a.earned ? "" : " locked"}">
        <div class="bgcore"></div>
        <div class="bgrim"></div>
        <div class="bgaccent"></div>
        <div class="bgface">
          <svg viewBox="0 0 100 100" aria-hidden="true"><text x="50" y="52" text-anchor="middle" dominant-baseline="central">${glyph}</text></svg>
          <img src="/img/badge-${esc(a.id)}.png" alt="" onload="this.previousElementSibling.remove()" onerror="this.remove()" />
        </div>
        <div class="bgholo"></div>
      </div>`;
    }

    /**
     * Certificates tile. Locked is the normal state and the copy says so
     * plainly, with what to DO about it — a shelf of greyed seals with no path
     * is just a reminder that you are not in the club.
     */
    function certTileHtml(list) {
      const all = list || [];
      const got = all.filter((c) => c.earned).length;
      return `<button class="achtile" id="certTile">
        <div class="seal${got ? "" : " locked"}"><i></i><b>🎓</b></div>
        <small>${got ? `${got} из ${all.length}` : "скоро"}<br>сертификаты</small>
      </button>`;
    }

    /**
     * The certificates sheet doubles as the course storefront — that is the
     * point of the section. Each row states the honest state: not bought /
     * bought but not defended / issued. The certificate is never implied by
     * payment, and the copy says what earns it, so nobody buys expecting a PDF.
     */
    function viewCertificates() {
      const all = (ME && ME.certificates) || [];
      // The courses are DEFERRED. So this section must not sell them: a CTA
      // into a product nobody can buy yet is the same broken promise we just
      // removed from the payment screen, one screen over. It states what is
      // coming and stops there.
      //
      // The issuance machinery stays live underneath — an already-issued
      // certificate still shows as issued, so nothing regresses for anyone who
      // has one when the courses do open.
      const rows = all.map((c) => {
        const status = c.earned
          ? `Выдан ${c.issuedAt ? new Date(c.issuedAt).toLocaleDateString("ru-RU") : ""}`
          : "Скоро";
        return `<div class="certrow">
          <div class="seal${c.earned ? "" : " locked"}"><i></i><b>🎓</b></div>
          <div class="ct"><b>${esc(c.title)}</b><small>${esc(status)}</small></div>
        </div>`;
      }).join("");
      const anyEarned = all.some((c) => c.earned);
      sheetBody.innerHTML = `<h3>Сертификаты</h3>
        <div class="sub">Курсы по ИИ-контенту готовятся. Сертификат будет выдаваться за работы, а не за оплату — поэтому он будет что-то значить.</div>
        <div class="fincard" style="margin-top:12px">${rows}</div>
        <p class="finnote">${anyEarned
          ? "Как только откроются новые курсы — они появятся здесь."
          : "Мы сообщим, когда откроется запись. Пока сертификатов нет ни у кого — их нельзя купить, только заслужить."}</p>`;
      openSheet();
    }

    /**
     * Rewards tile: the third shelf, next to achievements and certificates.
     * Unlike those two — which count something earned — this one just opens
     * an explainer, so it never shows a "0 of N" that would read as failure
     * before the reward system is even configured for anyone.
     */
    function rewardsTileHtml() {
      return `<button class="achtile" id="rewardsTile">
        <div class="gem"><i></i><b>💎</b>
          <img src="/img/reward-key.png" alt="" onload="this.previousElementSibling.remove()" onerror="this.remove()" />
        </div>
        <small>Уровень<br>и награды</small>
      </button>`;
    }

    /**
     * The Rewards sheet: two honest lists, not one sales pitch. "Как
     * заработать опыт" is evergreen product copy — it never invents an XP
     * number, because those are private server tuning (see XP_ACTIONS).
     * "Что открывает уровень" reads live preset gating (`minLevel` on every
     * `ME.catalog.presets` row, sent by the server regardless of whether any
     * preset is actually gated — see `presetLock`) against the account's
     * current Level, same the empty-by-default honesty as viewCertificates:
     * preset_gating ships empty, so most accounts will see nothing here yet,
     * and the copy says so instead of padding the list with fabricated rows.
     */
    function viewRewards() {
      const presets = (ME && ME.catalog && ME.catalog.presets) || [];
      const level = (ME && ME.dashboard && ME.dashboard.level) || 0;
      const gated = presets.filter((p) => p.minLevel > 0).sort((a, b) => a.minLevel - b.minLevel);
      // Only what is actually switched on server-side. If nothing is, the sheet
      // says so rather than listing eleven ways to earn nothing.
      const on = (ME && ME.xpActions) || [];
      const earning = XP_ACTIONS.filter((a) => on.includes(a.action));
      const earnRows = earning.map((a) => `<div class="certrow">
          <div class="gem"><i></i><b>${a.icon}</b></div>
          <div class="ct"><b>${esc(a.title)}</b><small>${esc(a.hint)}</small></div>
        </div>`).join("");
      const tierRows = gated.map((p) => {
        const unlocked = p.minLevel <= level;
        return `<div class="certrow">
          <div class="gem${unlocked ? "" : " locked"}"><i></i><b>${unlocked ? "✅" : "🔒"}</b></div>
          <div class="ct"><b>${esc(p.label)}</b><small>${unlocked ? "Открыто" : `Открывается на ${p.minLevel}-м уровне`}</small></div>
        </div>`;
      }).join("");
      sheetBody.innerHTML = `<h3>Уровень и награды</h3>
        <div class="sub">Опыт копится за всё, что вы делаете в приложении, и никогда не уменьшается.</div>
        <div class="sec-h" style="margin-top:18px"><h2>Как заработать опыт</h2></div>
        ${earning.length
          ? `<div class="fincard">${earnRows}</div>`
          : `<p class="finnote">Начисление опыта пока не включено — как только заработает, здесь появится список.</p>`}
        <div class="sec-h" style="margin-top:16px"><h2>Что открывает уровень</h2></div>
        ${tierRows
          ? `<div class="fincard">${tierRows}</div>`
          : `<p class="finnote">Пока ни один стиль не закрыт уровнем — все открыты всем. Как только появятся уровневые награды, они будут здесь.</p>`}`;
      openSheet();
    }

    /** The 30% tile: the newest earned badge, and how far the set has gone. */
    function achTileHtml(list) {
      const all = list || [];
      const earned = all.filter((a) => a.earned);
      const face = earned[earned.length - 1] || all[0];
      if (!face) return "";
      return `<button class="achtile" id="achTile">
        ${badgeHtml(face)}
        <small>${earned.length} из ${all.length}<br>достижений</small>
      </button>`;
    }

    /** One section: a coloured dot + label, then that group's grid. Skips
     *  groups with nothing in them so an id-typo doesn't render an empty
     *  header — though the fixed 17 always fill every section today. */
    function achGroupHtml(group, items) {
      if (!items.length) return "";
      return `<div class="achgroup grp-${esc(group)}">
        <div class="achgrouphead"><i></i>${esc(GROUP_LABEL[group] || group)}</div>
        <div class="achgrid">${items.map((a) => `
          <button class="achcell" data-ach="${esc(a.id)}">
            ${badgeHtml(a)}
            <b>${esc(a.title)}</b>
            <small>${a.earned ? "получено" : `${a.at}/${a.need}`}</small>
          </button>`).join("")}</div>
      </div>`;
    }

    /** The wall. Locked badges stay visible — the holes are what give the
     *  earned ones weight, and they double as a map of what the app can do.
     *  Grouped into sections (Apple Fitness Awards style) rather than one
     *  flat grid, so a 17-badge set reads as a handful of small, scannable
     *  categories instead of a wall of unrelated icons. */
    function viewAchievements() {
      const all = (ME && ME.achievements) || [];
      const earned = all.filter((a) => a.earned).length;
      const groups = GROUP_ORDER.map((g) => achGroupHtml(g, all.filter((a) => a.group === g))).join("");
      sheetBody.innerHTML = `<h3>Достижения</h3>
        <div class="sub">Получено ${earned} из ${all.length}. Нажмите на значок, чтобы рассмотреть.</div>
        ${groups}`;
      sheetBody.querySelectorAll("[data-ach]").forEach((b) => (b.onclick = () => viewBadge(b.dataset.ach)));
      openSheet();
    }

    /**
     * One badge, large and turning. It rotates on its own so the material and
     * the glyph's parallax are visible without being asked for, and a drag
     * takes over the moment the user touches it — an object you can turn reads
     * as a thing you own, which a flat icon never does.
     */
    function viewBadge(id) {
      const all = (ME && ME.achievements) || [];
      const a = all.find((x) => x.id === id);
      if (!a) return;
      const pct = Math.round((Math.min(a.at, a.need) / Math.max(1, a.need)) * 100);
      sheetBody.innerHTML = `<h3>${esc(a.title)}</h3>
        <div class="achstage" id="achStage">${badgeHtml(a)}</div>
        <div class="achmeta">
          <div class="sub">${a.earned ? "Получено" : esc(a.hint)}</div>
          ${a.earned ? "" : `<div class="lvlbar"><i style="width:${pct}%"></i></div><div class="sub">${a.at} из ${a.need}</div>`}
          <button class="btn ghost" id="achBack">← Все достижения</button>
        </div>`;
      document.getElementById("achBack").onclick = viewAchievements;

      // Drag to spin. Pointer events cover touch and mouse in one path; the
      // stage keeps its own angle so releasing doesn't snap back to where the
      // CSS animation would have been.
      const stage = document.getElementById("achStage");
      const el = stage.querySelector(".badge");
      let dragging = false, startX = 0, angle = 0;
      stage.addEventListener("pointerdown", (e) => {
        dragging = true; startX = e.clientX; stage.classList.add("dragging");
        stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        el.style.transform = `rotateY(${angle + (e.clientX - startX) * 0.8}deg)`;
      });
      const release = (e) => {
        if (!dragging) return;
        dragging = false;
        angle += (e.clientX - startX) * 0.8;
        // Hand it back to the ambient spin, continuing from where it was let go.
        el.style.transform = "";
        stage.classList.remove("dragging");
      };
      stage.addEventListener("pointerup", release);
      stage.addEventListener("pointercancel", release);
    }

    /**
     * "What changed" — shown once, in the app, on the first open after a
     * release. Never pushed: a release note is not worth a slot in the weekly
     * message budget, and the people who care are the ones already here.
     *
     * Marked seen when the sheet is DISMISSED rather than when it is rendered,
     * so a note that flashed past during a reload isn't silently consumed.
     */
    function maybeShowWhatsNew(d) {
      const notes = (d && d.whatsNew) || [];
      if (!notes.length) return;
      const body = notes.map((n) => `
        <div style="margin-bottom:16px">
          <b>${esc(n.title)}</b> <span class="wndate">${esc(n.id)}</span>
          <ul class="wnlist">${n.lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>
        </div>`).join("");
      sheetBody.innerHTML = `<h3>Что нового</h3>${body}
        <button class="btn primary" id="wnOk" style="margin-top:8px">Понятно</button>`;
      const ok = document.getElementById("wnOk");
      if (ok) ok.onclick = async () => {
        await api("/api/release/seen", { method: "POST" });
        if (ME) ME.whatsNew = [];
        closeSheet();
      };
      openSheet();
    }

    function levelCardHtml(p) {
      if (!p || !p.active) {
        return `<div class="lvlcard off">
          <div class="lvlring"><b>—</b></div>
          <div class="lvlbody">
            <div class="lvltop"><b>Уровни скоро</b></div>
            <div class="sub">Опыт уже копится за ваши работы. Как только шкала откроется, он весь останется с вами.</div>
          </div>
        </div>`;
      }
      const pct = Math.round((p.into / p.span) * 100);
      const maxed = p.nextAt == null;
      const left = maxed ? 0 : p.nextAt - p.xp;
      return `<div class="lvlcard">
        <div class="lvlring" style="--pct:${pct}"><b>${p.level}</b></div>
        <div class="lvlbody">
          <div class="lvltop"><b>Уровень ${p.level}</b><span class="lvlxp">${p.xp} XP</span></div>
          <div class="lvlbar"><i style="width:${pct}%"></i></div>
          <div class="sub">${maxed
            ? "Максимальный уровень — вы прошли всю шкалу 🏆"
            : `Ещё ${left} XP до ${p.level + 1} уровня · открывает новые стили`}</div>
        </div>
      </div>`;
    }

    /**
     * The Seedance sale banner shown at the top of both video composers.
     * Non-ticking by design — a day-granularity deadline six weeks out gains
     * nothing from a per-second timer, and a static line computed once at
     * render avoids running a second countdown interval alongside the combo
     * offer's. Re-renders naturally every time the composer redraws (which
     * happens on nearly every tap), so the date is never meaningfully stale.
     */
    function saleBanner() {
      const saleOn = ME.seedanceSale && ME.seedanceSale.active;
      const ceilingOn = ME.flagshipCeiling && ME.flagshipCeiling.active;
      const until = saleOn ? new Date(ME.seedanceSale.endsAt).toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) : "";
      const salePart = saleOn ? `Все модели Seedance — цены ниже вдвое, до ${until}.` : "";
      // The ceiling is permanent (no end date), unlike the sale, so it keeps
      // its own sentence even once the sale above has expired.
      // No fixed "never above N ₸" figure here on purpose — the ceiling is a
      // per-duration curve now (docs/seedance-tiers.md § flagship ceiling),
      // not one flat number, so a specific ₸ claim would be true at some pack
      // rates and false at others (up to 3,680 ₸ at 15s on the priciest pack).
      const ceilingPart = ceilingOn ? ` Флагман — цена на длинных роликах снижена ещё сильнее.` : "";
      return `<div class="salebar">🔥 <b>Seedance</b> — ${salePart}${ceilingPart}</div>`;
    }

    /**
     * The Home tab's promo banner — richer than saleBanner() (a price block +
     * a dated chip), but same gating and same underlying sale. Copy is
     * grounded in the REAL Seedance Fast spec (720p max, 4-15s), not the
     * "1080p, до 12 секунд" line from the design reference this was built
     * from — that model doesn't exist on our fal endpoint. Returns "" once
     * the sale ends, so no dead promo card is ever left on the page.
     *
     * Visual design (user-approved wireframe, replacing #94's scrolling-tile
     * version): a maroon/near-black "campaign poster" card with a hot-pink
     * glow — no moving parts, so there's no prefers-reduced-motion case to
     * handle here either.
     */
    function promoBannerHtml(d) {
      const saleOn = ME.seedanceSale && ME.seedanceSale.active;
      if (!saleOn) return "";
      const n = (d.catalog.news || []).find((x) => x.key === "seedance_fast");
      if (!n) return "";
      return `
        <button class="promobar" id="promoBanner">
          <span class="promotag">🏷 Ограниченное предложение</span>
          <span class="promotxt">
            <b>Seedance дешевле вдвое</b>
            <span>Видео 720p · 4–15 сек · все тарифы Seedance</span>
          </span>
          <span class="promobtm">
            <span class="promocta">Попробовать со скидкой →</span>
            <span class="promoprice">${priceBlockHtml(n.credits, n.wasCredits)}</span>
          </span>
          <span class="promodiv" aria-hidden="true"></span>
          <span class="promocd" id="promoCountdown" data-ends-at="${ME.seedanceSale.endsAt}">
            <span class="lbl">⏳ Акция закончится через</span>
            <span class="boxes">
              <span class="box"><b data-cd-d>—</b><span>дней</span></span>
              <span class="box"><b data-cd-h>—</b><span>часов</span></span>
              <span class="box"><b data-cd-m>—</b><span>минут</span></span>
            </span>
          </span>
        </button>`;
    }

    /**
     * The Home tab's "TV banner" — a single looping showcase clip
     * (public/assets/tv/banner.mp4), styled as an old CRT set (design: .tv*
     * CSS above). Unlike promoBannerHtml() this is evergreen, not a
     * time-limited offer, so it carries none of the sale-gating logic — it
     * always renders. Tapping it opens Cinema Studio in video mode with
     * Seedance preselected (#tvBanner's click handler, wired alongside
     * #promoBanner's).
     *
     * Muted + autoplay + loop: a mobile WebView will refuse autoplay WITH
     * sound, so this stays silent by design rather than adding a toggle for
     * a feature that would fail on first render. `.reel`'s gradient still
     * renders underneath (z-index) — the fallback for a browser that can't
     * decode the file at all, not something that needs its own empty state.
     */
    function promoTv() {

          </svg>
          <div class="tv-shell">

            <span class="tv-grommet r"></span>
            <div class="tv-screen-frame">
              <div class="tv-screen">

                <div class="scanlines"></div>
                <div class="vignette"></div>
                <span class="rec"><i></i>REC</span>
                <span class="neuron-badge">
                  <svg class="neuron-mark" viewBox="0 0 100 100" aria-hidden="true">
                    <g stroke="currentColor" fill="currentColor" stroke-width="7" stroke-linecap="round">
                      <circle cx="50" cy="50" r="9" stroke="none" />
                      <g transform="translate(50 50) rotate(0)"><path d="M0,0 Q18,-10 32,-6" fill="none" /><circle cx="32" cy="-6" r="5" stroke="none" /></g>
                      <g transform="translate(50 50) rotate(40) scale(.82)"><path d="M0,0 Q18,-10 32,-6" fill="none" /><circle cx="32" cy="-6" r="5" stroke="none" /></g>
                      <g transform="translate(50 50) rotate(80)"><path d="M0,0 Q18,-10 32,-6" fill="none" /><circle cx="32" cy="-6" r="5" stroke="none" /></g>
                      <g transform="translate(50 50) rotate(120) scale(.82)"><path d="M0,0 Q18,-10 32,-6" fill="none" /><circle cx="32" cy="-6" r="5" stroke="none" /></g>
                      <g transform="translate(50 50) rotate(160)"><path d="M0,0 Q18,-10 32,-6" fill="none" /><circle cx="32" cy="-6" r="5" stroke="none" /></g>

                      <g transform="translate(50 50) rotate(280) scale(.82)"><path d="M0,0 Q18,-10 32,-6" fill="none" /><circle cx="32" cy="-6" r="5" stroke="none" /></g>

            <div class="tv-deck">
