        refChoiceOpen: false,
        // ——— Director Mode (Seedance) — spec: seedance-director-mode ———
        // Off by default so the fast path stays exactly today's studio. The
        // cast/locations/scenario survive a keep-reopen the same way photos
        // do — re-uploading a whole cast is the most expensive re-ask there is.
        director: prev ? !!prev.director : false,
        dmChars: prev ? prev.dmChars || [] : [], // [{id,label,photos:[{data,url}],text,sheetUrl,genId,pending,error,use}]
        dmLocs: prev ? prev.dmLocs || [] : [],
        dmSeq: prev ? prev.dmSeq || 0 : 0, // entry-id counter — ids feed /api/storyboard
        dmSec: prev ? prev.dmSec || { chars: false, locs: false, shot: false, sw: false } : { chars: false, locs: false, shot: false, sw: false },
        dmScenario: prev ? prev.dmScenario || "" : "",
        dmCands: prev ? prev.dmCands || null : null, // storyboard candidates from /api/storyboard
        dmCandIdx: prev && prev.dmCandIdx != null ? prev.dmCandIdx : null,
        dmSplitting: false, dmAssembling: false,
        dmDraftChar: prev ? prev.dmDraftChar || null : null,
        dmDraftLoc: prev ? prev.dmDraftLoc || null : null,
        // Screenwriter pipeline (docs/seedance-screenwriter-spec.md), gated by
        // ME.uiFeatures.screenwriterPipeline: a vision → plot + cast, feeding
        // the Director Mode fields above unchanged. Its open/closed state
        // lives in dmSec.sw, right alongside the other accordions. Survives
        // keep-reopen the same way dmScenario does.
        swVision: prev ? prev.swVision || "" : "",
        swVfxNotes: prev ? prev.swVfxNotes || "" : "",
        swExpanding: false,
        swPlot: prev ? prev.swPlot || null : null,
        // [{id, kind, label, hint, dmId, bgBusy}] — dmId links to the matching
        // stu.dmChars/dmLocs entry once its sheet exists; bgBusy while a
        // no-photo location's background frame is being generated.
        swEntities: prev ? prev.swEntities || null : null,
      };
      // A draft carried across a reopen must never arrive still "busy" — the
      // in-flight handler that set it died with the previous render.
      if (stu.dmDraftChar) stu.dmDraftChar.busy = false;
      if (stu.dmDraftLoc) stu.dmDraftLoc.busy = false;
      if (stu.swEntities) for (const e of stu.swEntities) e.bgBusy = false;
      if (!stu.modelKey) stu.modelKey = defaultStudioModel();
      clampStudioOpts();
      openSheet(); viewStudio();
    }
    /**
     * The enhancer button label, always derived from the real remaining stack.
     * It used to be the fixed string "1-е бесплатно", which kept promising a
     * free attempt to people who had already spent theirs — the feature looked
     * broken at exactly the moment it started charging.
     */
    function enhLabel() {
      const e = (ME && ME.enhance) || { left: 0, stack: 2, cost: 1 };
      if (e.left > 0) return `✨ Улучшить промпт · осталось ${e.left} из ${e.stack}`;
      return `✨ Улучшить промпт · ${e.cost} ${PATRON} за ${e.stack} попытки`;
    }

    function studioList() { return (ME.catalog.studio && ME.catalog.studio[stu.mode]) || []; }
    function studioModel() { return studioList().find((m) => m.key === stu.modelKey) || studioList()[0]; }
    /**
     * The finished sheets that will be attached to the NEXT render, in cast
     * order. This is what makes a sheet worth paying for: it is a reference
     * image the video model actually sees, not a gallery keepsake. Empty unless
     * Director Mode is the active composer, so nothing here can touch the plain
     * studio, presets, or any non-Seedance model.
     */
    // Each ticked sheet, paired with what it IS — {url, role: {kind,name}} —
    // so the server can tell Seedance "this one is Аня, this one is the
    // kitchen" instead of the old undifferentiated "these are all the same
    // person, repeated" (the single worst line in the pipeline before this;
    // see docs/ui-rebuild-v2.md §4). Characters before locations, cast order
    // within each — this order becomes @Image1, @Image2… and MUST match
    // whatever runStudio actually sends, or a name binds to the wrong picture.
    function dmRenderImages() {
      if (!stu || !stu.director || stu.mode !== "video") return [];
      const m = studioModel();
      if (!m || m.key !== "seedance") return [];
      const chars = dmCast("character").map((x) => ({ url: x.sheetUrl, role: { kind: "character", name: x.label } }));
      const locs = dmCast("location").map((x) => ({ url: x.sheetUrl, role: { kind: "location", name: x.label } }));
      return chars.concat(locs);
    }
    function dmRenderUrls() { return dmRenderImages().map((x) => x.url); }
    // A ticked sheet counts as an attached photo everywhere a photo counts:
    // it satisfies "нужно исходное фото", it pushes Seedance into reference
    // mode, and it is priced accordingly. Routing this through the SAME two
    // functions the manual reference grid already feeds is what keeps the
    // quoted price equal to the charged one.
    function stuHasSource() { return !!(stu.photo || stu.generationId || dmRenderUrls().length); }
    /**
     * Which of `m.seedanceTiers` (cheap/fast/quality/ref) actually applies
     * right now — mirrors routeSeedance (src/seedance.ts) exactly, so the
     * price/duration shown here is never one the server would disagree with.
     * Reference mode (≥2 photos, or any audio/video attached) always wins
     * over the toggle, same as server-side.
     */
    function activeSeedanceTierKey() {
      // Sheets beyond the first are extra references exactly like extra angles
      // are — the first one is already counted by stuHasSource().
      const sheetExtras = Math.max(0, dmRenderUrls().length - (stu.photo || stu.generationId ? 0 : 1));
      const refCount = (stuHasSource() ? 1 : 0) + (stu.extras || []).length + sheetExtras;
      const hasAvRef = (stu.refAudio || []).length > 0 || (stu.refVideo || []).length > 0;
      if (refCount >= 2 || hasAvRef) return "ref";
      return stu.seedanceTier || "fast";
    }
    /** `m` itself for any ordinary model; for the Seedance umbrella row, the
     *  tier sub-row (price/duration table) that's actually in effect. */
    function activeSeedanceRow(m) {
      return (m && m.seedanceTiers && m.seedanceTiers[activeSeedanceTierKey()]) || m;
    }
    function defaultStudioModel() {
      const list = studioList();
      if (!list.length) return null;
      if (stu.mode === "image") {
        const pref = stuHasSource() ? list.filter((m) => m.needsImage) : list.filter((m) => !m.needsImage);
        return (pref[0] || list[0]).key;
      }
      return list[0].key; // video: cheapest first
    }
    /** Clamp opts to the selected model's declared capabilities (E6). */
    function clampStudioOpts() {
      // A photo is attached but the selected engine draws from scratch and
      // would ignore it. Attaching a photo is an unambiguous statement of
      // intent — "use THIS" — so switch to an engine that actually reads it.
      // Without this, adding a photo after the model was already chosen (or
      // arriving from a text-to-image entry point) silently produced a picture
      // of a stranger, billed at full price. Runs BEFORE caps are read below,
      // so the rest of this function clamps against the model we end up on.
      if (stu.mode === "image" && stuHasSource()) {
        const cur = studioModel();
        if (cur && !cur.needsImage) {
          const edit = studioList().find((x) => x.needsImage);
          if (edit) stu.modelKey = edit.key;
        }
      }
      const m = studioModel();
      if (!m) return;
      stu.modelKey = m.key;
      // For the Seedance umbrella row, every capability check below (aspect,
      // resolution, duration) must read the tier actually in effect, not the
      // umbrella's own Fast-tier defaults — otherwise a future tier whose
      // schema diverges from Fast could pass a value the active tier would
      // reject. `activeSeedanceRow` is a no-op for every non-Seedance model.
      const capRow = activeSeedanceRow(m);
      const caps = stu.mode === "video" ? capRow.video : capRow.image;
      if (stu.aspect && !((caps && caps.aspectRatios) || []).includes(stu.aspect)) stu.aspect = undefined;
      if (stu.resolution && !((caps && caps.resolutions) || []).some((r) => r.id === stu.resolution)) stu.resolution = undefined;
      // Count (num_images) is images-only — a video model, or an image model
      // that doesn't declare maxCount (premium_*, unverified), gets no selector.
      const maxCount = stu.mode !== "video" && caps ? caps.maxCount || 0 : 0;
      if (!maxCount || (stu.numImages && stu.numImages > maxCount)) stu.numImages = undefined;
      // Extra angles: images-only, and only as many as the chosen model reads.
      // Swapping to a narrower model trims the tail rather than failing at
      // «Создать» — the server rejects an over-cap list outright.
      stu.extras = stu.extras || [];
      // Keyed off the MODEL's capability, not the mode. This used to force 1 for
      // any video model, which was true until Seedance's reference mode arrived —
      // it builds a clip from up to 9 photographs of the same subject.
      // Read from the MODEL, not from `caps`: caps is m.image or m.video by mode,
      // and the input limit belongs to neither — reading it off the video caps in
      // video mode is exactly what made Seedance's 9-photo reference mode
      // invisible from the day it shipped.
      const maxInputs = (m && m.maxInputs) || 1;
      if (stu.extras.length > maxInputs - 1) stu.extras = stu.extras.slice(0, Math.max(0, maxInputs - 1));
      // Switching to a model that does not read audio/video drops them: the
      // server would refuse the request anyway, and carrying them invisibly is
      // how a user ends up wondering why their sound was ignored.
      if (!m.reference) { stu.refAudio = []; stu.refVideo = []; stu.refRights = false; }
      if (stu.mode === "video" && capRow.video) {
        if (!capRow.video.durations.some((d) => d.seconds === stu.duration)) {
          // The model's own default, not the first entry — that is the shortest
          // option now that durations are full ranges.
          const def = capRow.video.defaultSeconds;
          stu.duration = capRow.video.durations.some((d) => d.seconds === def) ? def : capRow.video.durations[0].seconds;
        }
        // Seedance's reference mode (2+ photos, or any audio/video/named
        // sheet) and its start→end-frame morph are two different fal
        // endpoints (routeSeedance) — seedance_ref doesn't accept an end
        // frame at all. Say so once, the moment it actually happens, rather
        // than just letting the slot vanish from the grid with no explanation.
        if (!capRow.video.endFrame) {
          if (stu.endPhoto) toast("Финал недоступен в режиме нескольких фото — кадр убран", { wide: true, ms: 4500 });
          stu.endPhoto = null; stu.endGenerationId = null;
        }
      } else { stu.duration = undefined; stu.endPhoto = null; stu.endGenerationId = null; }
    }
    /**
     * What one length costs at the CURRENT quality — the number the slider
     * shows. studioPrice() answers "what will this render cost" for the
     * settings as they stand; this answers "what would it cost at N seconds",
     * which is what the user is deciding while dragging. Both apply the same
     * resolution multiplier, so the slider can never quote a price the CTA
     * badge then contradicts.
     */
    function stuDurPrice(seconds) {
      const m = activeSeedanceRow(studioModel());
      if (!m || !m.video) return 0;
      const d = m.video.durations.find((x) => x.seconds === seconds);
      let credits = d ? d.credits : m.credits;
      const t = stu.resolution ? (m.video.resolutions || []).find((r) => r.id === stu.resolution) : null;
      if (t && t.mult !== 1) credits = Math.ceil(credits * t.mult);
      return credits;
    }
    /** Same shape as stuDurPrice, but the pre-discount price — for the
     * dramatic before/after strikethrough on the duration slider. */
    function stuDurWasPrice(seconds) {
      const m = activeSeedanceRow(studioModel());
      if (!m || !m.video) return 0;
      const d = m.video.durations.find((x) => x.seconds === seconds);
      let credits = d ? d.wasCredits : m.wasCredits;
      const t = stu.resolution ? (m.video.resolutions || []).find((r) => r.id === stu.resolution) : null;
      if (t && t.mult !== 1) credits = Math.ceil(credits * t.mult);
      return credits;
    }

    /** Live patron total — exact client mirror of the server's priceFor. */
    function studioPrice() {
      const m0 = studioModel();
      if (!m0) return 0;
      const m = activeSeedanceRow(m0);
      let credits = m.credits;
      if (stu.mode === "video" && m.video) {
        const d = m.video.durations.find((x) => x.seconds === stu.duration);
        if (d) credits = d.credits;
        const t = stu.resolution ? (m.video.resolutions || []).find((r) => r.id === stu.resolution) : null;
        if (t && t.mult !== 1) credits = Math.ceil(credits * t.mult);
      } else if (m.image) {
        const t = stu.resolution ? (m.image.resolutions || []).find((r) => r.id === stu.resolution) : null;
        if (t) credits = t.credits;
        // Count composes multiplicatively on top of whichever resolution is
        // chosen — mirrors priceFor's exact `Math.ceil(credits × n)`.
        if (m.image.maxCount && stu.numImages && stu.numImages > 1) {
          credits = Math.max(1, Math.ceil(credits * Math.min(m.image.maxCount, stu.numImages)));
        }
      }
      return credits;
    }
    /** "≈40 сек" / "≈2 мин" — only ever from a MEASURED etaSeconds, never a guess. */
    function waitText(sec) {
      if (!sec) return "";
      return sec < 90 ? `≈${Math.round(sec)} сек` : `≈${Math.round(sec / 60)} мин`;
    }
    /**
     * The capability line under a model in the picker: measured wait, plus what
     * distinguishes this engine (max outputs / quality tiers for images, length
     * and end-frame for video). Only facts the registry actually declares.
     */
    function modelMeta(x, isVideo) {
      const bits = [];
      const w = waitText(x.etaSeconds);
      if (w) bits.push(w);
      if (isVideo && x.video) {
        const d = x.video.durations || [];
        if (d.length) bits.push(`${d.map((v) => v.seconds).join("/")} сек`);
        if (x.video.endFrame) bits.push("финальный кадр");
        if ((x.video.resolutions || []).length) bits.push(x.video.resolutions.map((r) => r.label).join("/"));
      } else if (x.image) {
        if (x.image.maxCount > 1) bits.push(`до ${x.image.maxCount} шт`);
        if ((x.image.resolutions || []).length) bits.push(x.image.resolutions.map((r) => r.label).join("/"));
      }
      return bits.length ? `<div class="mmeta">${esc(bits.join(" · "))}</div>` : "";
    }

    /**
     * The unified reference grid (docs/wireframes — home-studio wireframe,
     * version 2, S5-S7·S16): every reference photo beyond the primary one —
     * plain extra angles, the final frame, and (Director Mode) named
     * characters/locations — renders as a cell of ONE grid instead of three
     * disconnected UIs (an extras strip, a subject toggle, two collapsible
     * accordions). All of it already converges server-side into one
     * image_roles array (viewStudio's submit body) — this just makes the UI
     * match that.
     *
     * No "ракурс" framing, no person/product question: an extra photo is
     * just another photo. The distinction that used to justify both (whether
     * Seedance should read the reference as a face or an object) is gone —
     * referencePrompt's default wording covers it, and Director Mode's named
     * roles make the actual subject explicit when it matters.
     */
    function extrasBlock(m, isVideo, hasSource) {
      if (!hasSource) return "";
      const maxInputs = (m && m.maxInputs) || 1;
      const extras = stu.extras || [];
      const room = Math.max(0, maxInputs - 1 - extras.length);
      // Only the Seedance umbrella row is ever Director Mode-capable — its
      // catalog row deliberately borrows maxInputs/reference from
      // seedance_ref for exactly this reason (webapp.ts studioModelsOf).
      const dmCapable = m.key === "seedance";
      const dmOn = dmCapable && stu.director;
      // Mutually exclusive with reference mode, not just with Seedance in
      // general: routeSeedance sends 2+ photos (or any audio/video/named
      // sheet) to seedance_ref, which doesn't accept an end frame at all —
      // activeSeedanceRow already resolves to whichever tier is really
      // active, so this reads the SAME capability the server will enforce.
      const activeCaps = isVideo && m.video ? activeSeedanceRow(m).video : null;
      const showFinal = !!(activeCaps && activeCaps.endFrame);
      const sourceCells = extras.map((x, i) => `
        <div class="refslot filled"><img src="${x.data}" alt="" /><button class="xdel" type="button" data-xi="${i}" aria-label="Убрать">✕</button></div>`).join("");
      const charCells = dmOn ? (stu.dmChars || []).map((x) => dmEntryCellHtml("character", x)).join("") : "";
      const locCells = dmOn ? (stu.dmLocs || []).map((x) => dmEntryCellHtml("location", x)).join("") : "";
      const finalCell = showFinal ? (stu.endPhoto
        ? `<div class="refslot filled final"><img src="${stu.endPhoto}" alt="" /><button class="xdel" type="button" id="stuEndRedo" aria-label="Убрать">✕</button></div>`
        : `<label class="refslot final" for="stuEndFile"><span class="iic">🏁</span><span class="rf-lbl">финал</span><input type="file" accept="image/*" id="stuEndFile" style="display:none" /></label>`) : "";
      const canAddSource = room > 0;
      const canAddNamed = dmCapable;
      const addCell = canAddSource || canAddNamed
        ? `<button type="button" class="refslot add" id="refAddCell" aria-label="Добавить"><span>＋</span></button>` : "";
      const choiceRow = stu.refChoiceOpen ? `
        <div class="chips" id="refRoleAdd" style="margin-top:8px">
          ${canAddSource ? `<button type="button" class="chip" data-refrole="source">📷 Источник</button>` : ""}
          ${dmCapable ? `<button type="button" class="chip" data-refrole="character">👤 Персонаж</button>` : ""}
          ${dmCapable ? `<button type="button" class="chip" data-refrole="location">📍 Локация</button>` : ""}
        </div>` : "";
      const grid = sourceCells || charCells || locCells || finalCell || addCell
        ? `
          <div class="refhead">${qLabel("Ссылочные фото", "refroles")}</div>
          <div class="refgrid">
            ${sourceCells}${charCells}${locCells}${finalCell}${addCell}
            ${canAddSource ? `<input type="file" accept="image/*" id="stuExtraFile" multiple style="display:none" />` : ""}
          </div>
          ${canAddSource ? `<button type="button" class="gallery-link" id="refGalleryBtn">📁 из своих работ</button>` : ""}
          ${choiceRow}` : "";
      const addForms = dmOn ? `
        ${stu.dmSec.chars ? dmAddCardHtml("character") : ""}
        ${stu.dmSec.locs ? dmAddCardHtml("location") : ""}` : "";
      return `${grid}${addForms}${refMediaBlock(m)}`;
    }

    /**
     * Audio and video references — only for a model that declares it reads them.
     *
     * The rights notice is deliberately ABOVE the pickers and not behind a
     * "подробнее": a warning nobody reads before choosing a file is decoration.
     * The checkbox gates the file inputs themselves, and the server refuses an
     * upload that does not carry the same acknowledgement, so the two cannot
     * drift apart.
     */
    /** Read a file as a data: URL, unchanged — audio and video must not be
     *  re-encoded client-side the way photos are downscaled. */
    function readFileData(file) {
      return new Promise((resolve) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result || "") || null);
        r.onerror = () => resolve(null);
        r.readAsDataURL(file);
      });
    }

    /** Turn a media-upload rejection into something a person can act on. */
    function refUploadError(out) {
      const e = out && out.error;
      if (e === "too_large") return "Файл слишком большой — до 15 МБ для аудио и 12 МБ для видео";
      if (e === "too_long") return `Слишком длинный — до ${out.maxSeconds} секунд, у вас ${Math.round(out.seconds)}`;
      if (e === "too_short") return `Слишком короткий — нужно хотя бы ${out.minSeconds} секунды`;
      if (e === "bad_format") return "Не тот формат: аудио — MP3 или WAV, видео — MP4 или MOV";
      if (e === "unsafe_video") return "Это видео не подходит — попробуйте другое";
      if (e === "unreadable") return "Не удалось прочитать файл — попробуйте другой";
      if (e === "rights_required") return "Сначала подтвердите права на файл";
      return "Не удалось загрузить файл";
    }

    /** Max audio/video reference files — mirrors REF_LIMITS.audio.max /
     *  REF_LIMITS.video.max in src/media.ts, which the server enforces. */
    const REF_MEDIA_MAX = 3;
    /** One slot in an audio/video reference row — same filled/add/ghost
     *  states as the photo .refslot grid above, so the two rows read as one
     *  family. `kind` is "audio" or "video"; `sort` is the short "a"/"v" tag
     *  the delete handler's data-rdel="<sort>:<i>" already expects. */
    function refMediaSlotHtml(item, i, kind, sort, icon, ok, count, inputId) {
      if (item) {
        return `<div class="refslot filled ${kind}"><span class="rf-ic">${icon}</span><span class="rf-dur">${item.seconds}с</span><button class="xdel" data-rdel="${sort}:${i}" aria-label="Убрать">✕</button></div>`;
      }
      // Every empty slot in a row shares the SAME file input (via for=inputId)
      // — same convention as .refslot.add for the photo grid — and vanishes
      // (renders as an inert .ghost box instead) once rights aren't granted
      // yet or the row is already full, which is what disables picking here:
      // no JS toggle needed.
      if (ok && count < REF_MEDIA_MAX) return `<label class="refslot add ${kind}" for="${inputId}"><span>＋</span></label>`;
      return `<div class="refslot ghost" aria-hidden="true"></div>`;
    }

    function refMediaBlock(m) {
      if (!m || !m.reference) return "";
      const a = stu.refAudio || [];
      const v = stu.refVideo || [];
      const ok = !!stu.refRights;
      const audioSlots = Array.from({ length: REF_MEDIA_MAX }, (_, i) =>
        refMediaSlotHtml(a[i], i, "audio", "a", "🎵", ok, a.length, "stuAudioFile")).join("");
      const videoSlots = Array.from({ length: REF_MEDIA_MAX }, (_, i) =>
        refMediaSlotHtml(v[i], i, "video", "v", "🎬", ok, v.length, "stuVideoFile")).join("");
      return `
        <div class="xtra">
          ${qLabel("Звук и движение — по вашим файлам", "refmedia")}
          <label class="rights">
            <input type="checkbox" id="stuRights" ${ok ? "checked" : ""} />
            <span>Я имею право использовать эти файлы: это моя запись либо есть согласие людей, чьи голос и лицо на ней. Ответственность за загруженное несёт загрузивший.</span>
          </label>
          <div class="refsub audio"><span class="reflabel">🎵 Аудио</span><span class="refcount">${a.length} / ${REF_MEDIA_MAX}</span></div>
          <div class="refgrid">
            ${audioSlots}
            ${ok && a.length < REF_MEDIA_MAX ? `<input type="file" accept="audio/mpeg,audio/wav" id="stuAudioFile" style="display:none" />` : ""}
          </div>
          <div class="refsub video"><span class="reflabel">🎞️ Видео-референс</span><span class="refcount">${v.length} / ${REF_MEDIA_MAX}</span></div>
          <div class="refgrid">
            ${videoSlots}
            ${ok && v.length < REF_MEDIA_MAX ? `<input type="file" accept="video/mp4,video/quicktime" id="stuVideoFile" style="display:none" />` : ""}
          </div>
          <div class="sub" style="margin-top:6px">Аудио — MP3 или WAV до 15 секунд, к нему нужно фото. Видео — MP4 или MOV, 2–15 секунд. Цена не меняется.</div>
        </div>`;
    }

    /** Count chip prices for the current resolution — mirrors studioPrice's math per n. */
    function stuCountOptions(m, caps) {
      const tier = stu.resolution ? (caps.resolutions || []).find((r) => r.id === stu.resolution) : null;
      const base = tier ? tier.credits : m.credits;
      return Array.from({ length: caps.maxCount }, (_, i) => i + 1).map((n) => ({
        n, credits: Math.max(1, Math.ceil(base * n)),
      }));
    }

    /**
     * The video "story" quiz (VIDEO_STORY, src/models.ts) — one question per
     * card, fixed height so answering never reflows the rest of the composer.
     * Picking an option auto-advances (stu.storyStep++); "Назад" steps back to
     * revise a prior answer; skipping just advances without setting
     * stu.options[id] (every question stays optional, same as before this
     * rewrite — only the presentation changed). Past the last question the
     * card collapses into a summary row naming what was picked, tap "изменить"
     * to reopen at the first question.
     */
    function storyQuizHtml(story) {
      if (!story.length) return "";
      const step = Math.min(stu.storyStep ?? 0, story.length);
      if (step >= story.length) {
        const picked = story
          .map((s) => s.options.find((o) => o.id === stu.options[s.id]))
          .filter(Boolean);
        if (!picked.length) {
          return `
            <div class="storyq">
              <div class="sq-done"><span class="sq-ct" style="flex:1">Уточнения не выбраны</span>
                <button class="sq-edit" type="button" id="sqEdit">✎ добавить</button></div>
            </div>`;
        }
        return `
          <div class="storyq">
            <div class="sq-done">
              <div class="sq-tags">${picked.map((o) => `<span class="sq-tag">${esc(o.label)}</span>`).join("")}</div>
              <button class="sq-edit" type="button" id="sqEdit">✎ изменить</button>
            </div>
          </div>`;
      }
      const s = story[step];
      // Two independent ternaries (not one), each with its own literal ? "x"
      // branch — check:dead-css only captures a ternary's TRUE branch, so a
      // single a?"back":"fwd" would read "slide-fwd" as dead.
      const dir = `${stu.storyDir === "back" ? "slide-back" : ""} ${stu.storyDir !== "back" ? "slide-fwd" : ""}`.trim();
      return `
        <div class="storyq active ${dir}">
          <div class="sq-body" style="display:flex;flex-direction:column;gap:8px;height:100%">
            <div class="sq-head"><b>Уточнение сцены</b><span class="sq-ct">${step + 1} из ${story.length}</span></div>
            <div class="sq-q">${esc(s.question)}</div>
            <div class="sq-chips" data-story="${s.id}">${s.options.map((o) =>
              `<button class="chip ${stu.options[s.id] === o.id ? "on" : ""}" data-opt="${o.id}">${esc(o.label)}</button>`).join("")}</div>
            <div class="sq-foot">
              <button class="sq-back" type="button" id="sqBack" ${step === 0 ? "disabled" : ""}>← Назад</button>
              <button class="sq-skip" type="button" id="sqSkip">Пропустить →</button>
            </div>
          </div>
        </div>`;
    }

    /**
     * The params popup (S12-S15's pill row) — one option list per param key,
     * built from the SAME data every pill's current value already reads from
     * (caps.aspectRatios/resolutions, stuCountOptions, m.video.durations), so
     * the popup can never disagree with what the pill shows. Duration used to
     * be its own drag-scrub slider (durationSliderHtml/wireDurationSlider,
     * still used by the separate video-composer scenario picker — not
     * removed) — here it's a plain list like the other three, for one
     * consistent "tap pill, pick from a sheet" pattern across all params.
     */
    function paramPopupHtml(key, m, caps, isVideo) {
      let title = "", rows = [];
      if (key === "aspect") {
        title = "Формат кадра";
        const cur = stu.aspect || caps.aspectRatios[0];
        rows = caps.aspectRatios.map((r) => ({ id: r, label: esc(RATIO_LABEL[r] || r), on: r === cur }));
      } else if (key === "resolution") {
        title = "Качество";
        const cur = stu.resolution || caps.resolutions[0].id;
        rows = caps.resolutions.map((r) => ({ id: r.id, label: `${esc(r.label)} · ${r.credits} ${PATRON}`, on: r.id === cur }));
      } else if (key === "count") {
        title = "Количество";
        const cur = stu.numImages || 1;
        rows = stuCountOptions(m, caps).map((c) => ({ id: String(c.n), label: `${c.n} шт${c.n > 1 ? ` · ${c.credits} ${PATRON}` : ""}`, on: c.n === cur }));
      } else if (key === "duration") {
        // Kept as the original drag slider (durationSliderHtml/wireDurationSlider)
        // — a continuous 4-15s range reads better as a slider than a 12-row
        // list — just relocated from inline into the popup, pill shows the
        // current value the same way the other three params do.
        title = "Длительность";
        return `
          <div class="param-popup" id="paramPopup">
            <div class="param-popup-backdrop" data-popup-close></div>
            <div class="param-popup-sheet">
              <div class="pp-head"><b>${esc(title)}</b><button class="pp-x" type="button" data-popup-close aria-label="Закрыть">✕</button></div>
              <div id="stuDur">${durationSliderHtml(m.video.durations.map((d) => d.seconds), stu.duration || m.video.defaultSeconds, stuDurPrice, stuDurWasPrice)}</div>
            </div>
          </div>`;
      }
      return `
        <div class="param-popup" id="paramPopup">
          <div class="param-popup-backdrop" data-popup-close></div>
          <div class="param-popup-sheet">
            <div class="pp-head"><b>${esc(title)}</b><button class="pp-x" type="button" data-popup-close aria-label="Закрыть">✕</button></div>
            <div class="pp-list">${rows.map((r) =>
              `<button class="pp-row ${r.on ? "on" : ""}" type="button" data-popup-pick="${esc(r.id)}">${r.label}${r.on ? " ✓" : ""}</button>`).join("")}</div>
          </div>
        </div>`;
    }

    /**
     * Popup gallery browser — full paginated «Мои работы» instead of the last
     * ~8 pulled from already-loaded catalog data. Opens in "single" mode from
     * the primary photo picker (replaces stu.photo/generationId, same as
     * picking from the old inline strip) or "multi" mode from the reference
     * grid's "+" (appends to stu.extras, several at once).
     */
    function openGalleryPopup(mode) {
      stu.galleryOpen = true;
      stu.galleryMode = mode;
      stu.galleryPage = 1;
      stu.galleryFavOnly = false;
      stu.galleryData = null;
      stu.gallerySelected = [];
      viewStudio();
      loadGalleryPage();
    }
    function closeGalleryPopup() {
      stu.galleryOpen = false;
      viewStudio();
    }
    async function loadGalleryPage() {
      const page = stu.galleryPage, favOnly = stu.galleryFavOnly;
      const qs = `page=${page}&size=12${favOnly ? "&favorite=1" : ""}`;
      const { status, data } = await api(`/api/generations?${qs}`);
      // Stale-response guard: if the user changed page/filter again while this
      // request was in flight, drop the answer to the question we no longer
      // have open rather than let it clobber newer state.
      if (stu.galleryPage !== page || stu.galleryFavOnly !== favOnly) return;
      if (status === 200) stu.galleryData = data;
      viewStudio();
    }
    function galleryPopupHtml() {
      const d = stu.galleryData;
      const multi = stu.galleryMode === "multi";
      const selectedIds = new Set((stu.gallerySelected || []).map((x) => x.id));
      return `
        <div class="param-popup" id="galleryPopup">
          <div class="param-popup-backdrop" data-gallery-close></div>
          <div class="param-popup-sheet gallery-sheet">
            <div class="pp-head">
              <b>Мои работы</b>
              <div style="display:flex;align-items:center;gap:8px">
                <button class="gfav-toggle ${stu.galleryFavOnly ? "on" : ""}" type="button" id="galleryFavToggle">⭐ Избранное</button>
                <button class="pp-x" type="button" data-gallery-close aria-label="Закрыть">✕</button>
              </div>
            </div>
            ${!d ? `<div class="gallery-empty">Загрузка…</div>`
              : !d.items.length ? `<div class="gallery-empty">${stu.galleryFavOnly ? "Нет избранных работ" : "Пока нет готовых работ"}</div>`
              : `
                <div class="gallery-grid">${d.items.map((g) => `
                  <div class="gitem ${multi && selectedIds.has(g.id) ? "on" : ""}" data-gitem="${g.id}" data-gurl="${esc(g.output_url)}">
                    <img src="${esc(g.output_url)}" alt="" loading="lazy" />
                    <button class="gstar ${g.favorite ? "on" : ""}" type="button" data-gstar="${g.id}" aria-label="В избранное">${g.favorite ? "⭐" : "☆"}</button>
                    ${multi && selectedIds.has(g.id) ? `<span class="gcheck">✓</span>` : ""}
                  </div>`).join("")}</div>
                ${d.pages > 1 ? `
                  <div class="gallery-pager">
                    <button class="btn ghost" id="galleryPrev" ${d.page <= 1 ? "disabled" : ""}>← Назад</button>
                    <span>стр. ${d.page} из ${d.pages}</span>
                    <button class="btn ghost" id="galleryNext" ${d.page >= d.pages ? "disabled" : ""}>Далее →</button>
                  </div>` : ""}`}
            ${multi ? `<button class="btn primary" id="galleryConfirm" style="margin-top:10px" ${!stu.gallerySelected.length ? "disabled" : ""}>Добавить (${stu.gallerySelected.length})</button>` : ""}
          </div>
        </div>`;
    }

    function viewStudio() {
      const m = studioModel();
      if (!m) { st.tab = "shoot"; viewPick(); return; }
      const isVideo = stu.mode === "video";
      const caps = isVideo ? m.video : m.image;
      const list = studioList();
      const has = stuHasSource();
      // D6-A: compatible models lead; the rest stay reachable under «показать все».
      // The SELECTED model is always visible even before its photo arrives —
      // a preset's default edit-engine must never be hidden by the split.
      let primary = list, hidden = [];
      if (!isVideo && !has) {
        primary = list.filter((x) => !x.needsImage || x.key === stu.modelKey);
        hidden = list.filter((x) => x.needsImage && x.key !== stu.modelKey);
      } else if (!isVideo && has) {
        // The mirror case, and the reason it is an exclusion rather than a
        // «показать все» fold: with a photo attached, an engine that draws from
        // scratch cannot use it. Offering one behind a link only invites the
        // user to pick it and get a stranger's face back — clampStudioOpts
        // would then bounce the choice, which reads as a broken tap. So these
        // engines simply aren't on the menu until the photo is removed.
        primary = list.filter((x) => x.needsImage);
        if (!primary.length) primary = list; // registry has no edit model — don't strand the user
      }
      const works = myImages().slice(0, 8);
      const srcUrl = stu.srcPreview || (stu.generationId ? ((myImages().find((g) => g.id === stu.generationId) || {}).output_url || "") : "");
      const story = isVideo ? (ME.catalog.videoStory || []) : [];
      // One row of the model dropdown. The model's REAL name leads; everything
      // else is metadata the user needs to choose between engines — what it's
      // for, the wait, and the price.
      const modelRow = (x, scrubIdx) => `
        <button class="mrow ${x.key === stu.modelKey ? "on" : ""}" data-mk="${x.key}" data-mname="${esc(x.label.toLowerCase())}"${scrubIdx != null ? ` data-scrub-idx="${scrubIdx}"` : ""}>
          <span><b>${esc(x.label)}</b>
            ${x.note ? `<div class="mnote">${esc(x.note)}</div>` : ""}
            ${modelMeta(x, isVideo)}
            ${!isVideo && has && !x.needsImage ? `<div class="mnote">создаст с нуля — фото не использует</div>` : ""}
            ${!isVideo && !has && x.needsImage ? `<div class="mnote">нужно фото</div>` : ""}
            ${stu.preset && x.key === stu.preset.model ? `<div class="mnote">рекомендовано для этого стиля</div>` : ""}
          </span>
          <span class="price">${priceBlockHtml(x.credits, x.wasCredits, isVideo ? "от " : "")}</span>
        </button>`;

      // S2 (docs/wireframes/home-studio.v2.html): the preset arrives as a
      // removable TAG, not a textbox fill — the visible prompt box always
      // holds the user's OWN words. For an image+preset render that's still
      // wired as `custom` (curated prompt stays server-side, unchanged); for
      // video, or no preset at all, it's the same `prompt` field as always.
      const usesCustomField = !!stu.preset && !isVideo;
      const activePromptText = () => (usesCustomField ? stu.custom : stu.prompt);
      const promptVal = activePromptText();

      sheetBody.innerHTML = `
        <h3>Студия</h3>
        <div class="seg" id="stuSeg">
          <button data-md="image" class="${!isVideo ? "on" : ""}">🖼 Фото</button>
          <button data-md="video" class="${isVideo ? "on" : ""}">🎬 Видео</button>
        </div>
        ${isVideo && !has ? `<div class="sub">Для видео нужно исходное фото — добавьте его ниже или сначала создайте картинку.</div>` : ""}
        ${qLabel("Модель", "model")}
        <button class="mpick" id="stuMpick" aria-expanded="${stu.mopen ? "true" : "false"}">
          ${stu.mopen
            ? `<span><b>Выберите модель</b></span><span class="mchev">свернуть ▲</span>`
