              <div class="plate">
                <b>SEEDANCE · ЛУЧШЕЕ</b>
                <small>тапните — снимем в этом стиле</small>
              </div>
              <div class="deck-right">
                <span class="led"></span>
                <span class="grille"></span>
              </div>
            </div>
            <span class="tv-foot l"></span>
            <span class="tv-foot r"></span>
          </div>
        </button>`;
    }

    /** A section label, with a tap-to-explain "?" when we have something to say. */
    function qLabel(text, hintKey) {
      const hint = hintKey && HINTS[hintKey]
        ? ` <button class="qhint" type="button" data-hint="${hintKey}" aria-label="Что это такое?">?</button>` : "";
      return `<div class="quiz-q">${text}${hint}</div>`;
    }

    /**
     * Reward-architecture preset gating: a style locked behind an account Level.
     * Returns {need, have} when locked, or null when open — which is the state
     * of EVERY style until an admin gates one (preset_gating ships empty), so
     * this is a no-op for the whole catalog by default.
     */
    function presetLock(p) {
      const need = (p && p.minLevel) || 0;
      const have = (ME && ME.dashboard && ME.dashboard.level) || 0;
      return need > have ? { need, have } : null;
    }
    /** One wording for a lock, wherever it surfaces — card tap or a server 403. */
    function lockText(lock) {
      return `🔒 Этот стиль открывается на ${lock.need}-м уровне — у вас ${lock.have}.`;
    }

    /**
     * The pack with the best real ₸-per-patron rate — excluding time-limited
     * offers, which are deliberately priced BELOW the ladder as a tripwire
     * (see PACKS in src/models.ts), not a permanent "best value" to compare
     * against. Was previously two different things in two places: the
     * onboarding ladder slide computed this correctly; the buy page and
     * paywall instead hardcoded a fixed list slot («Популярный», packs[1])
     * and called it a recommendation regardless of whether it actually was
     * the best rate — a pack with a WORSE per-patron price than a bigger one
     * sitting right next to it, wearing a "best" ribbon. One honest
     * computation now, shared by every surface that tags a pack as the
     * value pick.
     */
    function bestValuePackId(packs) {
      return (packs || []).filter((p) => !p.offer && !p.once)
        .reduce((best, p) => (!best || p.kzt / p.credits < best.kzt / best.credits) ? p : best, null)?.id;
    }

    /**
     * What a pack's credits actually buy, in things instead of an abstract
     * number — the translation a raw patron count can't give on its own. Uses the
     * SAME real minimum prices the onboarding slides already show
     * (presetCredits, the cheapest video model), never an invented figure, so
     * it reads as "up to" rather than a promise: mixing photos and videos in
     * one purchase is the norm, this is just the two pure ends of that range.
     */
    function packYield(pack) {
      const c = (ME && ME.catalog) || {};
      const photoMin = c.presetCredits || 2;
      const videoMin = (c.videoModels || []).reduce((a, m) => Math.min(a, m.credits), 1e9);
      return {
        photos: Math.floor(pack.credits / Math.max(1, photoMin)),
        videos: Math.floor(pack.credits / Math.max(1, Math.min(videoMin, 1e9))),
      };
    }

    /**
     * One pack tile's inner markup — shared by the buy page and the paywall/
     * exit-offer sheets so the three surfaces never drift into three
     * different readings of the same `.pack` component. `opts.badge` is the
     * ribbon HTML (sale countdown / recommendation); `opts.warn` replaces the
     * yield row with a shortfall notice instead of "up to N photos" when this
     * specific pack can't finish what the user is trying to buy.
     */
    function packTileHtml(pack, opts) {
      opts = opts || {};
      const name = esc((pack.title || "").split(" — ")[0]);
      const per = (pack.kzt / pack.credits).toFixed(0);
      const { photos, videos } = packYield(pack);
      return `
        ${opts.badge || ""}
        <div class="packtop">
          <span class="packname">${name}</span>
          <span class="packprice">${pack.kzt.toLocaleString("ru-RU")} ₸</span>
        </div>
        <div class="packmid">
          <span class="amount">${PATRON} ${pack.credits}</span>
          <span class="per">≈ ${per} ₸ за ${PATRON}</span>
        </div>
        <div class="packyield${opts.warn ? " warn" : ""}">${opts.warn ? `<span>⚠️ ${esc(opts.warn)}</span>` : `
          <span><img class="appicon" src="/img/ic-frame.png" alt="" /> до ${photos} фото</span>
          <span><img class="appicon" src="/img/ic-film.png" alt="" /> до ${videos} видео</span>`}
        </div>`;
    }

    /**
     * One preset card — shared by the full Style Gallery sheet (viewPick)
     * and the Home tab's inline "Что снимаем?" grid, so the two surfaces
     * never drift apart. Badge layout: hot (real trending, no fabricated
     * numbers) top-left next to the no-art emoji fallback, usage-count
     * pill top-right (formatCount, e.g. "4.1K"), price bottom.
     */
    /* Below this many uses the count pill is hidden entirely rather than shown
       small. The pill is social proof, and proof only works in one direction:
       "4.1K" sells a style, "12" actively says nobody picks this. Suppressing
       it also protects a genuinely good new preset during its cold start —
       it competes on its art instead of on a number it cannot yet have. */
    const PROOF_MIN = 100;

    function presetCardHtml(p) {
      const lock = presetLock(p); // null = open (the default for every style)
      return `
      <button class="pcard ${lock ? "locked" : ""}" data-preset="${p.id}">
        <!-- previewUrl is derived from the id, so a style whose card art
             hasn't been produced yet 404s. Without this the card shows a
             broken-image icon; hiding the img falls back to the tile's own
             gradient, which looks deliberate. -->
        <img class="pbg" src="${esc(p.previewUrl)}" alt="" loading="lazy" onerror="this.remove()" />
        <div class="ptop">
          <span class="pleft">
            <span class="pemoji">${esc(p.label.split(" ")[0] || "✨")}</span>
            ${p.trending && !lock ? `<span class="phot">🔥</span>` : ""}
          </span>
          <span class="pright">
            ${p.usageCount >= PROOF_MIN && !lock ? `<span class="pcount">${formatCount(p.usageCount)}</span>` : ""}
            ${lock ? `<span class="plock">🔒 ур. ${lock.need}</span>` : ""}
          </span>
        </div>
        <!-- "от" because the card shows the 1-variant price: a style whose
             engine allows several variants multiplies it (see numImages in
             openStudio), so a bare number would understate the basket. -->
        <div class="prow"><b>${esc(p.label)}</b><span class="price">от ${p.credits} ${PATRON}</span></div>
      </button>`;
    }

    /** One campaign card, same shape as presetCardHtml — no usage/trending
     *  data exists at the campaign level, so none is shown (never fabricated). */
    function campaignCardHtml(k) {
      const art = CAMP_ART[k.id];
      return `
      <button class="pcard ${art ? "" : "noart"}" data-camp="${k.id}">
        ${art ? `<img class="pbg" src="/img/card-${esc(art.bg)}.jpg" alt="" loading="lazy" onerror="this.closest('.pcard').classList.add('noart')" />` : ""}
        <div class="ptop"><span class="pleft"><span class="pemoji">${esc(k.label.split(" ")[0] || "🎬")}</span></span></div>
        <b>${esc(k.label.slice(k.label.indexOf(" ") + 1))}</b>
        <div class="prow"><span class="price">${k.imageCredits} ${PATRON} + видео ${k.videoCredits} ${PATRON}</span></div>
      </button>`;
    }

    /** Home tab's inline gallery: Фото = real presets, Видео = real campaigns
     *  (no "video preset" category exists server-side, see docs/plan — this
     *  reuses catalog.campaigns rather than inventing one). Named distinctly
     *  from renderGallery(page) below (the "Мои работы" results pager) —
     *  same-scope function declarations of the same name silently shadow each
     *  other in a classic script, which is exactly the bug that shipped here
     *  the first time this was written. */
    /* Патрон is an invented currency, so "от 2 ${PATRON}" carries no sense of cost to
       anyone who hasn't bought a pack yet — the number could be trivial or
       expensive and nothing on screen says which, right at the point they're
       deciding whether to tap. One muted line under the grid anchors it in ₸.
       Derived from the real entry pack (cheapest standard, same filter the
       wallet uses) rather than a hardcoded rate, so it cannot drift from
       actual pricing; returns "" if the pack catalog is missing instead of
       guessing a number. */
    function unitHintHtml(d) {
      const entry = [...(d.packs || [])]
        .filter((p) => !p.offer && !p.once)
        .sort((a, b) => a.kzt - b.kzt)[0];
      if (!entry || !entry.credits) return "";
      return `<div class="hint">1 ${PATRON} ≈ ${Math.round(entry.kzt / entry.credits)} ₸ · пополнение от ${entry.kzt.toLocaleString("ru-RU")} ₸</div>`;
    }

    function renderPromptGallery(kind) {
      const grid = document.getElementById("galleryGrid");
      if (!grid) return;
      const c = ME.catalog;
      // Either side of the filter can legitimately come back empty — campaigns
      // unpublished, every photo preset level-gated. Mapping an empty array
      // rendered an empty string, leaving a blank hole under a segment that
      // still looked selectable: that reads as a broken app rather than an
      // empty shelf, and it points at the half that does have something.
      // .empty already spans the grid (grid-column: 1 / -1).
      const showEmpty = () => {
        grid.innerHTML = `<div class="empty">${kind === "video"
          ? "Видео-сценарии скоро вернутся.<br>Пока посмотрите Фото ✨"
          : "Здесь пока пусто.<br>Загляните в Видео ✨"}</div>`;
      };
      if (kind === "video") {
        const camps = c.campaigns || [];
        if (!camps.length) { showEmpty(); return; }
        grid.innerHTML = camps.map(campaignCardHtml).join("");
        grid.querySelectorAll("[data-camp]").forEach((b) => (b.onclick = () => { st.tab = "scenes"; openSheet(); viewCampaign(b.dataset.camp); }));
      } else {
        const list = (c.presets || []).filter((p) => p.category === "photo")
          .map((p, i) => ({ p, i }))
          .sort((a, b) => (b.p.usageCount - a.p.usageCount) || (a.i - b.i))
          .slice(0, 6);
        if (!list.length) { showEmpty(); return; }
        grid.innerHTML = list.map(({ p }) => presetCardHtml(p)).join("");
        grid.querySelectorAll(".pcard .pbg").forEach((img) => (img.onerror = () => img.closest(".pcard").classList.add("noart")));
        grid.querySelectorAll("[data-preset]").forEach((b) => (b.onclick = () => {
          const p = c.presets.find((x) => x.id === b.dataset.preset);
          const lock = presetLock(p);
          if (lock) { haptic("error"); toast(lockText(lock), { wide: true, ms: 5000 }); return; }
          const keep = !!(stu && stu.swap);
          if (stu) stu.swap = false;
          openStudio({ preset: p, origin: "preset", modelKey: p.model, keep });
        }));
      }
    }

    function viewPick() {
      const c = ME.catalog;
      let inner = "";
      // viewPick is now the GALLERY surface only (presets + scenarios) — the
      // video/text tabs route straight into the Studio composer (see bindTabs).
      if (st.tab === "video" || st.tab === "text") st.tab = "shoot";
      if (st.tab === "shoot" || st.tab === "product") {
        // Style Gallery: marketplace-style cards (preview photo, price, real
        // usage/trending) — see docs/prompt-library.md. Ordered by ACTUAL taps,
        // most-used first, so whatever is trending right now surfaces on its own
        // without anyone curating a list. usageCount comes from the events log
        // (never fabricated), so before there's traffic every count is 0 and the
        // catalog's declared order stands — a fresh deploy looks intentional,
        // not randomly shuffled.
        const cat = st.tab === "shoot" ? "photo" : "product";
        const list = c.presets.filter((p) => p.category === cat)
          .map((p, i) => ({ p, i }))
          .sort((a, b) => (b.p.usageCount - a.p.usageCount) || (a.i - b.i))
          .map(({ p }) => p);
        inner = `<div class="pcards">${list.map(presetCardHtml).join("")}</div>`;
      } else if (st.tab === "scenes") {
        inner = `<div class="choices">${c.campaigns.map((k) =>
          `<button class="choice" data-camp="${k.id}"><b>${esc(k.label)}</b><span class="desc">+ видео за ${k.videoCredits} ${PATRON}</span><span class="price">${k.imageCredits} ${PATRON}</span></button>`).join("")}</div>`;
      }
      sheetBody.innerHTML = `<h3>Студия</h3>${tabsHtml()}${inner}`;
      bindTabs();
      // Graceful degradation for a preset that ships before its preview art
      // does (see docs/prompt-library.md) — falls back to the emoji tile
      // instead of a broken image.
      sheetBody.querySelectorAll(".pcard .pbg").forEach((img) => (img.onerror = () => img.closest(".pcard").classList.add("noart")));

      sheetBody.querySelectorAll("[data-preset]").forEach((b) => (b.onclick = () => {
        const p = c.presets.find((x) => x.id === b.dataset.preset);
        // A locked style explains itself instead of opening a composer that
        // would only fail at "Создать" — the server rejects it either way, so
        // say so here, before the user invests any taps.
        const lock = presetLock(p);
        if (lock) { haptic("error"); toast(lockText(lock), { wide: true, ms: 5000 }); return; }
        // Preset tap → the Studio, prefilled. A ⇄-swap re-entry keeps the photo (E7).
        const keep = !!(stu && stu.swap);
        if (stu) stu.swap = false;
        openStudio({ preset: p, origin: "preset", modelKey: p.model, keep });
      }));
      sheetBody.querySelectorAll("[data-camp]").forEach((b) => (b.onclick = () => viewCampaign(b.dataset.camp)));
    }

    function viewCampaign(id) {
      const k = ME.catalog.campaigns.find((x) => x.id === id);
      sheetBody.innerHTML = `
        <h3>${esc(k.label)}</h3>
        <div class="sub">${esc(k.ask)}</div>
        <div class="choices">${k.presets.map((p) =>
          `<button class="choice" data-cp="${p.id}"><b>${esc(p.label)}</b><span class="price">${k.imageCredits} ${PATRON}</span></button>`).join("")}</div>
        <div class="row"><button class="btn ghost" id="backBtn">← Назад</button></div>`;
      sheetBody.querySelector("#backBtn").onclick = () => viewPick();
      sheetBody.querySelectorAll("[data-cp]").forEach((b) => (b.onclick = () => {
        st.pick = { source: "campaign", id: id + ":" + b.dataset.cp, campaignId: id, credits: k.imageCredits, needPhoto: true, options: [], custom: "" };
        if ((k.quiz || []).length) viewQuiz(k); else viewPhoto();
      }));
    }

    /** Story builder: one quick pick per step + a short free-words field. */
    function viewQuiz(k) {
      const sel = {}; // stepId -> optionId
      sheetBody.innerHTML = `
        <h3>Соберите свою историю</h3>
        <div class="sub">Пара быстрых выборов — и сцена станет вашей. Всё необязательно.</div>
        ${k.quiz.map((s) => `
          <div class="quiz-q">${esc(s.question)}</div>
          <div class="chips" data-step="${s.id}">${s.options.map((o) =>
            `<button class="chip" data-opt="${o.id}">${esc(o.label)}</button>`).join("")}</div>`).join("")}
        <div class="quiz-q">Пара слов от себя (необязательно)</div>
        <input class="words" id="qWords" maxlength="200" placeholder="например: с золотой короной и снегом" />
        <div class="stack">
          <button class="btn primary" id="qNext">Дальше →</button>
          <button class="btn ghost" id="backBtn">← Назад</button>
        </div>`;
      sheetBody.querySelectorAll(".chips").forEach((row) => {
        row.querySelectorAll(".chip").forEach((chip) => (chip.onclick = () => {
          const on = chip.classList.contains("on");
          row.querySelectorAll(".chip").forEach((c) => c.classList.remove("on"));
          if (!on) { chip.classList.add("on"); sel[row.dataset.step] = chip.dataset.opt; }
          else delete sel[row.dataset.step]; // tap again to unselect
        }));
      });
      sheetBody.querySelector("#backBtn").onclick = () => viewCampaign(k.id);
      sheetBody.querySelector("#qNext").onclick = () => {
        st.pick.options = Object.values(sel);
        st.pick.custom = sheetBody.querySelector("#qWords").value.trim();
        viewPhoto();
      };
    }

    /** The caller's previous image results — reusable as a source, no re-upload. */
    function myImages() {
      return (ME.generations || []).filter((g) => g.status === "ok" && g.output_url && !/\.(mp4|webm|mov)(\?|$)/i.test(g.output_url));
    }

    function viewPhoto() {
      st.photo = null; st.photoUrl = null; st.pick.generation_id = null;
      const works = myImages().slice(0, 10);
      sheetBody.innerHTML = `
        <h3>Ваше фото</h3>
        <div id="photoZone">
          <label class="drop"><input type="file" accept="image/*" id="file" />
            <span class="em">📸</span><b>Выбрать фото</b><span>снимите или выберите из галереи</span>
          </label>
          ${works.length ? `<div class="quiz-q">…или из моих работ</div>
          <div class="mini" id="mini">${works.map((g) =>
            `<img src="${esc(g.output_url)}" data-gid="${g.id}" loading="lazy" alt="" />`).join("")}</div>` : ""}
        </div>
        ${(st.pick.source === "preset" || st.pick.source === "campaign") && (ME.catalog.presetAspects || []).length > 1 ? `
        <div class="quiz-q">Формат кадра</div>
        <div class="chips" id="arRow">${ME.catalog.presetAspects.map((r) =>
          `<button class="chip ${r === (st.pick.aspect_ratio || "auto") ? "on" : ""}" data-ar="${r}">${esc(RATIO_LABEL[r] || r)}</button>`).join("")}</div>` : ""}
        <div class="stack">
          <button class="btn primary" id="goBtn" disabled>Создать за ${st.pick.credits} ${PATRON}</button>
          <button class="btn ghost" id="backBtn">← Назад</button>
        </div>`;
      sheetBody.querySelectorAll("#arRow .chip").forEach((c) => (c.onclick = () => {
        sheetBody.querySelectorAll("#arRow .chip").forEach((x) => x.classList.remove("on"));
        c.classList.add("on"); st.pick.aspect_ratio = c.dataset.ar;
      }));
      sheetBody.querySelector("#backBtn").onclick = () => viewPick();
      const goBtn = sheetBody.querySelector("#goBtn");
      sheetBody.querySelector("#file").onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const data = await downscale(f);
        if (!data) { toast("Не получилось прочитать фото"); return; }
        st.photo = data; st.photoUrl = null; st.pick.generation_id = null;
        sheetBody.querySelector("#photoZone").innerHTML = `
          <div class="photo-preview"><img src="${data}" alt="" /><button class="redo" id="redo">↺ Другое</button></div>`;
        sheetBody.querySelector("#redo").onclick = () => viewPhoto();
        goBtn.disabled = false;
      };
      sheetBody.querySelectorAll("#mini img").forEach((im) => (im.onclick = () => {
        sheetBody.querySelectorAll("#mini img").forEach((x) => x.classList.remove("on"));
        im.classList.add("on");
        st.photo = null; st.photoUrl = null;
        st.pick.generation_id = Number(im.dataset.gid); // server resolves the URL, owner-scoped
        goBtn.disabled = false;
      }));
      goBtn.onclick = () => run();
    }

    /** Downscale to ≤1600px JPEG so uploads stay light on mobile networks. */
    function downscale(file) {
      return new Promise((resolve) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
          const cv = document.createElement("canvas");
          cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
          URL.revokeObjectURL(url);
          resolve(cv.toDataURL("image/jpeg", 0.9));
        };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
      });
    }

    async function ensureUploaded() {
      if (st.photoUrl || !st.photo) return st.photoUrl;
      const url = await uploadData(st.photo);
      if (!url) { toast("Не удалось загрузить фото — попробуйте ещё раз"); return null; }
      return (st.photoUrl = url);
    }

    /** Upload a downscaled data-URL to fal storage; returns the HTTPS url or null. */
    async function uploadData(dataUrl) {
      const { status, data } = await api("/api/upload", { method: "POST", body: JSON.stringify({ data: dataUrl }) });
      return status === 200 ? data.url : null;
    }

    async function run(payloadOverride) {
      const pick = st.pick;
      const isVideo = pick.source === "campaign_video" || (pick.source === "model" && ME.catalog.videoModels.some((m) => m.key === pick.model));
      viewProgress(isVideo);

      let image_url;
      if (pick.needPhoto && !pick.generation_id) {
        image_url = await ensureUploaded();
        if (!image_url) { viewPhoto(); return; }
      }
      // Optional video end frame: upload the chosen file (a picked own-work goes by id).
      let end_image_url;
      if (!payloadOverride && pick.end_photo && !pick.end_generation_id) {
        end_image_url = await uploadData(pick.end_photo);
        if (!end_image_url) { toast("Не удалось загрузить финальный кадр"); viewPick(); return; }
      }

      const body = payloadOverride || {
        source: pick.source, id: pick.id, model: pick.model,
        prompt: pick.prompt, image_url,
        generation_id: pick.generation_id || undefined,
        options: pick.options && pick.options.length ? pick.options : undefined,
        custom: pick.custom || undefined,
        duration: pick.duration || undefined,
        aspect_ratio: pick.aspect_ratio && pick.aspect_ratio !== "auto" ? pick.aspect_ratio : undefined,
        resolution: pick.resolution || undefined,
        end_image_url,
        end_generation_id: pick.end_generation_id || undefined,
        scene: pick.scene || undefined,
      };
      st.retry = { body, campaignId: pick.campaignId || null };
      const { status, data } = await api("/api/generate", { method: "POST", body: JSON.stringify(body) });
      if (status === 402) { viewPaywall(data); return; }
      // A level-gated style: a normal, explainable state — not a failure.
      if (status === 403 && data && data.error === "level_locked") {
        haptic("error"); toast(lockText({ need: data.requiredLevel, have: data.level }), { wide: true, ms: 5000 }); viewPick(); return;
      }
      if (status !== 200) { toast("Что-то пошло не так — попробуйте ещё раз"); viewPick(); return; }
      setBalance(data.balance);
      startJob(data.id, isVideo, pick.campaignId || null, etaFor(data.model || pick.model));
    }

    /** Register an independent render job and show its progress in the sheet. */
    /** Measured ETA for a model key, from the catalog (0 = not enough data yet). */
    function etaFor(modelKey) {
      const all = [...((ME.catalog.studio || {}).image || []), ...((ME.catalog.studio || {}).video || [])];
      const m = all.find((x) => x.key === modelKey);
      return (m && m.etaSeconds) || 0;
    }
    function startJob(id, isVideo, campaignId, etaSec) {
      const job = { id, isVideo, campaignId, started: Date.now(), etaSec: etaSec || 0 };
      jobs.set(id, job); updateJobsPill();
      viewedJob = id; viewProgress(isVideo, id, job.etaSec);
      pollJob(job);
      renderGallery(1); // pending ripple card appears in «Мои работы» immediately
    }

    /**
     * Reload-safe in-progress renders (docs/cinema-studio-spec.md §4.1): the
     * jobs map dies with the page, but the DB doesn't — /api/me ships the last
     * 30 generations including status:'pending'. Re-register a silent poll job
     * for each so the jobs pill + the gallery's ripple cards come back exactly
     * as if the reload never happened. No sheet is opened (silent resume);
     * completion lands via the normal pollJob path (toast + gallery refresh),
     * a failure shows the refunded toast. The 6-min client window restarts —
     * the server reaper still guarantees a terminal state for true zombies.
     */
    function resumePending() {
      let added = 0;
      for (const g of ME.generations || []) {
        if (g.status === "pending" && !jobs.has(g.id)) {
          const isVideo = (ME.catalog.videoModels || []).some((m) => m.key === g.model) || /^dub_/.test(g.model || "");
          const job = { id: g.id, isVideo, campaignId: null, started: Date.now(), resumed: true, etaSec: etaFor(g.model) };
          jobs.set(g.id, job);
          pollJob(job);
          added++;
        }
      }
      updateJobsPill();
      return added;
    }

    /**
     * `etaSec` is a MEASURED median of our own recent runs for this model (0 when
     * we don't have enough samples yet) — so the countdown is a real estimate,
     * not decoration. With no data we keep the honest coarse copy instead of
     * inventing a number. The counter never claims "готово": once it runs out it
     * says "почти готово", because the truth is the poll hasn't returned yet.
     */
    function viewProgress(isVideo, jobId, etaSec) {
      openSheet();
      const job = jobId ? jobs.get(jobId) : null;
      const eta = etaSec || (job && job.etaSec) || 0;
      const coarse = isVideo ? "Обычно 1–3 минуты." : "Обычно 10–30 секунд ✨";
      sheetBody.innerHTML = `
        <div class="progress">
          <div class="orb"></div>
          <h4>${isVideo ? "Рендерим видео…" : "Генерируем…"}</h4>
          <p id="etaLine">${eta ? "" : coarse}</p>
        </div>
        <div class="stack">
          <button class="btn ghost" id="hideBtn">⬇ Свернуть — рендер продолжится в фоне</button>
        </div>`;
      sheetBody.querySelector("#hideBtn").onclick = () => closeSheet();
      if (jobId) viewedJob = jobId;
      if (eta && job) startEtaTicker(job, eta);
    }
    /** Ticks the remaining-time line until the job finishes or the sheet moves on. */
    function startEtaTicker(job, eta) {
      clearInterval(window._etaT);
      const tick = () => {
        const line = document.getElementById("etaLine");
        // The sheet moved on (result, another view) or the job finished — stop.
        if (!line || !jobs.has(job.id)) { clearInterval(window._etaT); return; }
        const left = Math.ceil(eta - (Date.now() - job.started) / 1000);
        line.textContent = left > 0 ? `Осталось ${waitText(left)}` : "Почти готово…";
      };
      tick();
      window._etaT = setInterval(tick, 1000);
    }

    /** Each job polls on its own timer — jobs never block each other. */
    function pollJob(job) {
      setTimeout(async () => {
        if (!jobs.has(job.id)) return; // already finished elsewhere
        const { status, data } = await api("/api/generations/" + job.id);
        if (status === 200 && data.status === "ok") {
          // The XP a finished render earns should visibly come FROM the render:
          // the open result if the user is looking at it, else the jobs pill,
          // which is where their attention was.
          jobs.delete(job.id); updateJobsPill();
          xpOrigin = (viewedJob === job.id && sheet.classList.contains("on"))
            ? sheetBody : document.getElementById("jobsPill");
          refreshMe(); renderGallery(1); haptic("success");
          // A Director Mode sheet render lands on its entry card in the
          // composer, not in the result view — the studio stays where it was.
          if (job.dmSheet) { dmSheetDone(job, data); return; }
          if (job.swBg) { swBgDone(job, data); return; }
          if (viewedJob === job.id && sheet.classList.contains("on")) viewResult(data, job);
          else toast("✨ Готово! Работа уже в «Мои работы»");
          return;
        }
        if (status === 200 && data.status === "error") {
          jobs.delete(job.id); updateJobsPill(); refreshMe(); renderGallery(1); haptic("error");
          if (job.dmSheet) { dmSheetFail(job, data); return; }
          if (job.swBg) { swBgFail(job, data); return; }
          // The server now says WHY (error_reason code) — map it to copy a
          // person can act on; a legacy null keeps today's generic line.
          if (data.error_reason) toast(genErrText(data.error_reason), { wide: true, ms: 5500 });
          else toast(`Не получилось — ${PATRON} патроны возвращены`);
          if (viewedJob === job.id && sheet.classList.contains("on")) viewPick();
          return;
        }
        if (Date.now() - job.started > 6 * 60 * 1000) {
          // The client gives up here, but the row is still 'pending' server-side
          // until the reaper (src/monitor.ts, ~15 min) flips it and refunds. That
          // refund has no other trigger to reach the visible balance — without
          // this call the pill silently drifts stale until some unrelated action
          // happens to refresh it.
          jobs.delete(job.id); updateJobsPill(); refreshMe(); renderGallery(1);
          // A sheet's card owns its own spinner, and giving up on the poll has
          // to clear it — otherwise the entry spins forever, retry stays
          // disabled behind `pending`, and the photos behind it are stranded.
          if (job.dmSheet) {
            const entry = dmSheetEntry(job);
            if (entry) { entry.pending = false; entry.error = "рендер идёт дольше обычного"; }
            toast("Карта готовится дольше обычного — она появится в «Мои работы»", { wide: true, ms: 5000 });
            if (dmComposerVisible()) viewStudio();
            return;
          }
          if (job.swBg) {
            const e = (stu.swEntities || []).find((x) => x.id === job.swBg.entityId);
            if (e) e.bgBusy = false;
            toast("Фон готовится дольше обычного — он появится в «Мои работы»", { wide: true, ms: 5000 });
            if (dmComposerVisible()) viewStudio();
            return;
          }
          toast("Долгий рендер — результат появится в «Мои работы»");
          if (viewedJob === job.id && sheet.classList.contains("on")) closeSheet();
          return;
        }
        pollJob(job);
      }, 2500);
    }

    function viewResult(g, job) {
      const isVideo = /\.(mp4|webm|mov)(\?|$)/i.test(g.output_url || "");
      // A count>1 image render (num_images) carries every output here — video is
      // never multi-output, so isVideo generations always take the single path.
      const multi = !isVideo && g.output_urls && g.output_urls.length > 1 ? g.output_urls : null;
      const camp = job?.campaignId ? ME.catalog.campaigns.find((x) => x.id === job.campaignId) : null;
      const upsell = camp && !isVideo
        ? `<button class="btn primary" id="animBtn">${esc(camp.animateLabel)} · ${camp.videoCredits} ${PATRON}</button>`
        : !isVideo
          ? `<button class="btn primary" id="animBtn2">🎬 Оживить в видео · ${ME.catalog.videoModels[0].credits} ${PATRON}</button>`
          : "";
      sheetBody.innerHTML = `
        <h3>Готово ✨${multi ? ` · ${multi.length} варианта` : ""}</h3>
        <div class="result-media"${multi ? ` style="display:grid;grid-template-columns:1fr 1fr;gap:8px"` : ""}>${
          multi ? multi.map((u) => `<img src="${esc(u)}" alt="" style="border-radius:12px" />`).join("")
          : isVideo
            ? `<video src="${esc(g.output_url)}" controls autoplay muted loop playsinline></video>`
            : `<img src="${esc(g.output_url)}" alt="" />`
        }</div>
        <div class="stack">
          ${upsell}
          <div class="row" style="margin-top:0">
            <button class="btn ghost" id="saveBtn">📥 Скачать${multi ? " всё" : ""}</button>
            <button class="btn ghost" id="chatBtn">💬 В чат</button>
          </div>
          <div class="row" style="margin-top:0">
            ${multi ? "" : `<a class="btn ghost" href="${esc(g.output_url)}" target="_blank" rel="noopener noreferrer">↗ Открыть</a>`}
            <button class="btn ghost" id="moreBtn">➕ Ещё</button>
          </div>
          <div class="row" style="margin-top:0">
            <button class="btn ghost" id="detBtn">ℹ️ Детали и повтор</button>
          </div>
        </div>`;
      // Upsells reference the generation by ID — the server resolves the file,
      // so chains survive app restarts and never depend on client state. When
      // multiple images came back, "оживить" always animates the FIRST one
      // (there's no per-tile picker here — pick a specific one from the gallery).
      const animBtn = sheetBody.querySelector("#animBtn");
      if (animBtn) animBtn.onclick = () => {
        const m = ME.catalog.videoModels.find((x) => x.key === camp.videoModelKey) || ME.catalog.videoModels[0];
        st.pick = { source: "campaign_video", id: camp.id, campaignId: camp.id, credits: camp.videoCredits, needPhoto: false, generation_id: g.id, options: [], custom: "" };
        viewVideoComposer(m);
      };
      const animBtn2 = sheetBody.querySelector("#animBtn2");
      if (animBtn2) animBtn2.onclick = () => openStudio({ mode: "video", generationId: g.id, srcPreview: g.output_url });
      sheetBody.querySelector("#saveBtn").onclick = () => {
        if (multi) multi.forEach((u, i) => saveMedia(u, `${g.id}-${i}`));
        else saveMedia(g.output_url, g.id);
        awardSaveXp(g.id);
      };
      sheetBody.querySelector("#chatBtn").onclick = () => sendToChat(g.id);
      sheetBody.querySelector("#moreBtn").onclick = () => { st.pick = null; viewPick(); };
      // The poll payload is a thin projection — the freshly refreshed /api/me
      // row carries the full metadata (source/opts/user_prompt) when present.
      sheetBody.querySelector("#detBtn").onclick = () =>
        openViewer((ME.generations || []).find((x) => x.id === g.id) || g);
    }

    /**
     * Reward-architecture P1: fire-and-forget XP claim for saving a result.
     * Server-side idempotent (once per generation, daily-capped) and a no-op
     * until an admin configures xp.save — never blocks or reports errors to
     * the user, since it's not the point of tapping "Скачать".
     */
    function awardSaveXp(generationId) {
      api("/api/xp/save", { method: "POST", body: JSON.stringify({ id: generationId }) }).catch(() => {});
    }

    /** Save to the device: Telegram's native downloadFile when available. */
    function saveMedia(url, id) {
      const isVideo = /\.(mp4|webm|mov)(\?|$)/i.test(url);
      const name = `neuroshot-${id}${isVideo ? ".mp4" : ".jpg"}`;
      if (tg?.downloadFile) {
        try { tg.downloadFile({ url, file_name: name }, () => {}); return; } catch (e) { /* fall through */ }
      }
      const a = document.createElement("a");
      a.href = url; a.download = name; a.target = "_blank"; a.rel = "noopener";
      document.body.appendChild(a); a.click(); a.remove();
    }

    /** Deliver the file into the user's Telegram chat with the bot. */
    async function sendToChat(id) {
      const { status } = await api("/api/send", { method: "POST", body: JSON.stringify({ id }) });
      if (status === 200) { haptic("success"); toast("Отправлено в чат с ботом 💬"); }
      else toast("Не удалось отправить — попробуйте позже");
    }

    /**
     * Gallery item viewer + detail sheet: the media, then everything the row's
     * public metadata can honestly say (model, source kind, the user's OWN
     * prompt when one exists — never curated text, which the server no longer
     * ships at all), and the actions: recreate / use-as-reference / save /
     * send to chat / animate. Legacy rows with all-null metadata degrade to
     * exactly the old viewer plus a model/price/date card.
     */
    function openViewer(item) {
      openSheet(); viewedJob = null;
      const isVideo = /\.(mp4|webm|mov)(\?|$)/i.test(item.output_url || "");
      const multi = !isVideo && item.output_urls && item.output_urls.length > 1 ? item.output_urls : null;
      const isSheet = item.source_kind === "sheet" || !!(item.opts && item.opts.sheet);
      sheetBody.innerHTML = `
        <h3>Моя работа${multi ? ` · ${multi.length} варианта` : ""}${isSheet ? ` <span class="gbadge">🗂 карта</span>` : ""}</h3>
        <div class="result-media"${multi ? ` style="display:grid;grid-template-columns:1fr 1fr;gap:8px"` : ""}>${
          multi ? multi.map((u) => `<img src="${esc(u)}" alt="" style="border-radius:12px" />`).join("")
          : isVideo
            ? `<video src="${esc(item.output_url)}" controls autoplay muted loop playsinline></video>`
            : `<img src="${esc(item.output_url)}" alt="" />`
        }</div>
        ${genMetaHtml(item)}
        <div class="stack">
          ${!isVideo ? `<button class="btn primary" id="vAnim">🎬 Оживить в видео · от ${ME.catalog.videoModels.reduce((a, m) => Math.min(a, m.credits), 1e9)} ${PATRON}</button>` : ""}
          ${canRecreate(item) || !isVideo ? `<div class="row" style="margin-top:0">
            ${canRecreate(item) ? `<button class="btn ghost" id="vRepeat">↻ Повторить</button>` : ""}
            ${!isVideo ? `<button class="btn ghost" id="vRef">🖼 Как референс</button>` : ""}
          </div>` : ""}
          <div class="row" style="margin-top:0">
            <button class="btn ghost" id="vSave">📥 Скачать${multi ? " всё" : ""}</button>
            <button class="btn ghost" id="vChat">💬 В чат</button>
          </div>
          <div class="row" style="margin-top:0">
            ${multi ? "" : `<a class="btn ghost" href="${esc(item.output_url)}" target="_blank" rel="noopener noreferrer">↗ Открыть</a>`}
            <button class="btn ghost" id="vMore">✨ Создать ещё</button>
          </div>
        </div>`;
      const vAnim = sheetBody.querySelector("#vAnim");
      if (vAnim) vAnim.onclick = () => viewAnimateFrom(item);
      const vRepeat = sheetBody.querySelector("#vRepeat");
      if (vRepeat) vRepeat.onclick = () => recreateFrom(item);
      // The output as a SOURCE for a new image render — the same owner-scoped
      // generation_id mechanism «Оживить» already uses, image mode instead.
      const vRef = sheetBody.querySelector("#vRef");
      if (vRef) vRef.onclick = () => openStudio({ mode: "image", generationId: item.id, srcPreview: item.output_url });
      sheetBody.querySelector("#vSave").onclick = () => {
        if (multi) multi.forEach((u, i) => saveMedia(u, `${item.id}-${i}`));
        else saveMedia(item.output_url, item.id);
        awardSaveXp(item.id);
      };
      sheetBody.querySelector("#vChat").onclick = () => sendToChat(item.id);
      sheetBody.querySelector("#vMore").onclick = () => { st.pick = null; viewPick(); };
    }

    /** Animate a previous work: straight into the Studio, video mode, source = gen id. */
    function viewAnimateFrom(item) {
      openStudio({ mode: "video", generationId: item.id, srcPreview: item.output_url });
    }

    // ——————————————————————————————————————————————————————————————————
    // Generation metadata: labels, error reasons, recreate — shared by the
    // detail sheet (openViewer), the failed strip in «Мои работы» and the
    // Director Mode entry cards.
    // ——————————————————————————————————————————————————————————————————
    /** Human RU copy for a generation error_reason CODE (the server sends
     *  codes, the client owns the wording). null/unknown → generic line. */
    function genErrText(reason) {
      return {
        moderation: "Это фото не подходит для обработки — патроны возвращены. Загрузите другое фото.",
        provider_blocked: "Сервис генерации временно недоступен — патроны возвращены. Попробуйте позже.",
        provider_error: "Не получилось — патроны автоматически возвращены. Попробуйте ещё раз.",
        timeout: "Рендер завис и был остановлен — патроны возвращены.",
      }[reason] || `Не получилось — ${PATRON} патроны возвращены`;
    }
    /** Short form for tight cards (Director entry rows, the failed strip). */
    // Codes mirror ErrorReason (src/generate.ts) exactly — no fifth key here,
    // because the server never emits one. A local-only failure (e.g. a photo
    // that failed to upload before any request was sent) is never routed
    // through this map; it gets its own toast at the call site instead.
    function genErrShort(reason) {
      return {
        moderation: "фото не прошло проверку — попробуйте другое",
        provider_blocked: "сервис был недоступен",
        provider_error: "ошибка генерации",
        timeout: "рендер завис и был остановлен",
      }[reason] || "ошибка генерации";
    }
    /** Display name for a model key. Resolved Seedance tier keys (the rows the
     *  server writes) have no picker row of their own — map them back onto the
     *  umbrella label plus the tier word a user actually picked. */
    function modelLabelFor(key) {
      const c = (ME && ME.catalog) || {};
      const all = [...(((c.studio || {}).image) || []), ...(((c.studio || {}).video) || [])];
      const hit = all.find((m) => m.key === key) || (c.videoModels || []).find((m) => m.key === key);
      if (hit) return hit.label;
      if (/^seedance/.test(key || "")) {
        const umb = (((c.studio || {}).video) || []).find((m) => m.key === "seedance");
        const tier = key === "seedance_mini" ? "Дёшево" : key === "seedance_fast" ? "Быстро" : key === "seedance_ref" ? "По референсам" : "Качество";
        return `${umb ? umb.label : "Seedance"} · ${tier}`;
      }
      return key || "—";
    }
    /** What made this row — catalog labels only, NEVER stored prompt text. */
    function sourceLabelFor(g) {
      const k = g.source_kind;
      const c = (ME && ME.catalog) || {};
      if (k === "preset") {
        const p = (c.presets || []).find((x) => x.id === g.source_id);
        return p ? `Стиль: ${p.label}` : "Готовый стиль";
      }
      if (k === "campaign" || k === "campaign_video") {
        const camp = (c.campaigns || []).find((x) => x.id === String(g.source_id || "").split(":")[0]);
        return camp ? `Сценарий: ${camp.label}` : "Сценарий";
      }
      if (k === "sheet") {
        const s = (g.opts && g.opts.sheet) || {};
        return `${s.sheetType === "location" ? "Карта локации" : "Карта персонажа"}${s.label ? ` · ${s.label}` : ""}`;
      }
      if (k === "model") return "Своя идея";
      return null; // legacy/bot rows: unknown — say nothing rather than guess
    }
    /** Detail rows — only fields the payload actually carries, so legacy
     *  rows degrade to model/price/date without empty placeholders. */
    function genMetaHtml(g) {
      const rows = [];
      if (g.model) rows.push(["Модель", modelLabelFor(g.model)]);
      const src = sourceLabelFor(g);
      if (src) rows.push(["Источник", src]);
      const o = g.opts || {};
      const bits = [];
      if (o.aspect) bits.push(o.aspect);
      if (o.resolution) bits.push(o.resolution);
      if (o.duration) bits.push(`${o.duration} сек`);
      if (o.count) bits.push(`${o.count} шт`);
      if (o.tier) bits.push({ cheap: "тариф «Дёшево»", fast: "тариф «Быстро»", quality: "тариф «Качество»" }[o.tier] || o.tier);
      if (bits.length) rows.push(["Параметры", bits.join(" · ")]);
      if (o.refs && (o.refs.photos || o.refs.audio || o.refs.video)) {
        const r = [];
        if (o.refs.photos) r.push(`${o.refs.photos} фото`);
        if (o.refs.audio) r.push(`${o.refs.audio} аудио`);
        if (o.refs.video) r.push(`${o.refs.video} видео`);
        rows.push(["Референсы", r.join(" · ")]);
      }
      if (g.credits != null) rows.push(["Цена", g.credits > 0 ? `${g.credits} ${PATRON}` : "бесплатно"]);
      if (g.created_at) {
        const d = new Date(g.created_at);
        if (!isNaN(d.getTime())) rows.push(["Дата", d.toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })]);
      }
      if (g.created_at && g.finished_at) {
        const sec = Math.round((Date.parse(g.finished_at) - Date.parse(g.created_at)) / 1000);
        if (sec > 0 && sec < 3600) rows.push(["Рендер", sec < 90 ? `${sec} сек` : `≈${Math.round(sec / 60)} мин`]);
      }
      const up = g.user_prompt ? `<div class="mr"><span>Промпт</span><b>${esc(g.user_prompt)}</b></div>` : "";
      if (!rows.length && !up) return "";
      return `<div class="gmeta">${rows.map(([k, v]) => `<div class="mr"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}${up}</div>`;
    }
    function isVideoModelKey(key) {
      if (/^seedance|^dub_/.test(key || "")) return true;
      const c = (ME && ME.catalog) || {};
      return (((c.studio || {}).video) || []).some((m) => m.key === key) || (c.videoModels || []).some((m) => m.key === key);
    }
    /** Can «Повторить» honestly replay this row? Sheets can't (their source
     *  photos are not stored); catalog entries must still exist. */
    function canRecreate(g) {
      const k = g.source_kind;
      if (k === "sheet") return false;
      if (k === "preset") return (ME.catalog.presets || []).some((p) => p.id === g.source_id);
      if (k === "campaign" || k === "campaign_video") {
        return (ME.catalog.campaigns || []).some((c) => c.id === String(g.source_id || "").split(":")[0]);
      }
      // "model" rows replay fully; legacy null-kind rows at least reopen the
      // studio on the same engine — better than a dead end.
      return !!g.model;
    }
    /** «Повторить» — reopen the flow that made this row, prefilled with the
     *  stored user prompt + opts. Reference photos are never stored (they are
     *  counts in opts.refs), so those are asked for again, and we say so. */
    function recreateFrom(g) {
      const k = g.source_kind;
      if (k === "preset") {
        const p = (ME.catalog.presets || []).find((x) => x.id === g.source_id);
        if (p) {
          const lock = presetLock(p);
          if (lock) { haptic("error"); toast(lockText(lock), { wide: true, ms: 5000 }); return; }
          openStudio({ preset: p, origin: "preset", modelKey: p.model });
          return;
        }
      }
      if (k === "campaign" || k === "campaign_video") {
        const campId = String(g.source_id || "").split(":")[0];
        if ((ME.catalog.campaigns || []).some((c) => c.id === campId)) {
          st.tab = "scenes"; openSheet(); viewCampaign(campId);
          return;
        }
      }
      const o = g.opts || {};
      const seed = /^seedance/.test(g.model || "");
      openStudio({ mode: isVideoModelKey(g.model) ? "video" : "image", modelKey: seed ? "seedance" : g.model });
      stu.prompt = g.user_prompt || stu.prompt || "";
      if (seed) stu.seedanceTier = o.tier || (g.model === "seedance_mini" ? "cheap" : g.model === "seedance" ? "quality" : "fast");
      if (o.aspect) stu.aspect = o.aspect;
      if (o.resolution) stu.resolution = o.resolution;
      if (o.duration) stu.duration = o.duration;
      if (o.count) stu.numImages = o.count;
      if (o.subject) stu.subject = o.subject;
      clampStudioOpts(); viewStudio();
      if (o.refs && o.refs.photos) toast("Фото-референсы не сохраняются — добавьте фото заново", { wide: true, ms: 4500 });
    }
    // Failed renders surfaced in «Мои работы» — sourced from /api/me's last-30
    // rows (failed rows never enter the paginated gallery query, so page math
    // is untouched). Dismissals live client-side, capped like the window.
    const FAIL_DISMISS_KEY = "neuroshot_failed_dismissed";
    function dismissedFails() {
      try { return JSON.parse(localStorage.getItem(FAIL_DISMISS_KEY) || "[]"); } catch (e) { return []; }
    }
    function dismissFail(id) {
      const d = dismissedFails();
      if (!d.includes(id)) d.push(id);
      try { localStorage.setItem(FAIL_DISMISS_KEY, JSON.stringify(d.slice(-60))); } catch (e) { /* private mode */ }
    }
    // A Director Mode session can fire up to 6 characters + 4 locations in one
    // batch (ENHANCE_CONTEXT_LIMITS, src/enhance.ts) — 3 was sized before that
    // existed and would silently hide the 4th failure of a bad batch.
    function failedRows() {
      const dis = dismissedFails();
      return ((ME && ME.generations) || [])
        .filter((g) => g.status === "error" && !dis.includes(g.id) && !jobs.has(g.id))
        .slice(0, 10);
    }

    // ——————————————————————————————————————————————————————————————————
    // Director Mode (Seedance) — character/location sheets + storyboard
    // ——————————————————————————————————————————————————————————————————
    /**
     * How many source photos one sheet may carry. This is NOT a taste call —
     * the sheet model declares a hard `maxInputs` and the server rejects the
     * whole render with `too_many_inputs` above it, so offering more slots than
     * the server accepts would build an entry that can never succeed, retry
     * included. Read the server's own number; 4 only as a floor if an older
     * cached shell is talking to a newer server.
     */
    function dmPhotoMax() { return ((ME.catalog || {}).sheet || {}).maxInputs || 4; }

    /** The cast list for a kind — the single place that maps kind → state. */
    function dmList(kind) { return kind === "character" ? stu.dmChars : stu.dmLocs; }
    /** Entries that are BOTH ticked and actually have a finished sheet — the
     *  only ones the storyboard and the assembled prompt may speak about. */
    function dmCast(kind) { return dmList(kind).filter((x) => x.use && x.sheetUrl); }
    /** The pending "add" form for a kind; create=true materialises it. */
    function dmDraft(kind, create) {
      const key = kind === "character" ? "dmDraftChar" : "dmDraftLoc";
      if (!stu[key] && create) stu[key] = { photos: [], busy: false };
      return stu[key];
    }
    /** A sheet costs a real render — quote the server's own number. 0 means an
     *  older cached shell is talking to a newer server: quote nothing rather
     *  than a made-up price, and let the server's 402 be the authority. */
    function dmSheetPrice() { return ((ME.catalog || {}).sheet || {}).credits || 0; }
    /** True only while the studio composer itself is the open sheet — a sheet
     *  render finishing must not yank the user out of a paywall or a viewer. */
    function dmComposerVisible() {
      return !!(stu && sheet.classList.contains("on") && sheetBody.querySelector("#stuGo"));
    }
    /** RU label for a shot-type id (catalog vocabulary, ids never shown raw). */
    function dmShotLabel(id) {
      const hit = ((ME.catalog || {}).shotTypes || []).find((s) => s.id === id);
      return hit ? hit.label : "кадр";
    }
    /** Names of the cast a candidate puts on screen, for the card's refs line. */
    function dmCandRefs(c) {
      const names = []
        .concat((c.characterIds || []).map((id) => (stu.dmChars.find((x) => x.id === id) || {}).label))
        .concat((c.locationIds || []).map((id) => (stu.dmLocs.find((x) => x.id === id) || {}).label))
        .filter(Boolean);
      return names.join(" · ");
    }
    /** A removed cast member makes any storyboard built around them stale. */
    function dmInvalidateShots(removedId) {
      if (!stu.dmCands) return;
      const stale = stu.dmCands.some((c) =>
        (c.characterIds || []).includes(removedId) || (c.locationIds || []).includes(removedId));
      if (!stale) return;
      stu.dmCands = null; stu.dmCandIdx = null;
      toast("Раскадровка сброшена — в ней был удалённый участник", { wide: true, ms: 4000 });
    }

    /**
     * Start a sheet render WITHOUT leaving the composer. startJob() takes over
     * the sheet body with a progress screen, which is right for the main render
     * and wrong here: a sheet is a side-errand, and the user should keep
     * filling in the rest of the cast while it cooks. The job still enters the
     * same `jobs` map, so the pill, the gallery ripple and reload-resume all
     * behave exactly as they do for any other render.
     */
    function startSheetJob(id, kind, entryId) {
      const job = { id, isVideo: false, campaignId: null, started: Date.now(),
        etaSec: etaFor(((ME.catalog || {}).sheet || {}).model), dmSheet: { type: kind, entryId } };
      jobs.set(id, job); updateJobsPill();
      pollJob(job);
      renderGallery(1);
    }
    function dmSheetEntry(job) {
      return dmList(job.dmSheet.type).find((x) => x.id === job.dmSheet.entryId);
    }
    function dmSheetDone(job, data) {
      const entry = dmSheetEntry(job);
      // The composer may have been closed and reopened without `keep` since the
      // render started, in which case the entry is gone — the sheet is still in
      // «Мои работы», so say that rather than nothing.
      if (!entry) { toast("✨ Карта готова — она в «Мои работы»"); return; }
      entry.sheetUrl = data.output_url;
      entry.pending = false; entry.error = null;
      entry.genId = job.id;
      toast(`✓ Карта «${entry.label}» готова`);
      // The screenwriter's plot only overwrites an EMPTY scenario box — a
      // user who already started typing their own scene keeps it untouched.
      if (stu.swPlot && !(stu.dmScenario || "").trim() && swAllLinked()) {
        stu.dmScenario = stu.swPlot;
        stu.dmSec.shot = true;
        toast("🎬 Сюжет — в «Кадр»: весь актёрский состав готов", { wide: true, ms: 4000 });
      }
      if (dmComposerVisible()) viewStudio();
    }
    function dmSheetFail(job, data) {
      const entry = dmSheetEntry(job);
      const why = genErrShort(data.error_reason);
      if (!entry) { toast(`Карта не получилась — ${why}. ${PATRON} патроны возвращены.`, { wide: true, ms: 5000 }); return; }
      entry.pending = false;
      entry.error = why;
      toast(`Карта «${entry.label}» не получилась — ${why}. ${PATRON} патроны возвращены.`, { wide: true, ms: 5500 });
      if (dmComposerVisible()) viewStudio();
    }

    /** Upload the draft's photos and fire the sheet render. */
    async function dmGenerateSheet(kind) {
      const draft = dmDraft(kind, false);
      if (!draft || !draft.photos.length) { toast("Сначала добавьте хотя бы одно фото 🙂"); return; }
      if (draft.busy) return; // double-tap guard: this spends patrons
      const price = dmSheetPrice();
      if (price > 0 && price > ME.dashboard.credits) {
        viewPaywall({ need: price, balance: ME.dashboard.credits, packs: ME.packs });
        return;
      }
      draft.busy = true; viewStudio();
      const label = (draft.label || "").trim().slice(0, 60)
        || (kind === "character" ? `Персонаж ${stu.dmChars.length + 1}` : `Локация ${stu.dmLocs.length + 1}`);
      const urls = [];
      let lost = 0;
      for (const p of draft.photos) {
        if (!p.url || !/^https?:/.test(p.url)) p.url = await uploadData(p.data);
        if (p.url) urls.push(p.url); else lost++;
      }
      if (!urls.length) {
        draft.busy = false;
        toast("Не удалось загрузить фото — патроны не списаны. Попробуйте ещё раз.", { wide: true, ms: 5000 });
        viewStudio(); return;
      }
      if (lost) toast(`Не удалось загрузить ${lost} фото — собираем по остальным`);
      stu.dmSeq++;
      // The free-text description (spec: "character prompt") is carried onto
      // the entry now, but never sent to the SHEET render below — a sheet is a
      // reference photo, built from photos alone. It reaches the model only
      // later, woven into the assembled Seedance prompt (entityLine, enhance.ts).
      const text = (draft.text || "").trim().slice(0, 300);
      const entry = { id: `${kind === "character" ? "char" : "loc"}_${stu.dmSeq}`, label, text,
        // Only the photos that actually reached storage — the card's "N фото"
        // must not count ones the sheet was never built from.
        photos: draft.photos.filter((p) => p.url), urls, sheetUrl: null, genId: null,
        pending: true, error: null, use: true,
        // Set only when this draft was opened FROM a screenwriter entity
        // (swOpenAddFor/swGenerateBg) — swEntryFor uses it to report that
        // entity's card as done, without duplicating any state here.
        swEntityId: draft.swEntityId || null };
      dmList(kind).push(entry);
      const r = await dmFireSheet(kind, entry);
      // Only clear the form once the render is actually queued — a failed
      // request must not eat the photos the user just picked.
      if (r === "ok") stu[kind === "character" ? "dmDraftChar" : "dmDraftLoc"] = null;
      else draft.busy = false;
      // "paywall" means dmFireSheet already painted the paywall over the sheet
      // body; re-rendering the composer here would erase it in the same tick.
      if (r !== "paywall") viewStudio();
    }
    /** Re-run a failed sheet from the photos already uploaded for that entry. */
    async function dmRetrySheet(kind, entry) {
      if (entry.pending) return;
      const price = dmSheetPrice();
      if (price > 0 && price > ME.dashboard.credits) {
        viewPaywall({ need: price, balance: ME.dashboard.credits, packs: ME.packs });
        return;
      }
      entry.pending = true; entry.error = null; viewStudio();
      const r = await dmFireSheet(kind, entry);
      if (r !== "ok") entry.pending = false;
      if (r !== "paywall") viewStudio();
    }
    /**
     * The one place that POSTs a sheet. The composition prompt and the model
     * are NOT sent — they are server-side constants (SHEET_PROMPTS/SHEET_MODEL,
     * src/models.ts), exactly like preset prompts. The client says only what
     * kind of sheet it wants, whose photos to use, and what to call it.
     *
     * Returns "ok" | "paywall" | "fail". Every non-ok path leaves `entry.error`
     * set, which is what makes the ↻ retry button appear — an entry that is
     * neither pending, nor finished, nor failed renders no controls at all and
     * strands the photos behind it.
     */
    async function dmFireSheet(kind, entry) {
      let status, data;
      try {
        ({ status, data } = await api("/api/generate", {
          method: "POST",
          body: JSON.stringify({
            source: "sheet",
            sheetType: kind,
            label: entry.label,
            image_url: entry.urls[0],
            image_urls: entry.urls.length > 1 ? entry.urls.slice(1) : undefined,
          }),
        }));
      } catch (e) {
        // A dropped connection is routine inside a Telegram WebView. Without
        // clearing `pending` here the entry spins forever AND its retry
        // button stays dead behind `if (entry.pending) return` — the two
        // together are a permanent, unrecoverable card. We genuinely don't
        // know whether the POST landed (charged + queued) or never left the
        // device, so the copy says that rather than asserting a refund that
        // may not have happened.
        entry.pending = false;
        entry.error = "нет связи — попробуйте ещё раз";
        toast("Нет связи с сервером — не знаем, дошёл ли запрос. Если карта спишется, она появится в «Мои работы».", { wide: true, ms: 5500 });
        return "fail";
      }
      if (status === 402) {
        entry.pending = false;
        entry.error = "не хватило патронов";
        viewPaywall(data);
        return "paywall";
      }
      if (status === 400 && data && data.error === "too_many_inputs") {
        entry.pending = false;
        entry.error = `нужно не больше ${data.maxInputs} фото`;
        toast(`Для карты можно взять не больше ${data.maxInputs} фото — уберите лишние`, { wide: true, ms: 5000 });
        return "fail";
      }
      if (status === 503 && data && data.error === "provider_down") {
        entry.pending = false;
        entry.error = "сервис был недоступен";
        toast("Сервис генерации временно недоступен — патроны не списаны.", { wide: true, ms: 5000 });
        return "fail";
      }
      if (status !== 200) {
        entry.pending = false;
        entry.error = "не удалось запустить";
        toast("Не получилось запустить карту — патроны не списаны.", { wide: true, ms: 4500 });
        return "fail";
      }
      ME.dashboard.credits = data.balance; setBalance(data.balance);
      startSheetJob(data.id, kind, entry.id);
      return "ok";
    }

    /** Expand a screenwriter vision into a plot + cast (POST /api/screenwriter/expand). */
    async function swExpand() {
      const vision = (stu.swVision || "").trim();
      if (!vision) { toast("Сначала опишите идею 🙂"); return; }
      stu.swExpanding = true; viewStudio();
      let status, data;
      try {
        ({ status, data } = await api("/api/screenwriter/expand", {
          method: "POST",
          body: JSON.stringify({ vision, vfxNotes: (stu.swVfxNotes || "").trim() || undefined }),
        }));
      } catch (e) {
        stu.swExpanding = false;
        toast("Нет связи с сервером — патроны не списаны.", { wide: true, ms: 4500 });
        viewStudio(); return;
      }
      stu.swExpanding = false;
      if (status === 402) { viewPaywall(data); return; }
      if (status !== 200 || !data.plot || !(data.entities || []).length) {
        haptic("error");
        toast("Не получилось построить сценарий — патроны не списаны. Опишите идею подробнее.", { wide: true, ms: 5000 });
        viewStudio(); return;
      }
      stu.swPlot = data.plot;
      stu.swEntities = data.entities.map((e) => ({ ...e, bgBusy: false }));
      ME.dashboard.credits = data.balance; setBalance(data.balance);
      if (ME.enhance) ME.enhance.left = data.left;
      haptic("success");
      toast(data.free ? `✎ Готово · осталось ${data.left}` : `✎ Готово · −${data.charged} ${PATRON}`);
      viewStudio();
    }
    /**
     * "+ добавить фото" on a screenwriter entity: opens the EXISTING
     * character/location add-form (dmAddCardHtml), prefilled with the
     * entity's name and tagged so the finished sheet reports back as this
     * entity's card (swEntryFor) — no new sheet-generation path.
     */
    function swOpenAddFor(e) {
      const draft = dmDraft(e.kind, true);
      if (!draft.label) draft.label = e.label;
      draft.swEntityId = e.id;
      stu.dmSec.chars = e.kind === "character";
      stu.dmSec.locs = e.kind === "location";
      viewStudio();
      const target = sheetBody.querySelector(e.kind === "character" ? "#dmCharLabel" : "#dmLocLabel");
      if (target) { target.scrollIntoView({ block: "center" }); target.focus(); }
    }
    /** The no-photo location path, once its render lands: chain the frame
     *  into the SAME sheet draft an upload would use, then fire the sheet
     *  exactly like dmGenerateSheet always has. */
    function swBgDone(job, data) {
      const e = (stu.swEntities || []).find((x) => x.id === job.swBg.entityId);
      if (!e) { toast("✨ Фон готов — он в «Мои работы»"); return; }
      e.bgBusy = false;
      const draft = dmDraft("location", true);
      if (!draft.label) draft.label = e.label;
      draft.swEntityId = e.id;
      draft.photos.push({ data: data.output_url, url: data.output_url });
      dmGenerateSheet("location");
    }
    function swBgFail(job, data) {
      const e = (stu.swEntities || []).find((x) => x.id === job.swBg.entityId);
      const why = genErrShort(data.error_reason);
      if (e) e.bgBusy = false;
      toast(`Не получилось создать фон для «${(e && e.label) || "локации"}» — ${why}. ${PATRON} патроны возвращены.`, { wide: true, ms: 5500 });
      if (dmComposerVisible()) viewStudio();
    }
    function startSwBgJob(id, entityId) {
      const job = { id, isVideo: false, campaignId: null, started: Date.now(),
        etaSec: etaFor("text_to_image"), swBg: { entityId } };
      jobs.set(id, job); updateJobsPill();
      pollJob(job);
      renderGallery(1);
    }
    /**
     * Generate a representative frame for a photo-less location from its
     * `hint` (fal text_to_image), then chain it into the existing sheet flow
     * via swBgDone. The button already quoted BOTH charges together
     * (swBgPrice + dmSheetPrice) — this is the only place either fires.
     */
    async function swGenerateBg(e) {
      if (e.bgBusy) return;
      const total = swBgPrice() + dmSheetPrice();
      if (total > 0 && total > ME.dashboard.credits) {
        viewPaywall({ need: total, balance: ME.dashboard.credits, packs: ME.packs });
        return;
      }
      e.bgBusy = true; viewStudio();
      let status, data;
      try {
        ({ status, data } = await api("/api/generate", {
          method: "POST",
          body: JSON.stringify({ source: "model", model: "text_to_image", prompt: e.hint }),
        }));
      } catch (err) {
        e.bgBusy = false;
        toast("Нет связи с сервером — попробуйте ещё раз.", { wide: true, ms: 4500 });
        viewStudio(); return;
      }
      if (status === 402) { e.bgBusy = false; viewPaywall(data); return; }
      if (status !== 200) {
        e.bgBusy = false;
        toast("Не удалось создать фон — патроны не списаны.", { wide: true, ms: 4500 });
        viewStudio(); return;
      }
      ME.dashboard.credits = data.balance; setBalance(data.balance);
      startSwBgJob(data.id, e.id);
    }

    /** The toggle plus, when it's on, the three optional sections. */
    function directorModeHtml() {
      const m = studioModel();
      if (stu.mode !== "video" || !m || m.key !== "seedance") return "";
      // Персонажи/Локации used to be their own accordions here — they now
      // render as cells of the unified reference grid (extrasBlock, below the
      // photo zone), alongside plain source photos and the final frame. Only
      // the scene-planning half of Director Mode (scenario → shot split →
      // assemble) is a photo INPUT's opposite — text and AI-picked framing,
      // not a reference photo — so it's the only thing still gated here.
      return `
        <div class="toggle-row">
          <div class="lbl">Режиссёрский режим<small>персонажи, локации, раскадровка</small></div>
          <label class="ios-toggle">
            <input type="checkbox" id="dmToggle" ${stu.director ? "checked" : ""} aria-label="Режиссёрский режим" />
            <span class="track"></span><span class="knob"></span>
          </label>
        </div>
        ${stu.director ? `
          ${dmScreenwriterHtml()}
          ${dmShotAccordion()}
          ${dmAssembleHtml()}` : ""}`;
    }

    // ——— Screenwriter pipeline (docs/seedance-screenwriter-spec.md) ———
    // A vision → plot + cast, feeding the cast/scenario fields above
    // unchanged: this section only ever produces a plot string and entity
    // list, never a sheet or a render itself.

    /** The sheet (dmChars/dmLocs) entry a screenwriter entity has produced,
     *  once one exists — the link is the entry's own swEntityId, set when
     *  its add-form draft was opened FROM this entity (swOpenAddFor). */
    function swEntryFor(e) { return dmList(e.kind).find((x) => x.swEntityId === e.id); }
    /** True once every extracted entity has an actual finished sheet. */
    function swAllLinked() {
      const es = stu.swEntities || [];
      if (!es.length) return false;
      return es.every((e) => { const x = swEntryFor(e); return x && x.sheetUrl; });
    }
    /** A no-photo location's background frame is a real render — quote the
     *  server's own text-to-image price, same discipline as dmSheetPrice. */
    function swBgPrice() {
      const list = (ME.catalog.studio && ME.catalog.studio.image) || [];
      const t2i = list.find((x) => x.key === "text_to_image");
      return (t2i && t2i.credits) || 0;
    }

    function dmSwEntityRow(e) {
      const entry = swEntryFor(e);
      const em = e.kind === "character" ? "👤" : "📍";
      if (entry && entry.sheetUrl) {
        return `<div class="sw-cast-row done"><span class="em">${em}</span><b>${esc(e.label)}</b><span class="sw-status">✓ фото готово</span></div>`;
      }
      if (entry && entry.pending) {
        return `<div class="sw-cast-row"><span class="em">${em}</span><b>${esc(e.label)}</b><span class="sw-status">⏳ карта в работе</span></div>`;
      }
      // The no-photo path only makes sense for locations — a character
      // without a real photo is exactly the likeness this product refuses to
      // fabricate; only a place can legitimately start from a text hint.
      const bgPrice = swBgPrice() + dmSheetPrice();
      return `<div class="sw-cast-row">
        <span class="em">${em}</span><b>${esc(e.label)}</b>
        <div class="sw-actions">
          <button type="button" class="sw-chip" data-sw-add="${esc(e.id)}">+ добавить фото</button>
          ${e.kind === "location" ? `<button type="button" class="sw-chip" data-sw-bg="${esc(e.id)}" ${e.bgBusy ? "disabled" : ""}>${e.bgBusy ? "⏳ …" : `🖼 сгенерировать · ${bgPrice} ${PATRON}`}</button>` : ""}
        </div>
      </div>`;
    }

    function dmScreenwriterHtml() {
      if (!(ME.uiFeatures || {}).screenwriterPipeline) return "";
      const open = !!stu.dmSec.sw;
      const busy = !!stu.swExpanding;
      const cost = ME.enhance && ME.enhance.left > 0 ? "бесплатно" : `${(ME.enhance && ME.enhance.cost) || 1} ${PATRON}`;
      const entities = stu.swEntities || [];
      const linked = entities.filter((e) => { const x = swEntryFor(e); return x && x.sheetUrl; }).length;
      const state = entities.length ? `${linked} из ${entities.length} готовы` : stu.swPlot ? "готово" : "нет";
      return `
        <div class="acc ${open ? "open" : ""}">
          <button class="acc-head" type="button" data-dm-sec="sw" aria-expanded="${open}">
            <span class="t"><span class="n">✎</span><b>Сценарист</b></span>
            <span class="state">${esc(state)}</span><span class="chev">▼</span>
          </button>
          ${open ? `<div class="acc-body">
            <p class="acc-hint">Опишите идею в двух словах — распишем сцену и подберём, кого и где снять. Дальше как обычно: фото на каждого, кадр, промпт.</p>
            <div class="scenario-box">
              <textarea id="swVision" maxlength="1000" placeholder="Девушка находит старую гитару на чердаке и начинает играть…">${esc(stu.swVision || "")}</textarea>
            </div>
            <div class="scenario-box" style="margin-top:6px">
              <textarea id="swVfxNotes" maxlength="500" placeholder="необязательно: свет, погода, эффекты…">${esc(stu.swVfxNotes || "")}</textarea>
            </div>
            <button class="split-btn" type="button" id="swExpandBtn" ${busy || !(stu.swVision || "").trim() ? "disabled" : ""}>
              ${busy ? "⏳ Пишу сценарий…" : `✎ Построить сценарий · ${cost}`}
            </button>
            ${stu.swPlot ? `
              <p class="acc-hint"><b>Сюжет:</b> ${esc(stu.swPlot)}</p>
              ${entities.length ? `<div class="sw-cast">${entities.map((e) => dmSwEntityRow(e)).join("")}</div>` : ""}
            ` : ""}
          </div>` : ""}
        </div>`;
    }

    const DM_COPY = {
      character: { n: "①", title: "Персонажи", empty: "нет",
        hint: "Одно фото и больше — на выходе карта: ракурсы, мимика, детали. Её увидит модель, когда будет снимать вашу сцену.",
        add: "Добавить персонажа", ph: "Аня, рыжий кот, робот…", em: "👤", none: "Персонаж",
        textPh: "необязательно: характер, поза, стиль одежды — то, что фото не передаёт" },

    /**

    function dmAssembleHtml() {
      const ready = stu.dmCandIdx != null;
      const cost = ME.enhance && ME.enhance.left > 0 ? "бесплатно" : `${(ME.enhance && ME.enhance.cost) || 1} ${PATRON}`;
      return `
        <button class="assemble-btn ${ready && !stu.dmAssembling ? "pulse" : ""}" type="button" id="dmAssembleBtn" ${!ready || stu.dmAssembling ? "disabled" : ""}>

    const RATIO_LABEL = { auto: "Как фото", "9:16": "9:16 ↕", "16:9": "16:9 ↔", "1:1": "1:1 ◻", "4:3": "4:3 ▭", "3:4": "3:4 ▯" };

    // ————————————————————————————————————————————————————————————————————
    // Cinema Studio — the ONE generation page (docs/cinema-studio-spec.md §4).
    // Every entry lands here PREFILLED: ① prompt block (preset chip w/
    // personalization, or free text) → ③ inputs (device / my works) → ④ mode
    // chip 🖼/🎬 → ⑤ the FULL model registry with patron prices → ⑥ params only

    // ————————————————————————————————————————————————————————————————————
    let stu = null;

        prompt: prev ? prev.prompt : "",
        options: {}, // video story picks: stepId -> optionId

        storyDir: null, // "fwd" | "back" — which way the carousel last moved, for the slide-in animation
        paramPopup: null, // which param popup (aspect/resolution/count/duration) is open, if any
        // Popup gallery browser (full paginated "мои работы", not just the last
        // few) — see galleryPopupHtml(). galleryMode is "single" (picking the
        // primary source photo, replaces stu.photo/generationId) or "multi"
        // (attaching extra reference photos, appends to stu.extras).
        galleryOpen: false,
        galleryMode: null,
        galleryPage: 1,
        galleryFavOnly: false,
        galleryData: null, // last-fetched {items,total,page,pages} or null while loading
        gallerySelected: [], // multi mode only: [{id, url}]
        mode: ctx.mode || (prev ? prev.mode : "image"),
        modelKey: ctx.modelKey || null,
        photo: prev ? prev.photo : null,
        photoUrl: prev ? prev.photoUrl : null,

        // for the same reason the primary photo does — retaking them is the most
        // annoying thing we could ask for.
        extras: prev ? prev.extras || [] : [],
        generationId: ctx.generationId || (prev ? prev.generationId : null),
        srcPreview: ctx.srcPreview || (prev ? prev.srcPreview : null),
        endPhoto: null, endGenerationId: null,
        duration: undefined, aspect: undefined, resolution: undefined, numImages: undefined,
        showAll: false, mopen: false, swap: false,
        prevPrompt: null, // pre-enhance prompt, powers the ↩ Вернуть undo
        // Seedance's Дёшево/Быстро/Качество toggle (routeSeedance, src/seedance.ts)
        // — "fast" matches the server's own SEEDANCE_TIER_DEFAULT.
        seedanceTier: prev ? prev.seedanceTier || "fast" : "fast",
        // Prompt textarea height (drag-resize handle) — survives a re-open the
        // same way custom/prompt do, so returning to the composer doesn't
        // silently shrink a box the user deliberately made taller.
        promptH: prev ? prev.promptH || 104 : 104,
        mq: "", // model-list search filter, reset on every open — not worth persisting
        // The unified reference grid's role-choice row (extrasBlock) — resets
