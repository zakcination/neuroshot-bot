<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NeuroShot</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#08070c" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NeuroShot" />
  <!-- Self-hosted (no third-party request, no CSP/latency risk for users on
       slower KZ mobile connections) — see the cyrillic files, since Russian
       copy is nearly all visible text. Both are variable fonts (one file
       covers the whole weight range), so this is 2 requests, not 10. -->
  <link rel="preload" href="/fonts/golos-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
  <!-- ₸ (tenge) — its own tiny file (~700 B), see the @font-face comment below;
       every price in the app uses it, so it's worth its own preload. -->
  <link rel="preload" href="/fonts/golos-tenge.woff2" as="font" type="font/woff2" crossorigin />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ————— NeuroShot design system: dark luxe, aurora accent (violet→magenta) ————— */
    /* Type: Unbounded (display, headings/big numbers only — geometric and
       distinctive rather than another Inter/Roboto-alike) paired with Golos
       Text (body — a humanist sans designed for Cyrillic, reads well small on
       phones). Both self-hosted as variable woff2 (public/fonts/), Cyrillic +
       Latin subsets only. font-display: swap so first paint never blocks on
       the font request — the system-font fallback chain renders immediately
       and swaps in once the file lands. */
    @font-face {
      font-family: "Unbounded";
      font-style: normal;
      font-weight: 200 900;
      font-display: swap;
      src: url("/fonts/unbounded-cyrillic.woff2") format("woff2");
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: "Unbounded";
      font-style: normal;
      font-weight: 200 900;
      font-display: swap;
      src: url("/fonts/unbounded-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122;
    }
    @font-face {
      font-family: "Golos Text";
      font-style: normal;
      font-weight: 400 900;
      font-display: swap;
      src: url("/fonts/golos-cyrillic.woff2") format("woff2");
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: "Golos Text";
      font-style: normal;
      font-weight: 400 900;
      font-display: swap;
      src: url("/fonts/golos-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122;
    }
    /* The tenge sign (₸, U+20B8) falls outside every predefined Cyrillic/Latin
       subset Google ships for these families — it's a single-glyph file
       fetched separately (google's own on-demand subsetting API), not part of
       either block above. Without this, every price in a KZT-priced app falls
       back to tofu. */
    @font-face {
      font-family: "Golos Text";
      font-style: normal;
      font-weight: 400 900;
      font-display: swap;
      src: url("/fonts/golos-tenge.woff2") format("woff2");
      unicode-range: U+20B8;
    }
    @font-face {
      font-family: "Unbounded";
      font-style: normal;
      font-weight: 200 900;
      font-display: swap;
      src: url("/fonts/unbounded-tenge.woff2") format("woff2");
      unicode-range: U+20B8;
    }
    :root {
      --bg: #08070c;
      --bg-2: #0d0b13;
      --surface: #14111c;
      --surface-2: #1b1726;
      --line: rgba(255, 255, 255, 0.07);
      --ink: #f4f2fa;
      --muted: #8f8aa3;
      --faint: #5e5975;
      --violet: #7c5cff;
      --magenta: #ff4d8d;
      --amber: #f5b64a;
      --aurora: linear-gradient(120deg, #7c5cff, #b44dff 45%, #ff4d8d);
      --radius: 20px;
      --radius-s: 14px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { color-scheme: dark; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.5 "Golos Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100dvh; overflow-x: hidden;
    }
    ::selection { background: rgba(124, 92, 255, .4); }
    /* Display face: real headline moments only (headings + the onboarding
       gift number) — never body copy, buttons, or dense list text, where
       Unbounded's wide geometric letterforms would hurt legibility at small
       mobile sizes. Falls back to the body stack, never to Unbounded-less
       system-ui, so a slow font load never leaves a heading looking bare. */
    h1, h2, h3, .wgiftbox .gn {
      font-family: "Unbounded", "Golos Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    .sky { position: fixed; inset: -20% -30%; z-index: 0; pointer-events: none; filter: blur(90px); opacity: .5; }
    .sky i { position: absolute; border-radius: 50%; }
    .sky i:nth-child(1) { width: 55vmax; height: 55vmax; left: -12vmax; top: -18vmax; background: radial-gradient(circle, rgba(124,92,255,.5), transparent 65%); animation: drift1 26s ease-in-out infinite alternate; }
    .sky i:nth-child(2) { width: 45vmax; height: 45vmax; right: -15vmax; top: 10vmax; background: radial-gradient(circle, rgba(255,77,141,.35), transparent 65%); animation: drift2 32s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(9vmax, 7vmax) scale(1.12); } }
    @keyframes drift2 { to { transform: translate(-8vmax, -6vmax) scale(.94); } }

    .wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 14px 16px calc(44px + env(safe-area-inset-bottom)); }

    .pill {
      display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px;
      font-variant-numeric: tabular-nums;
    }
    /* Header — profile + balance + in-progress count, nothing else. Telegram's
       own webview title bar already shows "NeuroShot" above this, so an in-app
       logo was a second, redundant brand mark eating space for no new info. */
    .top2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 2px 16px; }
    .idbox { display: flex; align-items: center; gap: 9px; flex: none; min-width: 0; }
    .idbox .nm { font-size: 13.5px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; object-fit: cover; border: 1.5px solid var(--line); }
    .avatar.ph { display: flex; align-items: center; justify-content: center; background: var(--aurora); font-size: 12px; font-weight: 800; color: #fff; }
    /* Decorative level ring around the avatar — a glance-level echo of the
       detailed #lvlHost pill next to it, not a replacement for it. */
    .avatarring {
      position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%; padding: 2px;
      background: conic-gradient(var(--violet) 0% var(--pct), rgba(255,255,255,.14) var(--pct) 100%);
    }
    .avatarring .avatar, .avatarring .avatar.ph { width: 100%; height: 100%; border: 1.5px solid var(--bg); }
    .lvlbadge {
      position: absolute; right: -3px; bottom: -3px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: #fff;
      background: linear-gradient(135deg, var(--violet), var(--magenta)); border: 1.5px solid var(--bg);
    }
    .pillrow { display: flex; gap: 6px; flex: none; }
    .pill.jobs { color: var(--amber); border-color: rgba(245,182,74,.35); }
    /* Balance pill IS the top-up entry point (tap → Патроны) — replaces the old
       wallet card's "Пополнить" button so it's reachable without a permanent
       block duplicating the balance already shown right here. */
    .pill.topup { border: 0; cursor: pointer; padding-right: 6px; font: inherit; color: var(--ink); }
    .pill.topup .plus {
      width: 15px; height: 15px; border-radius: 50%; background: var(--aurora); color: #fff;
      display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; line-height: 1; margin-right: 1px;
    }
    .pill.topup:active { transform: scale(.95); }

    /* "Ваш путь в NeuroShot" — replaces the old wallet card (balance now lives
       in the header pill). Every step is a real clickable link into the studio
       sheet (or the Друзья page); "done" reflects genuine backend signals
       (roadmapProgress in db.ts), not a fabricated progress bar. */
    .roadmap { background: var(--surface); border: 1px solid rgba(124,92,255,.28); border-radius: var(--radius); padding: 15px 15px 16px; }
    /* H10 redesign (docs/wireframes — home-studio wireframe, version 2): a
       progress bar + step-pill track replaces the old 5-icon-tile grid — same
       data (roadmapStepsFor's real steps/done state), just read at a glance
       instead of needing every label read individually. Pills stay clickable
       (data-go, same as before) with the label as a11y/hover text via
       aria-label — the wireframe's plain pill has no room for inline text,
       but losing the "tap a step to jump straight to it" behavior would be a
       real regression, not a redesign. "Done" stays the app's established
       success green (.wgiftbox.received, elsewhere) rather than the
       wireframe's generic violet demo color — that's a real semantic color
       (completed/received) used consistently across the app; the wireframe
       mockup wasn't asserting a new one. */
    .roadmap .rm-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    .roadmap .rm-head b { font-size: 13.5px; font-weight: 800; }
    .roadmap .rm-ct { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .rm-track { height: 5px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
    .rm-fill { display: block; height: 100%; background: var(--aurora); border-radius: 999px; transition: width .3s ease; }
    .rm-pills { display: flex; gap: 6px; margin-top: 9px; }
    .rm-pill {
      flex: 1; height: 26px; border-radius: 8px; padding: 0; appearance: none; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--line); transition: border-color .15s ease, transform .12s ease;
    }
    .rm-pill:active { transform: scale(.94); }
    .rm-pill.on { background: rgba(55,201,154,.16); border-color: rgba(55,201,154,.4); }
    /* Reward note (before completion) / claim button (after) — makes the
       "finish all N steps" incentive visible, not a silent progress bar. */
    .rmnote { margin: 11px 0 0; font-size: 12px; line-height: 1.4; color: var(--muted); }
    .rmnote b { color: var(--ink); }
    .rmclaim {
      margin-top: 11px; width: 100%; appearance: none; border: 0; cursor: pointer;
      border-radius: var(--radius-s); background: var(--aurora); color: #fff; font: inherit;
      font-weight: 800; font-size: 13.5px; padding: 11px; box-shadow: 0 8px 24px rgba(180,77,255,.3);
      transition: transform .12s ease;
    }
    .rmclaim:active { transform: scale(.97); }
    .rmclaim[disabled] { opacity: .55; pointer-events: none; }
    /* Graduation state — once all 5 steps are done AND the bonus is settled, the
       full checklist has done its job. Collapse the card to a single slim row so
       a power user's studio isn't permanently topped by a dead 5-checkmark grid;
       tapping it just drops into the shoot sheet to make something new. */
    /* A completed onboarding path is removed from the studio entirely (it just
       wasted prime space); the accomplishment becomes a profile achievement
       badge (.ach) instead of a permanent row. */
    .roadmap.graduated { display: none; }
    .ach { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid rgba(55,201,154,.38); border-radius: var(--radius); padding: 13px 15px; }
    .ach .achic { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: rgba(55,201,154,.14); border: 1px solid rgba(55,201,154,.4); }
    .ach .achtx { display: flex; flex-direction: column; gap: 2px; font-weight: 800; }
    .ach .achtx small { color: var(--muted); font-size: 12px; font-weight: 600; }
    .rmgrad {
      width: 100%; display: flex; align-items: center; gap: 11px; text-align: left;
      background: transparent; border: 0; padding: 0; font: inherit; color: var(--ink); cursor: pointer;
    }
    .rmgrad .rico {
      flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 15px; background: rgba(55,201,154,.16); border: 1px solid rgba(55,201,154,.4);
    }
    .rmgrad .rgtx { display: flex; flex-direction: column; gap: 1px; font-size: 13px; font-weight: 800; }
    .rmgrad .rgtx small { font-size: 11px; font-weight: 600; color: var(--muted); }

    .btn {
      appearance: none; border: 0; cursor: pointer; border-radius: var(--radius-s);
      font: inherit; font-weight: 700; font-size: 14.5px; padding: 13px 18px; color: #fff;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: 1;
      transition: transform .12s ease, filter .2s ease; text-decoration: none;
    }
    .btn:active { transform: scale(.97); }
    .btn.primary { background: var(--aurora); box-shadow: 0 8px 28px rgba(180, 77, 255, .35); }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.ghost { background: rgba(255,255,255,.06); border: 1px solid var(--line); }
    .btn.ghost:hover { background: rgba(255,255,255,.1); }
    .btn:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
    .btn[disabled] { opacity: .55; pointer-events: none; }

    section { margin-top: 30px; }
    .sec-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 13px; }
    .sec-h h2 { margin: 0; font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 800; }

    .rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(158px, 1fr); gap: 11px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
    .rail::-webkit-scrollbar { display: none; }
    .act {
      scroll-snap-align: start; position: relative; border-radius: var(--radius-s); overflow: hidden;
      background: var(--surface) center/cover no-repeat; border: 1px solid var(--line); padding: 16px 14px 14px;
      min-height: 128px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px;
      text-decoration: none; color: var(--ink); transition: transform .15s ease, border-color .2s ease; cursor: pointer;
    }
    .act:hover { transform: translateY(-3px); border-color: rgba(124,92,255,.45); }
    /* Dark aurora-tinted gradient over the card photo — text sits in the
       bottom band (heavily darkened, measured contrast >=8.9:1 against
       var(--ink) across every card); the top stays light so the photo itself
       reads, since the icon below no longer depends on the gradient for
       contrast (that's the chip's job — see .act .em). */
    .act::before {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(8,7,12,.05) 0%, rgba(8,7,12,.35) 50%, rgba(8,7,12,.88) 100%),
        linear-gradient(120deg, rgba(124,92,255,.16), rgba(255,77,141,.08));
    }
    /* Solid --bg chip behind the icon — the SAME pattern already used for
       every other icon in the app (.wcost .ic, .lnkrow .ic, .steps3 .s .ic
       all sit on a solid surface color, never bare). Card
       photos are arbitrary/uncontrolled, so a translucent glass icon floating
       directly on one measures ~2.7:1 contrast on average (below WCAG AA's
       3.0) and swings wildly per-photo. --bg as a fixed chip measures >=3.1:1
       for every icon regardless of the photo underneath — verified by
       sampling all 20 icons against the design tokens before picking it. */
    .act .em {
      position: relative; margin-bottom: auto; width: 38px; height: 38px; border-radius: 12px;
      background: var(--bg); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 4px 14px rgba(0,0,0,.35);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .act b { position: relative; font-size: 14px; line-height: 1.25; font-weight: 700; }
    .act span { position: relative; font-size: 11.5px; color: var(--muted); }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 13px 10px; text-align: center; }
    .stat .n { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat .l { color: var(--muted); font-size: 10.5px; margin-top: 3px; letter-spacing: .04em; }
    @media (max-width: 400px) { .stats { grid-template-columns: repeat(2, 1fr); } }

    /* Fixed region: 3×4 thumbnails, so the gallery keeps its footprint across
       pages and the page doesn't jump when a page has fewer items. */
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; align-content: start; min-height: 46vh; }
    @media (min-width: 560px) { .gallery { grid-template-columns: repeat(4, 1fr); min-height: 40vh; } }
    .pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 12px; }
    .pager button { min-width: 44px; height: 40px; border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 18px; cursor: pointer; }
    .pager button:disabled { opacity: .35; cursor: default; }
    .pager .pinfo { font-size: 14px; opacity: .7; min-width: 74px; text-align: center; }
    .shot { position: relative; aspect-ratio: 1; border-radius: var(--radius-s); overflow: hidden; background: var(--surface); border: 1px solid var(--line); display: block; transition: transform .15s ease; }
    .shot:hover { transform: scale(1.03); }
    .shot img, .shot video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .shot .tag { position: absolute; left: 7px; bottom: 7px; font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); padding: 3px 7px; border-radius: 999px; }
    /* In-progress render card: expanding violet ripple rings over the surface. */
    .shot.pending { pointer-events: none; background: var(--surface-2); }
    .shot.pending .rip { position: absolute; inset: 0; margin: auto; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--violet); opacity: 0; animation: ripple 2s ease-out infinite; }
    .shot.pending .rip:nth-child(2) { animation-delay: .66s; border-color: #b44dff; }
    .shot.pending .rip:nth-child(3) { animation-delay: 1.33s; border-color: var(--magenta); }
    @keyframes ripple { 0% { transform: scale(.35); opacity: .9; } 100% { transform: scale(3.4); opacity: 0; } }
    /* Cinema Studio composer: retro-segmented mode chip + model rows. */
    .seg { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin: 12px 0 4px; }
    .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: 13.5px; padding: 9px 0; border-radius: 999px; cursor: pointer; }
    .seg button.on { background: var(--aurora); color: #fff; }
    .mlist { display: flex; flex-direction: column; gap: 8px; }
    .mlist.hide { display: none; }
    .mlistq {
      width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-s);
      padding: 10px 12px; color: var(--ink); font: inherit; font-size: 14px; margin-bottom: 2px;
    }
    .mrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 11px 12px; color: var(--ink); cursor: pointer; }
    .mrow.on { border-color: var(--violet); box-shadow: 0 0 0 1px var(--violet); }
    /* Live drag-scrub preview highlight (wireModelScrub) — distinct from
       .on (the committed model) since a scrub commits only on release; the
       hovered row must read as "about to pick this", not "already picked". */
    .mrow.hover { border-color: rgba(124,92,255,.5); background: rgba(124,92,255,.1); }
    .mrow .price { white-space: nowrap; color: var(--amber); font-weight: 700; font-size: 13px; }
    .mnote { font-size: 11px; color: var(--muted); margin-top: 2px; }
    /* Capability line: measured wait + what this engine can do that others can't. */
    .mmeta { font-size: 10.5px; color: var(--faint); margin-top: 3px; letter-spacing: .01em; }
    /* Collapsed model picker — the composer shows ONE engine, not the whole
       registry, and expands only on demand. */
    .mpick {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      background: var(--surface); border: 1px solid rgba(124,92,255,.35); border-radius: var(--radius-s);
      padding: 11px 12px; color: var(--ink); cursor: pointer; touch-action: none; user-select: none;
    }
    .mpick > span:first-child { flex: 1; }
    .mpick .price { font-size: 12px; color: var(--amber); font-weight: 700; white-space: nowrap; }
    .mpick .mchev { color: var(--muted); font-size: 10px; }
    .mpick + .mlist { margin-top: 8px; }
    /* S2: the preset arrives as a removable tag beside the prompt box, not a
       textbox fill (docs/wireframes — home-studio wireframe, version 2). */
    .ptagrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .ptag {
      display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: var(--ink);
      background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 13px;
    }
    .ptag button {
      display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px;
      border: 0; border-radius: 50%; background: var(--surface-2); color: var(--muted); font: 700 11px/1 inherit; cursor: pointer;
    }
    .empty {
      grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 34px 18px;
      border: 1px dashed rgba(255,255,255,.14); border-radius: var(--radius-s); font-size: 13.5px; line-height: 1.6;
    }

    .packs { display: grid; gap: 11px; }
    @media (min-width: 560px) { .packs { grid-template-columns: 1fr 1fr; } }
    /* Card, not a single row: name+price on top, the patron amount + its rate
       below, and a yield line at the bottom translating the credits into what
       they actually buy — see packTileHtml. A flat "60 patrons · 3 700 ₸" row
       read as three unrelated numbers with no unit of meaning between them. */
    .pack {
      position: relative; display: flex; flex-direction: column; gap: 10px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s);
      padding: 16px; cursor: pointer; transition: transform .15s ease, border-color .2s ease; text-align: left;
      color: var(--ink); font: inherit;
    }
    .pack:hover { transform: translateY(-2px); border-color: rgba(124,92,255,.5); }
    .packtop { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    /* flex:1 + nowrap/ellipsis, not wrap: at the 2-column breakpoint (≥560px)
       the narrower card has too little room for "ВИДЕО-СЕТ" beside its price
       on one line, and letting it wrap breaks mid-word ("ВИДЕО-" / "СЕТ") —
       an ellipsis reads better than a broken word at any width. */
    .packname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .packprice { flex: none; font-weight: 800; color: var(--amber); font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .packmid { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .pack .amount { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .pack .per { color: var(--faint); font-size: 11px; white-space: nowrap; }
    .packyield { display: flex; flex-wrap: wrap; gap: 6px 16px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
    .packyield span { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .packyield img { width: 13px; height: 13px; opacity: .85; }
    /* A pack too small to finish the render the user just tried (see .short
       below) swaps the yield line for the shortfall itself — knowing it
       covers "up to 30 photos" is useless when the point is that it can't
       cover THIS request. */
    .packyield.warn { color: #ff9a9a; border-top-color: rgba(255,138,138,.25); }
    .pack .hot {
      position: absolute; top: -9px; left: 14px; font-size: 9.5px; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; background: var(--aurora); padding: 4px 9px; border-radius: 999px; color: #fff;
    }
    .pack.best { border-color: rgba(255,77,141,.55); box-shadow: 0 6px 30px rgba(255,77,141,.12); }
    /* A pack too small to finish the render the user just tried. Still buyable
       — it is a valid top-up — but visibly not the way out of this screen. */
    .pack.short { opacity: .55; }

    /* ————— the once-per-account entry tier —————
       Deliberately NOT a decorated .pack. It is a different KIND of thing: every
       other tile is a price you can pay again tomorrow, this one disappears the
       moment it is used, and a buyer has to be able to see that difference
       before reading a word. So it gets its own object class — full-width even
       in the two-column grid, a lit gradient face instead of the flat surface,
       and the ladder price struck through beside it so the discount is a
       comparison the buyer makes rather than a claim we assert.

       No countdown anywhere on it: nothing here expires by clock, and a fake
       timer on a permanent offer is the one thing that would make it read as a
       trick. The scarcity is real and personal — "one per account" — and that
       is what the badge says. */
    .firstpack {
      /* flex-start, not center: the body is three lines tall and the price is
         one, so centring floats the title away from the icon it belongs to.
         The top padding is what the badge occupies — it is positioned out of
         flow, so without it the title runs underneath. */
      position: relative; grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 14px;
      border-radius: var(--radius); padding: 34px 18px 17px; cursor: pointer; text-align: left;
      color: var(--ink); font: inherit; overflow: hidden;
      border: 1px solid rgba(124,92,255,.45);
      background:
        radial-gradient(120% 140% at 0% 0%, rgba(124,92,255,.30), transparent 62%),
        radial-gradient(120% 140% at 100% 100%, rgba(255,77,141,.24), transparent 60%),
        var(--surface);
      box-shadow: 0 10px 40px rgba(124,92,255,.16);
      transition: transform .15s ease, box-shadow .2s ease;
    }
    .firstpack:hover { transform: translateY(-2px); box-shadow: 0 14px 48px rgba(124,92,255,.24); }
    /* The gift mark. A glyph rather than an image so it costs no request and
       cannot arrive after the price it is meant to introduce. */
    .firstpack .fp-ic {
      flex: none; width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center;
      font-size: 23px; background: var(--aurora); box-shadow: 0 6px 22px rgba(124,92,255,.4);
    }
    .firstpack .fp-body { flex: 1 1 auto; min-width: 0; }
    .firstpack .fp-title { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
    .firstpack .fp-sub { color: var(--muted); font-size: 12px; margin-top: 3px; line-height: 1.45; }
    .firstpack .fp-price { flex: none; text-align: right; }
    .firstpack .fp-now { font-size: 19px; font-weight: 800; color: var(--amber); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .firstpack .fp-was { font-size: 11.5px; color: var(--faint); text-decoration: line-through; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .firstpack .fp-badge {
      position: absolute; top: 0; left: 0; font-size: 9.5px; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; background: var(--aurora); color: #fff; padding: 5px 12px 5px 18px;
      border-radius: var(--radius) 0 11px 0;
    }
    @media (max-width: 400px) {
      .firstpack { padding: 32px 14px 15px; gap: 11px; }
      .firstpack .fp-ic { width: 40px; height: 40px; border-radius: 13px; font-size: 20px; }
      .firstpack .fp-title { font-size: 14px; }
    }

    /* Progression card — the mobile-game "level ring + XP bar" read. The ring is
       a conic-gradient sweep driven by --pct, so the fill needs no extra markup
       and no SVG. */
    /* Header level chip: level number + live XP, deliberately narrow so it sits
       beside the balance without competing with it. The XP count is small and
       sits ABOVE the bar — the bar answers "how close am I?" at a glance, the
       number is there for whoever wants the detail. Hidden entirely while the
       ladder is unconfigured: an empty meter in the header reads as broken. */
    .lvlmini { display: inline-flex; align-items: center; gap: 7px; padding: 4px 9px 4px 4px;
      border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
      cursor: pointer; font: inherit; color: inherit; }
    .lvlmini .lvlnum { display: grid; place-items: center; width: 24px; height: 24px; flex: 0 0 24px;
      border-radius: 999px; font-size: 12px; font-weight: 800; color: #fff;
      background: linear-gradient(135deg, var(--violet), var(--magenta)); }
    /* Fixed width, not min-width: otherwise the chip resizes as the XP number
       grows a digit, and a header element that shifts under you reads as a
       glitch. 58px holds "12 400 XP" at this size. */
    .lvlmini .lvlmb { display: flex; flex-direction: column; gap: 3px; width: 58px; }
    .lvlmini small { font-size: 9px; line-height: 1; letter-spacing: .02em; color: var(--muted); white-space: nowrap; }
    .lvlmini .lvlmbar { height: 4px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
    .lvlmini .lvlmbar i { display: block; height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, var(--violet), var(--magenta)); transition: width .6s ease; }
    /* A level-up is the one moment worth interrupting for: the chip pulses once
       when the number changes, so progress is felt and not merely displayed. */
    @keyframes lvlpop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
    .lvlmini.levelup .lvlnum { animation: lvlpop .6s ease; }
    /* Release notes sheet — plain list, no product-launch theatre. */
    .wnlist { margin: 12px 0 0; padding: 0; list-style: none; }
    .wnlist li { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.5; }
    .wnlist li:last-child { border-bottom: 0; }
    .wndate { color: var(--muted); font-size: 11px; }

    /* XP in flight. Fixed-positioned so it can cross any scroll container on
       its way to the header, and pointer-events:none so it can never intercept
       a tap it happens to fly over. */
    .xpfly { position: fixed; z-index: 90; pointer-events: none;
      padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 800; color: #fff;
      background: linear-gradient(135deg, var(--violet), var(--magenta));
      box-shadow: 0 6px 20px rgba(0,0,0,.45); white-space: nowrap; }
    /* The bar's own fill is already transitioned (.lvlmbar i), so the count-up
       and the fill move together without any extra choreography. */
    .lvlmini.xpland .lvlnum { animation: lvlpop .5s ease; }
    @media (prefers-reduced-motion: reduce) {
      .xpfly { transition: none !important; }
      .achstage .badge { animation: none; }
      .bgholo { animation: none; }
    }

    /* Level gets its own full-width row: it is the number you check, and it
       reads badly squeezed. Achievements, certificates and rewards share the
       row below — three shelves of the same kind: one earned by using the
       product, one by finishing a course, one explaining what the number
       above actually buys. */
    .lvlrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: stretch; margin-top: 10px; }
    /* min-width:0 lets a column actually shrink to its share instead of being
       held open by its content; the wrappers stretch so the buttons inside can
       fill them. */
    .lvlrow > * { min-width: 0; display: flex; }
    .lvlrow > * > * { flex: 1; }
    @media (max-width: 300px) { .lvlrow { grid-template-columns: 1fr; } }
    /* Certificate: a seal, not a shield — a different object class from the
       achievement badges, so the two shelves never read as one set. */
    .seal { position: relative; width: 100%; aspect-ratio: 1; display: grid; place-items: center; }
    .seal i { position: absolute; inset: 0; border-radius: 999px;
      background: radial-gradient(120% 90% at 32% 20%, rgba(255,255,255,.6) 0%, transparent 45%),
        conic-gradient(from 210deg, #6b5a25, #e9d08a, #8a7433, #f3e3ae, #6b5a25);
      box-shadow: inset 0 -6px 12px rgba(0,0,0,.35), 0 5px 14px rgba(0,0,0,.4); }
    .seal b { position: relative; z-index: 1; font-size: 20px; }
    .seal.locked { filter: grayscale(1) brightness(.5); opacity: .6; }
    /* Reward tile: a gem, not a badge (achievements) or a seal (certificates)
       — a third distinct object class, cut as a five-point jewel and tied to
       the Level card's own violet→magenta gradient rather than tier or group
       colours, so it reads as "the Level shelf" rather than a fourth
       achievement family. */
    .gem { position: relative; width: 100%; aspect-ratio: 1; display: grid; place-items: center; }
    .gem i { position: absolute; inset: 4%;
      clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
      background: radial-gradient(120% 90% at 32% 20%, rgba(255,255,255,.6) 0%, transparent 45%),
        conic-gradient(from 210deg, var(--violet), var(--magenta), #4a3a8a, var(--magenta), var(--violet));
      box-shadow: inset 0 -6px 12px rgba(0,0,0,.35), 0 5px 14px rgba(0,0,0,.4); }
    .gem b { position: relative; z-index: 1; font-size: 20px; }
    .gem img { position: relative; z-index: 1; width: 62%; height: 62%; object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
    .gem.locked i { filter: grayscale(1) brightness(.5); opacity: .6; }
    .certrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .certrow:last-of-type { border-bottom: 0; }
    .certrow .seal { width: 46px; flex: 0 0 46px; }
    .certrow .gem { width: 46px; flex: 0 0 46px; }
    .certrow .ct { flex: 1; min-width: 0; }
    .certrow .ct b { display: block; font-size: 14px; }
    .certrow .ct small { color: var(--muted); font-size: 12px; line-height: 1.45; }

    /* --- Holographic badge ---------------------------------------------
       Built from CSS, not bitmaps: it has to look right at 44px on a shelf
       and at 200px spinning in the detail view, on any DPI, with no asset to
       download before the wall renders. Layers, outward in:
         .bgcore   — the metal rim, an off-axis conic sweep so the highlight
                     sits where a real bevelled surface would catch light —
                     colour is TIER (bronze/silver/gold);
         .bgrim    — the bevel on that rim;
         .bgaccent — the fill inside the rim — colour is GROUP, the wall's
                     section (Apple Fitness "Close Your Rings" style: rim =
                     prestige, fill = category, two independent signals);
         .bgface   — the glyph, lifted on the Z axis so it parallaxes against
                     rim + fill as the badge turns (this is what sells depth);
         .bgholo   — the interference sheen, a wide diagonal band that travels.
       Locked badges keep the geometry and lose the colour, so the shelf reads
       as one set with holes in it rather than two unrelated groups. */
    .badge { position: relative; width: 100%; aspect-ratio: 1 / 1.12; transform-style: preserve-3d;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.45));
      /* Fallback so an achievement group with no matching .grp-* rule (a
         renamed/new group added server-side before its CSS ships) still
         clips to SOME shape instead of clip-path: var(--shape) resolving to
         nothing and rendering a bare unclipped rectangle — losing the
         silhouette entirely, not just the group colour. */
      --shape: circle(45% at 50% 50%); }
    /* Silhouette is per-GROUP (--shape, set below) — Apple Fitness codes its
       awards by shape as well as colour (circle/banner/hexagon/...), not
       colour alone, so a locked badge is recognisable by outline before the
       fill is legible, and the shape itself carries the category. */
    .bgcore, .bgrim, .bgaccent, .bgholo { position: absolute; inset: 0;
      clip-path: var(--shape); }
    .bgcore {
      background:
        radial-gradient(120% 80% at 30% 12%, rgba(255,255,255,.75) 0%, transparent 42%),
        conic-gradient(from 205deg at 34% 26%,
          var(--b3) 0deg, var(--b2) 58deg, var(--b1) 120deg, var(--b3) 190deg,
          var(--b2) 250deg, var(--b1) 312deg, var(--b3) 360deg);
    }
    /* Bevel: a bright inner edge on the lit side, dark on the shadow side —
       the cue that tells the eye this is metal with thickness. */
    .bgrim { border: 0; transform: translateZ(4px);
      background: linear-gradient(160deg, rgba(255,255,255,.55), transparent 26%, transparent 74%, rgba(0,0,0,.55));
      mix-blend-mode: overlay; }
    /* Inset a touch so the rim stays visible all around — a ring of metal
       framing a flat colour, not the colour running to the same edge as it. */
    .bgaccent { inset: 9%; transform: translateZ(7px);
      background: radial-gradient(120% 90% at 32% 22%, color-mix(in srgb, var(--grp) 70%, white 30%) 0%,
        var(--grp) 55%, color-mix(in srgb, var(--grp) 75%, black 25%) 100%); }
    /* Both children share one grid cell so the artwork lands exactly on top of
       the glyph it replaces. */
    .bgface { position: absolute; inset: 0; display: grid; place-items: center; transform: translateZ(11px); }
    .bgface > * { grid-area: 1 / 1; }
    /* SVG, so the glyph scales with the badge instead of with the inherited
       font-size — a percentage font-size would silently stay tiny. */
    .bgface svg { width: 62%; height: 62%; overflow: visible; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
    .bgface svg text { font-size: 64px; }
    .bgface img { width: 62%; height: 62%; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
    .bgholo {
      background: linear-gradient(112deg, transparent 30%, rgba(255,255,255,.75) 44%,
        rgba(150,215,255,.65) 50%, rgba(255,170,240,.5) 56%, transparent 70%);
      mix-blend-mode: screen; transform: translateZ(15px);
      background-size: 300% 300%; animation: holo 4.5s linear infinite;
    }
    @keyframes holo { 0% { background-position: 140% 0; } 100% { background-position: -40% 0; } }
    .badge.locked { filter: grayscale(1) brightness(.5) contrast(.9); opacity: .55; }
    .badge.locked .bgholo { animation: none; opacity: .12; }
    .badge.locked .bgaccent { opacity: .5; }
    .tier-bronze { --b1: #7a4a22; --b2: #e0a463; --b3: #4d2c12; }
    .tier-silver { --b1: #6f7887; --b2: #e6edf6; --b3: #444c58; }
    .tier-gold   { --b1: #8a6410; --b2: #ffdf85; --b3: #5a3f06; }
    /* Group → fill colour AND silhouette, per docs/achievements.md's table.
       Generated by scripts/badge-shapes.mts — re-run it and paste over this
       block to retune a shape or add an 8th group, rather than hand-editing
       these coordinates. Point counts run 20-65 depending on the shape (a
       circle needs far fewer than a quatrefoil to look smooth at 190px) —
       every --shape here is a plain polygon(), never path(): path() takes
       literal px and won't rescale across the 44px tile / 190px spin / profile
       sizes the same badge renders at, so curves are sampled into percentage
       points instead, exactly like the old shield did.
       .grp-output is the one exception, generated nowhere: a polygon with
       equal x/y percentage radius renders as an ellipse once you account for
       .badge's non-square aspect-ratio (1/1.12) — percentages resolve
       per-axis against a box that's taller than wide. circle()'s percentage
       radius instead resolves against sqrt(width²+height²)/√2, a single
       scalar applied equally in every direction, so it stays a true circle
       regardless of the box's aspect ratio.
       --grp is this exact 7-colour run, in this exact order — not 7
       independently-picked hexes. It's the first 7 slots of an 8-colour
       categorical theme pre-validated for the dark surface (OKLCH L
       0.48-0.67, ≥3:1 contrast, worst adjacent CVD ΔE 8.4). The colours this
       replaced weren't: worst adjacent pair (engagement↔support, exactly
       this order's neighbours on the wall) measured CVD ΔE 1.8 — engagement
       and support were nearly indistinguishable to deuteranopes. Re-check
       any future recolour with the dataviz skill's validator before
       shipping; reordering these 7 (not just recolouring one) can silently
       reintroduce an adjacent-pair failure even if each colour alone still
       looks fine. */
    .grp-output      { --grp: #3987e5; --shape: circle(45% at 50% 50%); }
    .grp-formats     { --grp: #d95926; --shape: polygon(2% 18%, 2.31% 14.88%, 3.22% 11.88%, 4.7% 9.11%, 6.69% 6.69%, 9.11% 4.7%, 11.88% 3.22%, 14.88% 2.31%, 18% 2%, 82% 2%, 85.12% 2.31%, 88.12% 3.22%, 90.89% 4.7%, 93.31% 6.69%, 95.3% 9.11%, 96.78% 11.88%, 97.69% 14.88%, 98% 18%, 98% 78%, 100% 100%, 50% 76%, 0% 100%, 2% 78%, 2% 18%); }
    .grp-exploration { --grp: #199e70; --shape: polygon(73% 11.16%, 74.93% 17.63%, 77.32% 23.85%, 80.15% 29.8%, 83.44% 35.49%, 87.18% 40.92%, 91.36% 46.09%, 96% 51%, 91.36% 55.91%, 87.18% 61.08%, 83.44% 66.51%, 80.15% 72.2%, 77.32% 78.15%, 74.93% 84.37%, 73% 90.84%, 66.43% 89.28%, 59.86% 88.24%, 53.29% 87.72%, 46.71% 87.72%, 40.14% 88.24%, 33.57% 89.28%, 27% 90.84%, 25.07% 84.37%, 22.68% 78.15%, 19.85% 72.2%, 16.56% 66.51%, 12.82% 61.08%, 8.64% 55.91%, 4% 51%, 8.64% 46.09%, 12.82% 40.92%, 16.56% 35.49%, 19.85% 29.8%, 22.68% 23.85%, 25.07% 17.63%, 27% 11.16%, 33.57% 12.72%, 40.14% 13.76%, 46.71% 14.28%, 53.29% 14.28%, 59.86% 13.76%, 66.43% 12.72%, 73% 11.16%); }
    .grp-engagement  { --grp: #c98500; --shape: polygon(13% 13%, 20.4% 14.47%, 27.8% 15.6%, 35.2% 16.42%, 42.6% 16.91%, 50% 17.07%, 57.4% 16.91%, 64.8% 16.42%, 72.2% 15.6%, 79.6% 14.47%, 87% 13%, 85.53% 20.4%, 84.4% 27.8%, 83.58% 35.2%, 83.09% 42.6%, 82.93% 50%, 83.09% 57.4%, 83.58% 64.8%, 84.4% 72.2%, 85.53% 79.6%, 87% 87%, 79.6% 85.53%, 72.2% 84.4%, 64.8% 83.58%, 57.4% 83.09%, 50% 82.93%, 42.6% 83.09%, 35.2% 83.58%, 27.8% 84.4%, 20.4% 85.53%, 13% 87%, 14.47% 79.6%, 15.6% 72.2%, 16.42% 64.8%, 16.91% 57.4%, 17.07% 50%, 16.91% 42.6%, 16.42% 35.2%, 15.6% 27.8%, 14.47% 20.4%, 13% 13%); }

    /* Shelf tiles under the level card, one per grid column.
       width/height 100% are load-bearing: <button> is a form control, so it
       sizes to its CONTENT even as a grid item with display:flex — without
       these the two tiles shrink to whatever their badge and caption need,
       land at different widths, and stop lining up with the level card above.
       box-sizing keeps the border and padding inside that 100%. */
    .achtile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 100%; box-sizing: border-box; min-height: 148px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px 10px; cursor: pointer; font: inherit; color: inherit; }
    /* Sized as a share of the tile, not a fixed 54px, so the two shelves stay
       visually equal whatever the column width works out to. */
    .achtile .badge { width: 62%; max-width: 78px; }
    .achtile .seal { width: 62%; max-width: 78px; }
    .achtile .gem { width: 62%; max-width: 78px; }
    .achtile small { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.35; }

    /* Wall + detail */
    .achgroup + .achgroup { margin-top: 22px; }
    .achgrouphead { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 14px; font-weight: 700; }
    .achgrouphead i { width: 9px; height: 9px; border-radius: 50%; background: var(--grp); flex: none; }
    .achgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .achcell { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: center; }
    .achcell b { display: block; font-size: 11px; margin-top: 7px; font-weight: 600; }
    .achcell small { display: block; font-size: 10px; color: var(--muted); }
    .achstage { display: grid; place-items: center; padding: 18px 0 6px; perspective: 900px; touch-action: pan-y; }
    .achstage .badge { width: 190px; animation: spin 9s linear infinite; }
    .achstage.dragging .badge { animation: none; }
    @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
    .achmeta { text-align: center; }
    .achmeta h3 { margin: 4px 0 2px; }
    .achmeta .sub { margin-bottom: 10px; }

    .lvlcard { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
    .lvlcard.off { opacity: .75; }
    .lvlring {
      flex: 0 0 auto; width: 56px; height: 56px; border-radius: 999px; display: grid; place-items: center; position: relative;
      background: conic-gradient(var(--violet) calc(var(--pct, 0) * 1%), rgba(255,255,255,.08) 0);
    }
    .lvlring::after { content: ""; position: absolute; inset: 4px; border-radius: 999px; background: var(--surface); }
    .lvlring b { position: relative; z-index: 1; font-size: 20px; font-weight: 800; }
    .lvlbody { flex: 1; min-width: 0; }
    .lvltop { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .lvltop b { font-size: 15px; }
    .lvlxp { color: var(--amber); font-weight: 700; font-size: 13px; white-space: nowrap; }
    .lvlbar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin: 8px 0 6px; }
    .lvlbar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--violet), var(--magenta)); transition: width .5s ease; }

    .refcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 19px; }
    .refcard h3 { margin: 0 0 5px; font-size: 16px; }
    .refcard p { margin: 0 0 14px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 14px 16px; }
    .setrow span { display: flex; flex-direction: column; gap: 2px; }
    .setrow small { color: var(--muted); font-size: 12px; }
    .setrow input[type=checkbox] { flex: none; width: 46px; height: 28px; appearance: none; -webkit-appearance: none; background: var(--line); border-radius: 999px; position: relative; cursor: pointer; transition: background .2s; }
    .setrow input[type=checkbox]:checked { background: var(--amber); }
    .setrow input[type=checkbox]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .setrow input[type=checkbox]:checked::after { transform: translateX(18px); }
    /* Partner block: same card language as the referral finance card above it,
       because it IS the same thing one tier up — inviting people and being paid
       for it. What differs is what a partner additionally has: several codes,
       and money that leaves the system. */
    .pcode { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .pcode:last-child { border-bottom: 0; }
    .pcode .pc { flex: 1; min-width: 0; }
    .pcode .pc code { display: block; font-size: 11px; color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pcode .pc b { font-size: 13px; }
    .pcode .cp { flex: 0 0 auto; background: none; border: 1px solid var(--line);
      border-radius: 9px; color: inherit; font: inherit; font-size: 11px; padding: 5px 9px; cursor: pointer; }
    .wrow { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 7px 0; color: var(--muted); }
    .wrow b { color: var(--text); }

    /* Referral finance card: the two numbers a promoter actually asks for —
       what their invitees paid us, and what we owe them for it. */
    .fincard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 15px; margin-top: 12px; }
    .finrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .finrow:last-child { border-bottom: 0; }
    .finrow span { color: var(--muted); }
    .finrow b { font-size: 15px; white-space: nowrap; }
    .finrow.owed b { color: var(--accent, #7cf); }
    .finnote { margin: 10px 2px 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .linkrow { display: flex; gap: 9px; }
    .linkbox {
      flex: 1; min-width: 0; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-s);
      padding: 11px 13px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-family: ui-monospace, Menlo, monospace;
    }
    .copy { flex: none; width: auto; padding: 11px 15px; }

    /* Per-referral drill-down list (Друзья page) — one row per invited friend
       with a funnel-stage status chip. Purely a read over data we already have. */
    .refempty { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .reflist { display: flex; flex-direction: column; gap: 8px; }
    .refrow {
      display: flex; align-items: center; gap: 11px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 11px 13px;
    }
    .rfic {
      flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: var(--surface-2); border: 1px solid var(--line);
    }
    .rfmeta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .rfname { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rfmeta small { color: var(--muted); font-size: 11px; }
    .rfchip { flex: 0 0 auto; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; border: 1px solid transparent; }
    .rfchip.paid { color: #37c99a; background: rgba(55,201,154,.14); border-color: rgba(55,201,154,.38); }
    .rfchip.free { color: #b48dff; background: rgba(124,92,255,.14); border-color: rgba(124,92,255,.36); }
    .rfchip.idle { color: var(--muted); background: var(--surface-2); border-color: var(--line); }

    /* "Ещё" tab — the About card + link groups (Друзья/Помощь/О проекте/Связаться). */
    .aboutcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 19px; }
    .ac-hero { display: flex; margin-bottom: 12px; }
    /* Named .brandtag, not .badge — the achievement medallion (below) already
       owns that name. They collided silently for as long as both existed:
       equal specificity, this rule later in the cascade, so its padding/
       border-radius:999px/background leaked onto every medallion — most
       visibly at the 44-54px shelf-tile size, where a few px of padding is a
       huge fraction of the box and rounds it into a pill behind the shape. */
    .brandtag {
      display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .1em;
      color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px;
    }
    .brandtag i { width: 6px; height: 6px; border-radius: 50%; background: var(--violet); box-shadow: 0 0 8px var(--violet); }
    .aboutcard h2 { margin: 0 0 8px; font-size: 19px; }
    .aboutcard h2 span { color: var(--violet); }
    .aboutcard p { margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .steps3 { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 4px; margin-bottom: 16px; }
    .steps3 .s { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
    .steps3 .s .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .steps3 .s small { font-size: 10.5px; font-weight: 700; }
    .steps3 .ar { color: var(--faint); font-size: 13px; }
    .valuebar {
      display: flex; align-items: center; gap: 10px; padding: 12px 13px; border-radius: 13px; margin-bottom: 16px;
      background: linear-gradient(100deg, rgba(124,92,255,.16), rgba(255,77,141,.06)); border: 1px solid rgba(124,92,255,.28);
    }
    .valuebar .em { font-size: 20px; flex: none; }
    .valuebar p { margin: 0; font-size: 12px; }
    .lnkrow {
      display: flex; align-items: center; gap: 11px; padding: 14px 15px; border-radius: var(--radius-s);
      background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; color: var(--ink);
      cursor: pointer; transition: border-color .15s ease;
    }
    .lnkrow:hover { border-color: rgba(124,92,255,.4); }
    .lnkrow .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; }
    .lnkrow .tx { flex: 1; }
    .lnkrow .tx small { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .lnkrow .chev { color: var(--faint); flex: none; }

    /* Custom icon set (public/img/ic-*.png) — sized like an emoji glyph (1em) so
       it drops into any font-sized container (tabbar, rail cards, pills, roadmap)
       without per-spot sizing rules. Premium glass/aurora style, generated to
       match the app's own palette — see docs/web-app.md. */
    .appicon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; object-fit: contain; }

    /* ————— welcome / first-launch onboarding ————— */
    .welcome {
      position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom));
    }
    .wskip {
      align-self: flex-end; background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px;
      font-weight: 700; padding: 14px 2px 4px; cursor: pointer;
    }
    .wslides { flex: 1; overflow: hidden; position: relative; max-width: 560px; margin: 0 auto; width: 100%; }
    .wslide { display: none; height: 100%; overflow-y: auto; -ms-overflow-style: none; scrollbar-width: none; }
    .wslide::-webkit-scrollbar { display: none; }
    .wslide.on { display: block; animation: pagein .22s ease; }
    .whero { position: relative; border-radius: 18px; overflow: hidden; margin: 6px 0 16px; aspect-ratio: 16/11; }
    .whero img { width: 100%; height: 100%; object-fit: cover; display: block; animation: wkenburns 16s ease-in-out infinite alternate; }
    .whero::after {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(8,7,12,0) 28%, rgba(8,7,12,.6) 72%, rgba(8,7,12,.94) 100%),
        linear-gradient(120deg, rgba(124,92,255,.22), rgba(255,77,141,.1));
    }
    .wsparkles i {
      position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 8px 2px rgba(255,255,255,.85); animation: wtwinkle 3.2s ease-in-out infinite;
    }
    .whero .wherotext { position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 2; }
    .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: rgba(255,255,255,.75); font-weight: 700; margin-bottom: 4px; }
    .whero h2 { font-size: 21px; font-weight: 700; color: #fff; margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
    @keyframes wkenburns { from { transform: scale(1); } to { transform: scale(1.11); } }
    @keyframes wtwinkle { 0%, 100% { opacity: .12; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
    .wslide > p.lead { font-size: 14px; color: var(--muted); margin: 0 0 18px; line-height: 1.55; }
    .wcosts { display: flex; flex-direction: column; gap: 9px; margin-bottom: 16px; }
    .wcost { display: flex; align-items: center; gap: 11px; padding: 12px 13px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
    .wcost .ic { width: 34px; height: 34px; border-radius: 11px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
    .wcost .tx { flex: 1; font-size: 13.5px; font-weight: 700; }
    .wcost .tx small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; margin-top: 1px; }
    .wcost .px { font-size: 13.5px; font-weight: 800; color: var(--amber); flex: none; }
    .wnote {
      display: flex; gap: 9px; padding: 12px 13px; border-radius: 13px; margin-bottom: 6px;
      background: rgba(124,92,255,.1); border: 1px solid rgba(124,92,255,.25); font-size: 12.5px; color: var(--muted); line-height: 1.5;
    }
    .wladder { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .wrow { display: flex; align-items: center; gap: 12px; padding: 12px 13px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); position: relative; }
    .wrow.best { border-color: rgba(245,182,74,.5); background: linear-gradient(100deg, rgba(245,182,74,.12), rgba(124,92,255,.06)); }
    .wrow .wt { flex: 1; }
    .wrow .wt b { display: block; font-size: 13.5px; }
    .wrow .wt small { font-size: 11px; color: var(--muted); }
    .wrow .wp { text-align: right; flex: none; }
    .wrow .wp b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
    .wrow .wp small { font-size: 10px; color: #37c99a; font-weight: 800; }
    .wrow .tag {
      position: absolute; top: -8px; right: 11px; font-size: 8.5px; font-weight: 800; letter-spacing: .03em;
      background: var(--amber); color: #241a06; padding: 2px 7px; border-radius: 6px;
    }
    .wgiftbox {
      text-align: center; padding: 24px 16px 20px; border-radius: 18px; margin-bottom: 16px;
      background: linear-gradient(160deg, rgba(124,92,255,.16), rgba(255,77,141,.08)); border: 1px solid rgba(124,92,255,.28);
    }
    .wgiftbox .gn { font-size: 38px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .wgiftbox .gn span { font-size: 19px; vertical-align: 2px; }
    .wgiftbox .gd { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    /* "Already received" state — a green success treatment (matches .rm-pill.on
       elsewhere) instead of a checkmark glyph; the caption reads bold, not muted. */
    .wgiftbox.received { background: rgba(55,201,154,.14); border-color: rgba(55,201,154,.4); }
    .wgiftbox.received .gd { font-weight: 800; color: #37c99a; font-size: 13.5px; }
    .wclaim {
      width: 100%; border: 0; border-radius: 16px; padding: 16px; font: inherit; font-weight: 800; font-size: 14.5px;
      color: #fff; background: var(--aurora); box-shadow: 0 12px 26px rgba(180,77,255,.4); cursor: pointer; margin-bottom: 8px;
    }
    .wclaim:active { transform: scale(.98); }
    .wclaim.done { background: rgba(55,201,154,.14); color: #37c99a; box-shadow: none; border: 1px solid rgba(55,201,154,.35); }
    .wclaim[disabled] { pointer-events: none; }
    .wskipclaim { display: block; width: 100%; background: none; border: 0; color: var(--faint); font: inherit; font-size: 12.5px; font-weight: 700; padding: 8px; cursor: pointer; text-align: center; }
    .wtour {
      display: flex; align-items: center; gap: 11px; padding: 13px; border-radius: 14px; margin-top: 6px;
      background: var(--surface-2); border: 1px solid var(--line); cursor: pointer;
    }
    .wtour .ic { font-size: 19px; flex: none; }
    .wtour .tx { flex: 1; font-size: 13px; font-weight: 700; }
    .wtour .tx small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; margin-top: 1px; }
    .wtour .chev { color: var(--faint); }
    .wnext { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 4px 4px; max-width: 560px; margin: 0 auto; width: 100%; }
    .wdots { display: flex; gap: 6px; }
    .wdots i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
    .wdots i.on { width: 18px; border-radius: 3px; background: var(--aurora); }
    .wnextbtn { border: 0; border-radius: 13px; padding: 11px 20px; font: inherit; font-weight: 800; font-size: 13.5px; color: #fff; background: var(--aurora); cursor: pointer; }
    @media (prefers-reduced-motion: reduce) { .whero img, .wsparkles i { animation: none; } }

    footer { margin-top: 34px; text-align: center; color: var(--faint); font-size: 11px; letter-spacing: .05em; }

    .reveal { opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .5s ease; }
    .reveal.on { opacity: 1; transform: none; }

    /* Multipage: 4 pages toggled by the bottom tab bar. */
    .wrap { padding-bottom: 88px; }
    .page { display: none; }
    .page.on { display: block; animation: pagein .22s ease; }
    @keyframes pagein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; max-width: 640px; margin: 0 auto; background: rgba(8,7,12,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
    .tabbtn { flex: 1; background: none; border: 0; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 5px 0; border-radius: 10px; transition: color .15s; }
    .tabbtn span { font-size: 21px; line-height: 1; filter: grayscale(.4); transition: filter .15s; }
    .tabbtn.on { color: var(--text); }
    .tabbtn.on span { filter: none; }
    .buyhint { color: var(--muted); font-size: 12px; margin: 12px 2px 0; line-height: 1.5; }
    /* Exchange-rate transparency above the pack tiles: the patron↔₸ rate at a glance. */
    .ratenote { color: var(--muted); font-size: 12.5px; margin: -4px 2px 13px; line-height: 1.45; font-variant-numeric: tabular-nums; }

    .skel { border-radius: var(--radius); height: 170px; background: linear-gradient(100deg, var(--surface) 40%, var(--surface-2) 50%, var(--surface) 60%); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .gate { text-align: center; padding: 12vh 20px 0; }
    .gate .dot { width: 62px; height: 62px; border-radius: 20px; background: var(--aurora); margin: 0 auto 22px; box-shadow: 0 0 60px rgba(180,77,255,.5); }
    .gate h1 { font-size: 30px; margin: 0 0 10px; font-weight: 700; }
    .gate p { color: var(--muted); margin: 0 auto 26px; max-width: 34ch; line-height: 1.6; }
    .gate .btn { max-width: 280px; margin: 0 auto; }

    /* ————— studio sheet ————— */
    .sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(4,3,8,.6); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
    .sheet-bg.on { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 720px;
      background: var(--bg-2); border: 1px solid var(--line); border-bottom: 0;
      border-radius: 24px 24px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
      max-height: 88dvh; overflow-y: auto; transform: translateY(102%);
      /* visibility flips AFTER the slide-out so the closed sheet can never leak into view */
      visibility: hidden; transition: transform .3s cubic-bezier(.2,.9,.3,1), visibility 0s .3s;
    }
    .sheet.on { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2,.9,.3,1); }
    .grip { width: 42px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); margin: 4px auto 14px; }
    /* Sticky sheet header so the close (✕) is always reachable, even in a long/scrolled sheet. */
    .sheet-top { position: sticky; top: 0; z-index: 4; margin: -10px -16px 6px; padding: 8px 16px 2px; background: var(--bg-2); }
    .sheet-top .grip { margin: 4px auto 6px; }
    .sheet-x { position: absolute; top: 6px; right: 10px; width: 32px; height: 32px; border-radius: 999px; border: 0; background: rgba(255,255,255,.1); color: #fff; font-size: 15px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .sheet-x:active { background: rgba(255,255,255,.2); }
    .sheet h3 { margin: 2px 0 14px; font-size: 18px; font-weight: 700; }
    .sheet .sub { color: var(--muted); font-size: 13px; margin: -8px 0 16px; line-height: 1.5; }

    .tabs { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
      border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .tab.on { background: var(--aurora); color: #fff; border-color: transparent; }

    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .choice {
      position: relative; text-align: left; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-s); padding: 14px; color: var(--ink); font: inherit; cursor: pointer;
      display: flex; flex-direction: column; gap: 4px; min-height: 84px; transition: border-color .15s ease, transform .12s ease;
    }
    .choice:active { transform: scale(.98); }
    .choice:hover { border-color: rgba(124,92,255,.5); }
    .choice b { font-size: 14px; line-height: 1.3; }
    .choice .price { margin-top: auto; font-size: 12px; color: var(--amber); font-weight: 700; }
    .choice .desc { font-size: 11.5px; color: var(--muted); }

    /* Style Gallery — marketplace-style preset cards (preview photo, price,
       real usage/trending) replacing the plain text choice list for the
       фото/товар tabs. See docs/prompt-library.md. */
    .pcards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pcard {
      position: relative; border-radius: var(--radius-s); overflow: hidden; border: 1px solid var(--line);
      aspect-ratio: 3/4; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 10px 9px;
      text-align: left; color: var(--ink); font: inherit; cursor: pointer; background: var(--surface);
      transition: transform .12s ease, border-color .15s ease;
    }
    .pcard:active { transform: scale(.97); }
    .pcard:hover { border-color: rgba(124,92,255,.5); }
    .pcard .pbg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    /* Same dark aurora-tinted gradient as .act — legible text over an
       arbitrary/uncontrolled preview photo. */
    .pcard::after {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(180deg, rgba(8,7,12,.05) 0%, rgba(8,7,12,.4) 50%, rgba(8,7,12,.92) 100%);
    }
    /* No-art fallback (preset shipped before its preview generation ran, or
       the image failed to load) — flat brand gradient + the preset's own
       emoji, never a broken image. */
    .pcard.noart .pbg { display: none; }
    .pcard.noart::after {
      background: linear-gradient(160deg, rgba(124,92,255,.4), rgba(255,77,141,.3)), linear-gradient(180deg, rgba(8,7,12,0) 40%, rgba(8,7,12,.88) 100%);
    }
    .pcard .ptop { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: auto; }
    .pcard .pleft, .pcard .pright { display: flex; align-items: center; gap: 4px; }
    .pcard .pemoji {
      display: none; flex: none; width: 36px; height: 36px; border-radius: 11px; align-items: center; justify-content: center;
      font-size: 17px; background: var(--bg); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 4px 14px rgba(0,0,0,.35);
    }
    .pcard.noart .pemoji { display: flex; }
    /* Hot badge — top-left, next to the (usually hidden) no-art emoji tile.
       Real trending data only (catalog.presets[].trending, top-5 by actual
       taps) — never shown alongside a lock, which already explains itself. */
    .pcard .phot {
      display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 999px;
      background: rgba(255,77,141,.26); border: 1px solid rgba(255,77,141,.4); font-size: 11px; backdrop-filter: blur(6px);
    }
    /* Usage-count pill — top-right, compact formatting (formatCount). */
    .pcard .pcount {
      font-size: 10.5px; font-weight: 700; color: var(--ink); background: rgba(0,0,0,.42);
      border: 1px solid rgba(255,255,255,.14); padding: 3px 8px; border-radius: 999px; white-space: nowrap; backdrop-filter: blur(6px);
    }
    /* A style gated behind an account Level (reward-architecture preset_gating).
       Dimmed but still legible and still tappable — tapping explains what it
       needs rather than doing nothing, so a lock never reads as a broken card. */
    .pcard .plock {
      font-size: 9.5px; font-weight: 800; letter-spacing: .04em;
      background: rgba(255,255,255,.14); color: var(--ink); padding: 3px 7px; border-radius: 999px; white-space: nowrap;
    }
    .pcard.locked .pbg { opacity: .32; filter: saturate(.4); }
    .pcard.locked b, .pcard.locked .price { opacity: .6; }
    .pcard b { position: relative; z-index: 2; font-size: 13px; line-height: 1.3; }
    .pcard .prow { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: flex-end; gap: 6px; margin-top: 3px; }
    /* Preset cards put the label and the price on ONE row (name left, price
       pill right). The label takes the slack and ellipsises so a long style
       name can never push the price out of the card. Campaign cards keep the
       label on its own line above — their price is a compound
       "image + video" string that would leave the name almost no room. */
    .pcard .prow b {
      min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 1px 8px rgba(0,0,0,.8);
    }
    .pcard .price {
      font-size: 11.5px; font-weight: 700; color: var(--ink); white-space: nowrap;
      background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.12); padding: 3px 8px; border-radius: 999px;
    }

    /* live price badge in the composer */
    .priceBadge { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; color: var(--amber); font-size: 15px; font-variant-numeric: tabular-nums; }

    /* Seedance sale: a banner at the top of the video composers, and a small
       tag on each discounted model's own price. Warm gradient (not the violet
       aurora used for the entry-tile) so the two "look how good this deal is"
       surfaces read as visually distinct campaigns, not one repeated design. */
    /* Staging build marker (docs/staging.md) — only ever rendered when
       ME.staging is non-null, which only a role:"webapp" deploy with
       STAGING_LABEL set ever sends. Loud on purpose (amber, top of page,
       before anything else): the whole point is that nobody mistakes this
       build for production while poking at real Kaspi/fal calls on it. */
    .stagingbar {
      display: flex; align-items: center; gap: 6px; justify-content: center; text-align: center;
      font-size: 11.5px; font-weight: 800; letter-spacing: .01em; color: #1a1206;
      background: linear-gradient(90deg, #f5b64a, #ff8a3d);
      border-radius: var(--radius-s); padding: 8px 12px; margin-bottom: 12px;
    }
    .salebar {
      display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700;
      padding: 10px 13px; border-radius: var(--radius-s); margin-bottom: 12px;
      background: linear-gradient(90deg, rgba(255,138,61,.16), rgba(255,77,141,.16));
      border: 1px solid rgba(255,138,61,.35); color: var(--text);
    }
    .msale {
      display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .02em;
      background: linear-gradient(90deg, #ff8a3d, #ff4d8d); color: #fff;
      padding: 2px 6px; border-radius: 999px; margin-right: 6px; vertical-align: middle;
    }

    /* Home tab promo banner: a "campaign poster" card — deep maroon/near-black
       with a hot-pink glow, per the user-approved wireframe (replaces both the
       original flat dot-grid version and the rejected scrolling-marquee one
       from #94). No absolutely-positioned background layer this time — the
       glow + gradient live directly on .promobar's own `background`, so there
       is nothing to z-index children above. */
    .promobar {
      position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px;
      width: 100%; text-align: left; cursor: pointer; border: 1px solid rgba(255,77,141,.35);
      border-radius: 22px; padding: 18px; margin: 4px 0 2px; color: inherit; font: inherit;
      background:
        radial-gradient(120% 90% at 12% -10%, rgba(255,77,141,.38), transparent 60%),
        linear-gradient(165deg, #2c0e1e 0%, #1a0812 55%, #100710 100%);
    }
    .promotag {
      align-self: flex-start; display: flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); color: #ffd7e6;
      padding: 5px 10px; border-radius: 8px;
    }
    .promotxt { display: block; }
    .promotxt b { display: block; font-size: 19px; font-weight: 800; letter-spacing: -.2px; line-height: 1.25; color: var(--magenta); }
    .promotxt > span { display: block; margin-top: 5px; font-size: 12.5px; color: rgba(244,242,250,.68); }
    .promobtm { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .promocta {
      align-self: flex-start; background: #fff; color: #1a0812; font-weight: 800; font-size: 12.5px;
      padding: 9px 15px; border-radius: 999px; white-space: nowrap;
    }
    .promoprice { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .promodiv { display: block; height: 1px; background: rgba(255,255,255,.14); margin: 0; }
    /* Live countdown card, boxed like the reference "Hours/Minutes/Seconds"
       layout — but in Days/Hours/Minutes, since the real sale window
       (config.seedanceSaleUntil) runs for weeks, not hours. A ticking
       hours:minutes:seconds display would silently claim same-day urgency
       that isn't real. */
    .promocd { background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 10px 12px; }
    .promocd .lbl { display: flex; align-items: center; gap: 5px; font-size: 11px; color: rgba(244,242,250,.62); margin-bottom: 8px; }
    .promocd .boxes { display: flex; gap: 8px; }
    .promocd .box { flex: 1; min-width: 46px; text-align: center; background: rgba(255,255,255,.08); border-radius: 10px; padding: 7px 4px; }
    .promocd .box b { display: block; font-size: 19px; font-weight: 800; line-height: 1.1; color: #fff; }
    .promocd .box span { display: block; margin-top: 1px; font-size: 9px; color: rgba(244,242,250,.55); text-transform: uppercase; letter-spacing: .03em; }

    /* Home tab "TV banner": an evergreen (not sale-gated) showcase reel of the
       best Seedance video generations, styled as an old CRT set — frameless
       screen, an antenna twisted into a heart, a deck with power/LED/grille
       below. User-approved wireframe (several rounds: frameless bezel, the
       antenna reverted from an earlier "neon sign" attempt, the NEUROSHOT
       brand badge + neuron-mark icon mirroring the ● REC tag). Sits directly
       under promoBannerHtml() — see promoTv(). --violet/--magenta/--amber
       below resolve to the app's own :root tokens (no local redefinition
       needed, unlike the standalone mockup this was ported from); the
       --shell-hi/--shell/--shell-lo/--bezel/--chrome/--chrome-dk set is new,
       scoped to .tv only so it can't collide with any other component's
       custom properties. */
    .tv {
      --shell-hi: #e59a44; --shell: #b8621f; --shell-lo: #6b3410;
      --bezel: #1c130f; --chrome: #e7e1d3; --chrome-dk: #8f8878;
      all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%;
      position: relative; padding-top: 40px; margin: 18px 0 4px;
    }
    .tv * { box-sizing: border-box; }
    .tv:focus-visible .tv-shell { outline: 2px solid var(--magenta); outline-offset: 3px; }
    .tv:active .tv-shell { transform: scale(.985); }

    .tv-antenna { position: absolute; top: 0; left: 50%; width: 82px; height: 52px; transform: translateX(-50%); z-index: 2; pointer-events: none; }
    .antenna-leg, .antenna-heart { fill: none; stroke: var(--chrome); stroke-linecap: round; stroke-linejoin: round; }
    .antenna-leg { stroke-width: 5.5; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
    .antenna-heart { stroke-width: 6; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)) drop-shadow(0 0 7px rgba(255,77,141,.6)); }
    @media (prefers-reduced-motion: no-preference) {
      .tv-antenna { animation: tvSway 6.5s ease-in-out infinite; transform-origin: 50% 96%; }
    }
