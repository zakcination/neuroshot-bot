      bind("#stuEndRedo", (el) => (el.onclick = () => { stu.endPhoto = null; stu.endGenerationId = null; viewStudio(); }));
      // ——— Director Mode event handlers ———
      bind("#dmToggle", (el) => (el.onchange = (e) => { stu.director = !!e.target.checked; viewStudio(); }));
      sheetBody.querySelectorAll("[data-dm-sec]").forEach((btn) => (btn.onclick = () => {
        const sec = btn.dataset.dmSec;
        stu.dmSec[sec] = !stu.dmSec[sec];
        viewStudio();
      }));
      // Draft photo pickers — one handler shape for both casts. A file that
      // won't decode is reported rather than silently skipped: the user picked
      // it deliberately and would otherwise just see a short grid.
      const dmPickPhotos = (sel, kind) => bind(sel, (el) => (el.onchange = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        const draft = dmDraft(kind, true);
        let bad = 0;
        for (const f of files) {
          if (draft.photos.length >= dmPhotoMax()) break;
          const data = await downscale(f);
          if (data) draft.photos.push({ data, url: data }); else bad++;
        }
        if (bad) toast(`Не удалось прочитать ${bad} фото`);
        viewStudio();
      }));
      dmPickPhotos("#dmCharFile", "character");
      dmPickPhotos("#dmLocFile", "location");
      // The name has to live in state, not in the DOM: adding a photo, another
      // sheet finishing, or toggling any accordion all re-render the composer,
      // and an unbound input would silently lose whatever was typed.
      const dmBindLabel = (sel, kind) => bind(sel, (el) => (el.oninput = () => {
        dmDraft(kind, true).label = el.value;
      }));
      dmBindLabel("#dmCharLabel", "character");
      dmBindLabel("#dmLocLabel", "location");
      const dmBindText = (sel, kind) => bind(sel, (el) => (el.oninput = () => {
        dmDraft(kind, true).text = el.value;
      }));
      dmBindText("#dmCharText", "character");
      dmBindText("#dmLocText", "location");
      sheetBody.querySelectorAll("[data-dm-rm]").forEach((btn) => (btn.onclick = () => {
        const [kind, i] = btn.dataset.dmRm.split(":");
        const draft = dmDraft(kind, false);
        if (draft) draft.photos.splice(Number(i), 1);
        viewStudio();
      }));
      bind("#dmCharGenBtn", (el) => (el.onclick = () => dmGenerateSheet("character")));
      bind("#dmLocGenBtn", (el) => (el.onclick = () => dmGenerateSheet("location")));
      sheetBody.querySelectorAll("[data-dm-act]").forEach((btn) => (btn.onclick = () => {
        const [kind, act, id] = btn.dataset.dmAct.split(":");
        const list = dmList(kind);
        const entry = list.find((x) => x.id === id);
        if (!entry) return;
        if (act === "use") entry.use = !entry.use;
        else if (act === "del") {
          // Deleting a cast member invalidates a storyboard that was split
          // around them — candidates name people by id, so keeping them would
          // offer shots starring someone who is no longer in the cast.
          if (kind === "character") stu.dmChars = stu.dmChars.filter((x) => x.id !== id);
          else stu.dmLocs = stu.dmLocs.filter((x) => x.id !== id);
          dmInvalidateShots(id);
        } else if (act === "retry") { dmRetrySheet(kind, entry); return; }
        viewStudio();
      }));
      // ——— Screenwriter pipeline event handlers ———
      bind("#swVision", (el) => (el.oninput = () => { stu.swVision = el.value; }));
      bind("#swVfxNotes", (el) => (el.oninput = () => { stu.swVfxNotes = el.value; }));
      bind("#swExpandBtn", (el) => (el.onclick = () => swExpand()));
      sheetBody.querySelectorAll("[data-sw-add]").forEach((btn) => (btn.onclick = () => {
        const e = (stu.swEntities || []).find((x) => x.id === btn.dataset.swAdd);
        if (e) swOpenAddFor(e);
      }));
      sheetBody.querySelectorAll("[data-sw-bg]").forEach((btn) => (btn.onclick = () => {
        const e = (stu.swEntities || []).find((x) => x.id === btn.dataset.swBg);
        if (e) swGenerateBg(e);
      }));
      bind("#dmScenario", (el) => (el.oninput = () => { stu.dmScenario = el.value; }));
      bind("#dmSplitBtn", (el) => (el.onclick = async () => {
        const scenario = (stu.dmScenario || "").trim();
        if (!scenario) { toast("Сначала опишите сценарий 🙂"); return; }
        stu.dmSplitting = true; viewStudio();
        let status, data;
        try {
          ({ status, data } = await api("/api/storyboard", {
            method: "POST",
            body: JSON.stringify({
              scenario,
              characters: dmCast("character").map((c) => ({ id: c.id, label: c.label, description: c.text || undefined })),
              locations: dmCast("location").map((l) => ({ id: l.id, label: l.label, description: l.text || undefined })),
            }),
          }));
        } catch (e) {
          // Without this the button stays disabled behind dmSplitting forever.
          stu.dmSplitting = false;
          toast("Нет связи с сервером — патроны не списаны.", { wide: true, ms: 4500 });
          viewStudio(); return;
        }
        stu.dmSplitting = false;
        if (status === 402) { viewPaywall(data); return; } // paywall owns the sheet body now
        if (status !== 200 || !(data.candidates || []).length) {
          haptic("error");
          toast("Не получилось разбить сценарий — патроны не списаны. Попробуйте ещё раз или опишите сцену подробнее.", { wide: true, ms: 5000 });
          viewStudio(); return;
        }
        stu.dmCands = data.candidates;
        stu.dmCandIdx = null;
        ME.dashboard.credits = data.balance; setBalance(data.balance);
        if (ME.enhance) ME.enhance.left = data.left;
        haptic("success");
        toast(data.free ? `🎞 Готово · осталось ${data.left}` : `🎞 Готово · −${data.charged} ${PATRON}`);
        viewStudio();
      }));
      sheetBody.querySelectorAll("[data-cand-idx]").forEach((btn) => (btn.onclick = () => {
        stu.dmCandIdx = Number(btn.dataset.candIdx);
        viewStudio();
      }));
      bind("#dmAssembleBtn", (el) => (el.onclick = async () => {
        const cand = stu.dmCandIdx != null ? stu.dmCands[stu.dmCandIdx] : null;
        if (!cand) { toast("Сначала выберите кадр 🙂"); return; }
        stu.dmAssembling = true; viewStudio();
        // characterIds/locationIds on the shot are what let the server describe
        // only who's ACTUALLY in this take ("In this shot: …") instead of the
        // whole ticked cast for every shot — a 1-person close-up used to name
        // all 4 people who happened to be ticked. The candidate already carries
        // these from /api/storyboard; forward them as-is.
        const context = {
          characters: dmCast("character").map((c) => ({ id: c.id, label: c.label, description: c.text || undefined })),
          locations: dmCast("location").map((l) => ({ id: l.id, label: l.label, description: l.text || undefined })),
          scenario: (stu.dmScenario || "").trim() || undefined,
          shot: {
            type: cand.shotType, momentRu: cand.momentRu, cameraDirectionEn: cand.cameraDirectionEn,
            characterIds: cand.characterIds, locationIds: cand.locationIds,
          },
        };
        const raw = (stu.prompt || "").trim();
        let status, data;
        try {
          ({ status, data } = await api("/api/enhance", {
            method: "POST",
            // The chosen moment IS the idea when the user hasn't typed one — an
            // empty prompt would be rejected as "напишите идею".
            body: JSON.stringify({ prompt: raw || cand.momentRu, model: "seedance", context }),
          }));
        } catch (e) {
          stu.dmAssembling = false;
          toast("Нет связи с сервером — патроны не списаны. Ваш текст сохранён.", { wide: true, ms: 4500 });
          viewStudio(); return;
        }
        stu.dmAssembling = false;
        if (status === 402) { viewPaywall(data); return; }
        if (status !== 200) {
          haptic("error");
          toast("Не получилось собрать промпт — патроны не списаны. Ваш текст сохранён.", { wide: true, ms: 5000 });
          viewStudio(); return;
        }
        // Same undo affordance the plain enhancer has: ↩ Вернуть restores
        // whatever was in the box before the assemble overwrote it.
        stu.prevPrompt = raw;
        stu.prompt = data.prompt;
        ME.dashboard.credits = data.balance; setBalance(data.balance);
        if (ME.enhance) ME.enhance.left = data.left;
        haptic("success");
        toast(data.free ? `✨ Промпт собран · осталось ${data.left}` : `✨ Промпт собран · −${data.charged} ${PATRON}`);
        viewStudio();
      }));
      goBtn.onclick = () => {
        const p = studioPrice();
        // E1: never fire a doomed request — the CTA itself becomes the top-up path.
        if (p > ME.dashboard.credits) { viewPaywall({ need: p, balance: ME.dashboard.credits, packs: ME.packs }); return; }
        runStudio();
      };
    }

    /** Submit the composer: upload sources → one /api/generate → poll job. */
    async function runStudio() {
      const m = studioModel();
      const isVideo = stu.mode === "video";
      viewProgress(isVideo);
      if (stu.photo && !stu.photoUrl) {
        stu.photoUrl = await uploadData(stu.photo);
        if (!stu.photoUrl) { toast("Не удалось загрузить фото — попробуйте ещё раз"); viewStudio(); return; }
      }
      // Extra angles upload the same way, and each keeps its url so a reroll
      // doesn't re-upload photos we already have on the provider's storage.
      // One failed angle must not sink the render — it is supporting material,
      // so we drop it and tell the user rather than aborting a paid action.
      let dropped = 0;
      for (const x of stu.extras || []) {
        if (!x.url) x.url = await uploadData(x.data);
        if (!x.url) dropped++;
      }
      const extraUrls = (stu.extras || []).map((x) => x.url).filter(Boolean);
      if (dropped) toast(`Не удалось загрузить доп. фото (${dropped}) — рисуем по остальным`);
      let end_image_url;
      if (stu.endPhoto) {
        end_image_url = await uploadData(stu.endPhoto);
        if (!end_image_url) { toast("Не удалось загрузить финальный кадр"); viewStudio(); return; }
      }
      // Director Mode: the finished sheets ride along as reference images, in
      // cast order, each tagged with what it IS via image_roles — "this one is
      // Аня", "this one is the kitchen" — instead of letting the server assume
      // every attachment is the same face repeated (the single worst line in
      // the pipeline before this fix; docs/ui-rebuild-v2.md §4). Already
      // uploaded (the sheet render's own output), nothing to upload here.
      //
      // Canonical order: the anchor first, its own extra angles right after,
      // then every sheet in cast order. With the user's own photo, the anchor
      // IS that photo (sent separately via image_url) so extras lead and
      // sheets follow — unchanged from before roles existed. With no own
      // photo, the first sheet becomes the anchor — sent through image_urls,
      // NOT image_url, so the SERVER's existing "promote the first entry to
      // primary" logic fires and carries that entry's role along with it. A
      // client-side promotion (setting image_url directly) would bypass that
      // and the anchor's identity would never reach the model at all.
      const sheetImages = dmRenderImages();
      const ownSource = !!(stu.photoUrl || stu.generationId);
      const extraImages = extraUrls.map((u) => ({ url: u, role: { kind: "angle" } }));
      const refImages = ownSource ? extraImages.concat(sheetImages) : sheetImages.concat(extraImages);
      const hasNamedSheet = refImages.some((x) => x.role.kind === "character" || x.role.kind === "location");
      const opts = {
        image_url: stu.photoUrl || undefined,
        image_urls: refImages.length ? refImages.map((x) => x.url) : undefined,
        // Only sent once a Director Mode sheet is actually attached — an
        // ordinary render with plain extra angles must reproduce today's
        // exact request shape, so referencePrompt falls back to its original
        // undifferentiated wording with zero change in behaviour.
        image_roles: hasNamedSheet ? refImages.map((x) => x.role) : undefined,
        audio_urls: (stu.refAudio || []).length ? stu.refAudio.map((x) => x.url) : undefined,
        video_urls: (stu.refVideo || []).length ? stu.refVideo.map((x) => x.url) : undefined,
        generation_id: stu.generationId || undefined,
        aspect_ratio: stu.aspect && stu.aspect !== "auto" ? stu.aspect : undefined,
        resolution: stu.resolution || undefined,
        num_images: !isVideo && stu.numImages && stu.numImages > 1 ? stu.numImages : undefined,
        // A named sheet already tells the model what the subject is; forcing
        // "person" on top of it is what made a LOCATION sheet get "get the
        // faces right." `subject` stays for the plain reference-mode path
        // (extra angles, no sheets), where it is still the only signal.
        subject: m.reference && !hasNamedSheet ? (stu.subject || "person") : undefined,
      };
      const body = stu.preset && !isVideo
        ? { source: "preset", id: stu.preset.id,
            // Only send a model when the user actually SWAPPED off the preset default.
            model: stu.modelKey !== stu.preset.model ? stu.modelKey : undefined,
            custom: (stu.custom || "").trim() || undefined, ...opts }
        : { source: "model", model: stu.modelKey, prompt: stu.prompt || "",
            options: Object.values(stu.options).length ? Object.values(stu.options) : undefined,
            custom: isVideo ? (stu.custom || "").trim() || undefined : undefined,
            duration: stu.duration || undefined,
            seedance_tier: stu.modelKey === "seedance" ? (stu.seedanceTier || "fast") : undefined,
            end_image_url, end_generation_id: stu.endGenerationId || undefined, ...opts };
      const { status, data } = await api("/api/generate", { method: "POST", body: JSON.stringify(body) });
      if (status === 402) { viewPaywall(data); return; }
      if (status === 403 && data && data.error === "level_locked") {
        haptic("error"); toast(lockText({ need: data.requiredLevel, have: data.level }), { wide: true, ms: 5000 }); viewStudio(); return;
      }
      // Our provider is refusing us — every render would fail, so say so
      // honestly instead of the generic "что-то пошло не так", which invites a
      // retry that cannot work. Nothing was charged, and we say that too.
      if (status === 503 && data && data.error === "provider_down") {
        haptic("error");
        toast("Сервис генерации временно недоступен — мы уже чиним. Патроны не списаны, попробуйте через пару минут.", { wide: true, ms: 6000 });
        viewStudio(); return;
      }
      if (status === 400 && data && data.error === "too_many_inputs") {
        haptic("error");
        toast(`Эта модель читает не больше ${data.maxInputs} фото — уберите лишние ракурсы`, { wide: true, ms: 4500 });
        viewStudio(); return;
      }
      if (status !== 200) { toast("Что-то пошло не так — попробуйте ещё раз"); viewStudio(); return; }
      ME.dashboard.credits = data.balance;
      setBalance(data.balance);
      startJob(data.id, isVideo, null, etaFor(m.key));
    }

    /**
     * Video composer: aspect ratio + duration (live price) + story quiz
     * (action / genre / emotion / camera) + personalization (hobby, pet, loved
     * things) + optional motion text. Server composes fragments onto the prompt.
     */
    function viewVideoComposer(m) {
      const pick = st.pick;
      const durs = m.video ? m.video.durations : [{ seconds: 5, credits: m.credits }];
      const ratios = m.video ? m.video.aspectRatios : ["auto"];
      const resList = (m.video && m.video.resolutions) || []; // quality ladder (Seedance)
      const hasEnd = !!(m.video && m.video.endFrame); // Kling 3.0 / Seedance: end frame
      const isCurated = pick.source === "campaign_video"; // motion prompt is curated
      const camp = pick.campaignId ? ME.catalog.campaigns.find((x) => x.id === pick.campaignId) : null;
      const scenes = (isCurated && camp && camp.videoScenes) || [];
      // Campaigns: on-theme scene chips replace the generic story quiz.
      const story = isCurated ? [] : (ME.catalog.videoStory || []);
      pick.model = m.key; // always send the (possibly swapped) model
      pick.aspect_ratio = pick.aspect_ratio || ratios[0];
      // Fall back to the model's own default length, not durs[0] — that is the
      // SHORTEST option now, and defaulting to it would quietly downgrade every
      // video the moment a model gained a shorter duration.
      const defSec = (m.video && m.video.defaultSeconds) || durs[0].seconds;
      if (!durs.some((d) => d.seconds === pick.duration)) {
        pick.duration = durs.some((d) => d.seconds === defSec) ? defSec : durs[0].seconds;
      }
      if (resList.length && !resList.some((r) => r.id === pick.resolution)) pick.resolution = resList[0].id;
      if (!resList.length) pick.resolution = undefined;
      if (!hasEnd) { pick.end_photo = null; pick.end_generation_id = null; } // drop a stale end frame on models without it
      pick.options = pick.options || [];
      // Live price = ceil(duration price × the tier's exact multiplier) — mirrors
      // the server's priceFor precisely (using the raw mult, not rounded credits,
      // so the chip price always equals the amount actually charged).
      const resMult = () => {
        if (!pick.resolution || !resList.length) return 1;
        return (resList.find((r) => r.id === pick.resolution) || resList[0]).mult;
      };
      const priceOf = (sec) => Math.ceil((durs.find((d) => d.seconds === sec) || durs[0]).credits * resMult());
      const wasPriceOf = (sec) => Math.ceil((durs.find((d) => d.seconds === sec) || durs[0]).wasCredits * resMult());

      sheetBody.innerHTML = `
        <h3>Настройки видео</h3>
        ${(ME.seedanceSale && ME.seedanceSale.active) || (ME.flagshipCeiling && ME.flagshipCeiling.active) ? saleBanner() : ""}
        ${isCurated ? `${qLabel("Модель", "model")}
          <div class="chips" id="modRow">${ME.catalog.videoModels.map((v) =>
            `<button class="chip ${v.key === m.key ? "on" : ""}" data-mod="${v.key}">${v.onSale ? "🔥 " : ""}${esc(v.label.replace("🎬 ", ""))} · ${v.credits}+ ${PATRON}</button>`).join("")}</div>` : ""}
        ${scenes.length ? `<div class="quiz-q">Сюжет — что происходит?</div>
          <div class="chips" id="sceneRow">${scenes.map((s) =>
            `<button class="chip ${pick.scene === s.id ? "on" : ""}" data-scene="${s.id}" data-sctier="${s.tier || "simple"}" data-scmodel="${s.videoModelKey}">${esc(s.label)}${s.tier === "epic" ? ` · ⚡${s.videoCredits} ${PATRON}` : ""}</button>`).join("")}</div>
          ${scenes.some((s) => s.tier === "epic") ? `<div class="hint">⚡ — эпичная сцена на движке Seedance (звук и физика)</div>` : ""}` : ""}
        ${ratios.length > 1 ? `${qLabel("Формат кадра", "aspect")}
        <div class="chips" id="arRow">${ratios.map((r) =>
          `<button class="chip ${r === pick.aspect_ratio ? "on" : ""}" data-ar="${r}">${esc(RATIO_LABEL[r] || r)}</button>`).join("")}</div>`
        : `<div class="hint">Формат кадра — как у исходного фото (эта модель не меняет соотношение).</div>`}
        ${resList.length ? `${qLabel("Качество", "res")}
        <div class="chips" id="resRow">${resList.map((r) =>
          `<button class="chip ${r.id === pick.resolution ? "on" : ""}" data-res="${r.id}">${esc(r.label)}</button>`).join("")}</div>` : ""}
        ${qLabel("Длительность", "duration")}
        <div id="durRow">${durationSliderHtml(durs.map((d) => d.seconds), pick.duration, priceOf, wasPriceOf)}</div>
        ${hasEnd ? `${qLabel("Финальный кадр — переход к другому фото (необязательно)", "endframe")}
        <div id="endZone">
          <label class="drop"><input type="file" accept="image/*" id="endFile" />
            <span class="em">🎞</span><b>${pick.end_photo || pick.end_generation_id ? "Кадр выбран ✓" : "Добавить финальный кадр"}</b>
            <span>видео плавно перейдёт к нему</span></label>
          ${myImages().slice(0, 8).length ? `<div class="mini" id="endMini">${myImages().slice(0, 8).map((g) =>
            `<img src="${esc(g.output_url)}" data-egid="${g.id}" class="${pick.end_generation_id === g.id ? "on" : ""}" loading="lazy" alt="" />`).join("")}</div>` : ""}
          ${pick.end_photo || pick.end_generation_id ? `<button class="btn ghost" id="endClear">Убрать финальный кадр</button>` : ""}
        </div>` : ""}
        ${story.map((s) => `
          <div class="quiz-q">${esc(s.question)}</div>
          <div class="chips" data-step="${s.id}">${s.options.map((o) =>
            `<button class="chip ${pick.options.includes(o.id) ? "on" : ""}" data-opt="${o.id}">${esc(o.label)}</button>`).join("")}</div>`).join("")}
        <div class="quiz-q">Детали: хобби, питомец, что любит (необязательно)</div>
        <input class="words" id="cw" maxlength="200" value="${esc(pick.custom || "")}" placeholder="напр.: обожает футбол и собаку Рекса" />
        ${isCurated ? "" : `<div class="quiz-q">Движение (необязательно)</div>
          <textarea class="prompt" id="mp" placeholder="напр.: медленный наезд, волосы на ветру">${esc(pick.prompt || "")}</textarea>`}
        <div class="stack">
          <button class="btn primary" id="goBtn"><span class="priceBadge">Создать · <span id="prN">${priceOf(pick.duration)}</span> ${PATRON}</span></button>
          <button class="btn ghost" id="backBtn">← Назад</button>
        </div>`;

      // Model swap (campaigns): re-render with the chosen model's price/durations.
      sheetBody.querySelectorAll("#modRow .chip").forEach((c) => (c.onclick = () => {
        pick.custom = sheetBody.querySelector("#cw").value.trim(); // preserve typed detail
        const nm = ME.catalog.videoModels.find((v) => v.key === c.dataset.mod);
        if (!nm) return;
        pick.credits = nm.credits;
        viewVideoComposer(nm);
      }));
      // Scene (campaigns): single-select, tap again to clear (→ default motion).
      // An epic scene needs a Seedance engine, so selecting one swaps the model
      // and reprices (mirrors the server's upgrade) — unless we're already on one.
      sheetBody.querySelectorAll("#sceneRow .chip").forEach((c) => (c.onclick = () => {
        const on = c.classList.contains("on");
        sheetBody.querySelectorAll("#sceneRow .chip").forEach((x) => x.classList.remove("on"));
        if (on) { pick.scene = null; return; }
        c.classList.add("on");
        pick.scene = c.dataset.scene;
        if (c.dataset.sctier === "epic" && !pick.model.startsWith("seedance")) {
          pick.custom = sheetBody.querySelector("#cw").value.trim(); // preserve typed detail
          const nm = ME.catalog.videoModels.find((v) => v.key === c.dataset.scmodel);
          if (nm) { pick.credits = nm.credits; viewVideoComposer(nm); }
        }
      }));
      // aspect ratio + duration are single-select (no unselect).
      sheetBody.querySelectorAll("#arRow .chip").forEach((c) => (c.onclick = () => {
        sheetBody.querySelectorAll("#arRow .chip").forEach((x) => x.classList.remove("on"));
        c.classList.add("on"); pick.aspect_ratio = c.dataset.ar;
      }));
      wireDurationSlider(sheetBody, durs.map((d) => d.seconds), priceOf, (sec) => {
        pick.duration = sec;
        sheetBody.querySelector("#prN").textContent = priceOf(sec);
      }, wasPriceOf);
      // Keep typed fields when a control re-renders the composer for fresh prices.
      const preserveRerender = () => {
        const cw = sheetBody.querySelector("#cw"); if (cw) pick.custom = cw.value.trim();
        const mp0 = sheetBody.querySelector("#mp"); if (mp0) pick.prompt = mp0.value.trim();
        viewVideoComposer(m);
      };
      // Quality tier: re-render so every duration price + the badge reflect the multiplier.
      sheetBody.querySelectorAll("#resRow .chip").forEach((c) => (c.onclick = () => {
        pick.resolution = c.dataset.res; preserveRerender();
      }));
      // End frame: upload a file, pick one of your own works, or clear it.
      const endFile = sheetBody.querySelector("#endFile");
      if (endFile) endFile.onchange = async () => {
        const f = endFile.files && endFile.files[0]; if (!f) return;
        const data = await downscale(f); if (!data) { toast("Не получилось прочитать фото"); return; }
        pick.end_photo = data; pick.end_generation_id = null; preserveRerender();
      };
      sheetBody.querySelectorAll("#endMini img").forEach((im) => (im.onclick = () => {
        pick.end_generation_id = Number(im.dataset.egid); pick.end_photo = null; preserveRerender();
      }));
      const endClear = sheetBody.querySelector("#endClear");
      if (endClear) endClear.onclick = () => { pick.end_photo = null; pick.end_generation_id = null; preserveRerender(); };
      // story chips: one per step, tap again to clear.
      const sel = {};
      sheetBody.querySelectorAll(".chips[data-step]").forEach((row) => {
        row.querySelectorAll(".chip").forEach((chip) => {
          if (chip.classList.contains("on")) sel[row.dataset.step] = chip.dataset.opt;
          chip.onclick = () => {
            const on = chip.classList.contains("on");
            row.querySelectorAll(".chip").forEach((x) => x.classList.remove("on"));
            if (!on) { chip.classList.add("on"); sel[row.dataset.step] = chip.dataset.opt; }
            else delete sel[row.dataset.step];
          };
        });
      });
      sheetBody.querySelector("#backBtn").onclick = () => viewPick();
      sheetBody.querySelector("#goBtn").onclick = () => {
        pick.options = Object.values(sel);
        pick.custom = sheetBody.querySelector("#cw").value.trim();
        const mp = sheetBody.querySelector("#mp");
        if (mp) pick.prompt = mp.value.trim();
        if (pick.needPhoto && !pick.generation_id) viewPhoto(); else run();
      };
    }

    /** Try a model from the news banner — the Studio opens with it preselected. */
    function tryModel(n) {
      openStudio({ mode: n.kind === "image_to_video" ? "video" : "image", modelKey: n.key, origin: "news" });
    }

    // ————— paywall: buy patron packs WITHOUT leaving the app —————
    // Exit-offer shown at most once per app session (growth doctrine #683: the
    // moment the paywall is dismissed is the highest-intent instant to make the
    // best offer). The offer IS the existing combo pack — already ~half the
    // ladder's per-patron price, with a real Kaspi link — no fake discount.
    let exitOfferShown = false;
    function viewPaywall(data) {
      haptic("warning");
      // Arm the exit-offer: closing the paywall (✕ / backdrop) shows the combo
      // once, instead of silently losing the buyer. "Назад" arms it too.
      const packs = data.packs || [];
      // How much this pack must ADD to finish the render the user just tried.
      // Anything smaller leaves them stuck after paying — the failure mode this
      // block exists to prevent. The expensive video models (Seedance) cost more
      // than the entry pack grants, so before this the paywall would happily
      // sell «Старт» to someone who still couldn't render afterwards.
      const gap = Math.max(0, (data.need || 0) - (data.balance || 0));
      const covers = (p) => p.credits >= gap;
      // Recommend the CHEAPEST pack that actually gets them there, not a fixed
      // slot in the list.
      // The entry tier, if this account still has it AND it closes the gap. It is
      // the cheapest way out of this screen, so it must not lose the "хватит на
      // этот кадр" mark to a ladder pack that costs more.
      const entry = packs.find((p) => p.once && covers(p));
      const best = entry || packs.filter((p) => !p.offer && !p.once && covers(p)).sort((a, b) => a.kzt - b.kzt)[0];
      // The exit-offer only makes sense if the combo itself would unblock them.
      const combo = packs.find((p) => p.offer && covers(p));
      if (combo && !exitOfferShown) sheetCloseHook = () => viewExitOffer(combo, data);
      const ladderTiles = packs.filter((p) => !p.once).map((p) => `
          <button class="pack ${best && p.id === best.id ? "best" : ""} ${covers(p) ? "" : "short"}" data-pk="${p.id}">
            ${packTileHtml(p, {
              badge: best && p.id === best.id ? '<span class="hot">Хватит на этот кадр</span>' : "",
              warn: covers(p) ? null : "не хватит на этот кадр",
            })}
          </button>`).join("");
      sheetBody.innerHTML = `
        <h3>Ещё один шаг до результата ✨</h3>
        <div class="sub">Нужно ${data.need} ${PATRON}, на балансе ${data.balance}. Пополните — и результат сразу продолжит создаваться.</div>
        <div class="packs" id="pwPacks">${ladderTiles}</div>
        <div class="row"><button class="btn ghost" id="backBtn">← Назад</button></div>`;
      // Prepended as a node rather than interpolated, so the tile is built by the
      // one function that owns its markup and the two screens cannot drift.
      if (entry) {
        const host = sheetBody.querySelector("#pwPacks");
        const tile = firstPackTile(entry, packs);
        tile.dataset.pk = entry.id;
        host.insertBefore(tile, host.firstChild);
      }
      sheetBody.querySelector("#backBtn").onclick = () => { if (sheetCloseHook) { closeSheet(); } else viewPick(); };
      sheetBody.querySelectorAll("[data-pk]").forEach((b) => (b.onclick = () => { sheetCloseHook = null; buyPack(b.dataset.pk); }));
    }

    /** The paywall exit-offer: the combo pack, one choice, honest math. */
    function viewExitOffer(combo, paywallData) {
      exitOfferShown = true;
      haptic("warning");
      const ladder = (paywallData.packs || []).filter((p) => !p.offer && !p.once);
      const ladderPer = ladder.length ? Math.min(...ladder.map((p) => p.kzt / p.credits)) : 0;
      const per = combo.kzt / combo.credits;
      const saving = ladderPer ? Math.round((1 - per / ladderPer) * 100) : 0;
      openSheet();
      sheetBody.innerHTML = `
        <h3>Подождите — спецпредложение 🎁</h3>
        <div class="sub">Только для новых покупок: <b>${combo.credits} ${PATRON} за ${combo.kzt.toLocaleString("ru-RU")} ₸</b>
        — ≈${per.toFixed(0)} ₸ за патрон${saving > 0 ? ` (выгода ${saving}% к обычной цене)` : ""}.
        Хватит на ${Math.floor(combo.credits / Math.max(1, paywallData.need)) || 1}× ваш текущий запрос.</div>
        <div class="stack">
          <button class="btn primary" id="exGo">🔥 Забрать за ${combo.kzt.toLocaleString("ru-RU")} ₸</button>
          <button class="btn ghost" id="exNo">Не сейчас</button>
        </div>`;
      sheetBody.querySelector("#exGo").onclick = () => buyPack(combo.id);
      sheetBody.querySelector("#exNo").onclick = () => closeSheet();
    }

    // Kaspi purchase — handled entirely IN the app (same flow as the bot): create
    // a pending order, open the Kaspi pay link, then show an in-app «✅ Я оплатил»
    // button. Tapping it hits /api/order/paid → server verifies with Kaspi and
    // auto-credits, or pings an admin to approve — no need to switch to the bot.
    async function buyPack(packId) {
      const { status, data } = await api("/api/order", { method: "POST", body: JSON.stringify({ pack: packId }) });
      // 409 = the entry price was already used on this account. Reachable from a
      // page that was open before the first purchase landed, so say what happened
      // and refresh rather than showing a generic failure for a rule we chose.
      if (status === 409 && data && data.error === "once_taken") {
        toast("Стартовый набор даётся один раз — он уже был получен");
        load();
        return;
      }
      if (status !== 200) { toast("Не удалось создать заявку — попробуйте ещё раз"); return; }
      if (!data.available) { toast("💳 Оплата Kaspi скоро откроется 🙌"); return; }
      if (tg?.openLink) tg.openLink(data.link); else window.open(data.link, "_blank");
      viewPaid(data);
    }

    // Post-order confirm screen: reopen the Kaspi link or confirm payment in-app.
    // openSheet() is NOT optional here: buyPack is also wired to page-level
    // [data-buy] buttons, where no sheet is open, so this used to render the
    // confirm screen into a hidden node — the buyer went to Kaspi and came back
    // to a screen that never asked whether they paid.
    function viewPaid(order) {
      openSheet();
      sheetBody.innerHTML = `
        <h3>Оплата заказа №${order.orderId}</h3>
        <div class="sub">Оплатите <b>${order.amount.toLocaleString("ru-RU")} ₸</b> в Kaspi (ссылка открыта), затем нажмите «✅ Я оплатил» — мы проверим платёж и начислим ${PATRON} патроны.</div>
        <div class="stack" style="margin-top:14px">
          <button class="btn primary" id="paidBtn">✅ Я оплатил</button>
          <button class="btn ghost" id="reopenBtn">↗ Открыть оплату Kaspi снова</button>
          <button class="btn ghost" id="backBtn">← К пакетам</button>
        </div>`;
      sheetBody.querySelector("#reopenBtn").onclick = () =>
        tg?.openLink ? tg.openLink(order.link) : window.open(order.link, "_blank");
      sheetBody.querySelector("#backBtn").onclick = () => viewPick();
      const pb = sheetBody.querySelector("#paidBtn");
      pb.onclick = async () => {
        pb.disabled = true; pb.textContent = "Проверяем оплату…";
        const { status, data } = await api("/api/order/paid", { method: "POST", body: JSON.stringify({ orderId: order.orderId }) });
        pb.disabled = false; pb.textContent = "✅ Я оплатил";
        if (status !== 200) { toast("Не получилось проверить — попробуйте ещё раз"); return; }
        if (data.result === "granted") { haptic("success"); toast(`✅ Оплата подтверждена! +${data.credits ?? ""} ${PATRON}`); refreshMe(); viewPick(); }
        else if (data.result === "already") { toast("✅ Уже подтверждено — патроны начислены"); refreshMe(); viewPick(); }
        else if (data.result === "pending") { toast(data.failed ? "❌ Оплату не видим — проверьте платёж в Kaspi" : "⏳ Пока не видим оплату — подождите минуту и попробуйте снова"); }
        else if (data.result === "admin") { toast("Спасибо! Проверяем оплату — начислим патроны в ближайшее время ⏳"); }
        else { toast("Заявка не найдена — откройте пакеты заново"); }
      };
    }

    // ————— "Ваш путь в NeuroShot" roadmap — shared by the initial render and
    // the live refresh below, so a step's checkmark shows up right after the
    // job that completes it, not only after a full page reload. —————
    function roadmapStepsFor(d) {
      const rm = d.roadmap || {};
      return [
        { go: "shoot", icon: "camera", label: "Первое фото", done: !!rm.firstPhoto },
        { go: "text", icon: "sparkle", label: "Своя идея", done: !!rm.ownIdea },
        { go: "video", icon: "film", label: "Оживите фото", done: !!rm.revivePhoto },
        { go: "scenes", icon: "confetti", label: "Сценарий", done: !!rm.scenario },
        { go: "friends", icon: "gift", label: "Пригласить друга", done: (d.dashboard.referralCount || 0) > 0 },
      ];
    }
    function roadmapStepsHtml(steps) {
      return steps.map((s) => `
        <button class="rm-pill ${s.done ? "on" : ""}" data-go="${s.go}" aria-label="${esc(s.label)}" title="${esc(s.label)}"></button>`).join("");
    }
    /** The reward note/claim button under the checklist — visible before AND
     *  after completion, so the incentive is never a secret. */
    function roadmapBonusHtml(d, steps) {
      const rb = d.roadmapBonus || { amount: 0, claimed: true };
      if (rb.claimed || rb.amount <= 0) return "";
      if (steps.every((s) => s.done)) {
        return `<button class="rmclaim" id="rmclaimbtn">🎁 Забрать ${rb.amount} ${PATRON} — путь пройден!</button>`;
      }
      return `<p class="rmnote">Пройдите все 5 шагов — получите <b>${rb.amount} ${PATRON}</b> в подарок</p>`;
    }
    /** The onboarding path has served its purpose once every step is done AND the
     *  completion bonus is claimed (or there was none) — nothing left to nudge. */
    function roadmapGraduated(d, steps) {
      const rb = d.roadmapBonus || { amount: 0, claimed: true };
      return steps.every((s) => s.done) && (rb.claimed || rb.amount <= 0);
    }
    /** Inner markup of the .roadmap card. Two states so the same builder drives
     *  the first paint and every live refresh: the full checklist while there's
     *  still a step or bonus outstanding, and a slim graduated row once it's all
     *  done — so the completed card stops hogging the top of the studio. */
    function roadmapCardInner(d, steps) {
      if (roadmapGraduated(d, steps)) {
        return `<button class="rmgrad" data-go="shoot">
            <span class="rico">🎉</span>
            <span class="rgtx">Путь пройден — вы освоили студию<small>Нажмите, чтобы создать ещё</small></span>
          </button>`;
      }
      const done = steps.filter((s) => s.done).length;
      const pct = Math.round((done / steps.length) * 100);
      return `
          <div class="rm-head"><b>Ваш путь в NeuroShot</b><span class="rm-ct">${done} из ${steps.length}</span></div>
          <div class="rm-track"><span class="rm-fill" style="width:${pct}%"></span></div>
          <div class="rm-pills">${roadmapStepsHtml(steps)}</div>
          <div id="rmbonus">${roadmapBonusHtml(d, steps)}</div>`;
    }
    function bindRoadmap() {
      document.querySelectorAll(".rm-pill[data-go]").forEach((b) => (b.onclick = () => {
        if (b.dataset.go === "friends") showPage("friends"); else studio(b.dataset.go);
      }));
      const grad = document.querySelector(".roadmap .rmgrad");
      if (grad) grad.onclick = () => studio("shoot");
      const claimBtn = document.getElementById("rmclaimbtn");
      if (claimBtn) claimBtn.onclick = async function () {
        this.disabled = true;
        const { status, data } = await api("/api/claim-roadmap", { method: "POST" });
        if (status === 200 && data && data.granted > 0) {
          setBalance((ME?.dashboard.credits || 0) + data.granted);
          haptic("success");
          toast(`🎁 +${data.granted} ${PATRON} за пройденный путь!`);
          await refreshMe();
        } else {
          this.disabled = false;
          toast("Не удалось начислить — попробуйте ещё раз");
        }
      };
    }
    /** Re-render just the roadmap card (+ its "Ещё" tab counter) from fresh
     *  /api/me data, without rebuilding the whole page (which would reset the
     *  active tab and any open sheet). */
    function renderRoadmap(d) {
      const steps = roadmapStepsFor(d);
      const card = document.querySelector(".roadmap");
      if (card) {
        card.classList.toggle("graduated", roadmapGraduated(d, steps));
        card.innerHTML = roadmapCardInner(d, steps);
      }
      bindRoadmap();
      const small = document.getElementById("moreRoadmap")?.querySelector("small");
      if (small) small.textContent = `${steps.filter((s) => s.done).length} из ${steps.length} шагов пройдено`;
    }

    // ————— page —————
    // Where the next XP gain should fly FROM — set by whatever caused it just
    // before triggering a refresh. Consumed once, so a later refresh that
    // happens to coincide with unrelated XP doesn't launch from a stale card.
    let xpOrigin = null;
    async function refreshMe() {
      const { status, data } = await api("/api/me");
      if (status !== 200) return;
      ME = data;
      // Pick up renders started elsewhere (e.g. in the bot chat) while the app
      // is open — they join the jobs pill + ripple cards like local ones.
      if (resumePending() > 0) renderGallery(1);
      setBalance(data.dashboard.credits);
      const s = document.getElementById("statsRow");
      if (s) s.innerHTML = statsHtml(data.dashboard);
      const rl = document.getElementById("refList");
      if (rl) rl.innerHTML = referralListHtml(data.referrals);
      // Route the repaint through playXpGain: it animates when XP grew and
      // falls back to a plain repaint otherwise, so there is exactly ONE place
      // that decides how the header reflects progress.
      playXpGain(data.progress, xpOrigin);
      xpOrigin = null;
      const lc = document.getElementById("lvlCardHost");
      if (lc) lc.innerHTML = levelCardHtml(data.progress);
      const at = document.getElementById("achTileHost");
      if (at) {
        at.innerHTML = achTileHtml(data.achievements);
        const t = document.getElementById("achTile");
        if (t) t.onclick = viewAchievements;
      }
      const ct = document.getElementById("certTileHost");
      if (ct) {
        ct.innerHTML = certTileHtml(data.certificates);
        const t2 = document.getElementById("certTile");
        if (t2) t2.onclick = viewCertificates;
      }
      renderRoadmap(data);
    }
    function statsHtml(dash) {
      return `
        <div class="stat"><div class="n">${dash.okGenerations}</div><div class="l">создано</div></div>
        <div class="stat"><div class="n">${dash.creditsSpent}</div><div class="l">потрачено</div></div>
        <div class="stat"><div class="n">${dash.referralEarned}</div><div class="l">заработано</div></div>
        <div class="stat"><div class="n">${dash.referralCount}</div><div class="l">друзей</div></div>`;
    }
    // Per-referral drill-down list for the Друзья page — who joined and where
    // they are in the funnel (see referralList in db.ts for how status is set).
    const REF_STATUS = {
      paid: { cls: "paid", label: "покупает" },
      used_free: { cls: "free", label: "пробует" },
      inactive: { cls: "idle", label: "не активен" },
    };
    function refWhen(iso) {
      const t = Date.parse(iso);
      if (!t) return "";
      return new Date(t).toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
    }
    /**
     * The money half of the Друзья page. broughtKzt is read server-side from
     * granted ORDERS, not from the cashback we paid — showing only the payout
     * would make the program impossible to check, and an invite program you
     * can't check is one you won't confidently promote to your own circle.
     * Cash-out rows appear only once there IS payout activity, so an ordinary
     * inviter isn't shown a withdrawal UI that doesn't apply to them.
     */
    /**
     * The partner block, rendered under the referral card on the Друзья page.
     *
     * Enrolment is by invitation (the bot says so and the app must not imply
     * otherwise), so a non-partner sees a short honest note rather than a
     * teaser for something they cannot self-serve. Codes and history are
     * fetched on demand — they mean nothing to the ~99% who are not partners,
     * and loading them on every app open would be a cost with no reader.
     */
    let PARTNER = null;
    async function loadPartner() {
      const host = document.getElementById("partnerHost");
      if (!host || !ME || !ME.partner) return;
      const p = ME.partner;
      if (!p.joined) {
        host.innerHTML = `<div class="fincard"><div class="finrow"><span>Партнёрская программа</span><b>${p.percent}–${p.topPercent}%</b></div></div>
          <p class="finnote">Партнёрам мы платим от ${p.percent}% с каждой оплаты приглашённых, и ставка растёт с оборотом — до ${p.topPercent}%. Кэшбэк можно вывести деньгами. Программа по приглашению — напишите нам, если хотите участвовать.</p>`;
        return;
      }
      const { status, data } = await api("/api/partner");
      if (status !== 200) return;
      PARTNER = data;
      const codes = (data.codes || []).map((c) => {
        const link = `https://t.me/${BOT}?start=p_${c.code}`;
        return `<div class="pcode">
          <div class="pc"><b>${c.joined} чел · ${c.paying} покупают · ${c.earned} ${PATRON}</b><code>${esc(link)}</code></div>
          <button class="cp" data-copy="${esc(link)}">Копировать</button>
        </div>`;
      }).join("") || `<div class="sub" style="padding:10px 0">Ссылок пока нет — создайте первую в боте: /partner</div>`;

      const canWithdraw = p.withdrawable >= p.withdrawMin;
      const hist = (data.withdrawals || []).map((w) => {
        const label = w.status === "paid" ? "выплачено" : w.status === "pending" ? "в обработке" : "отклонено";
        return `<div class="wrow"><span>№${w.id} · ${new Date(w.at).toLocaleDateString("ru-RU")}</span><b>${w.amount} ${PATRON} · ${label}</b></div>`;
      }).join("");

      host.innerHTML = `<div class="sec-h" style="margin-top:18px"><h2>Партнёрский кабинет</h2></div>
        <div class="fincard">
          <div class="finrow"><span>Приглашено · покупают</span><b>${p.invited} · ${p.paying}</b></div>
          <div class="finrow"><span>Всего заработано</span><b>${p.earned} ${PATRON}</b></div>
          <div class="finrow"><span>Ваша ставка</span><b>${p.percent}%</b></div>
          <div class="finrow"><span>Оборот по ссылкам</span><b>${p.volumeKzt.toLocaleString("ru-RU")} ₸</b></div>
          <div class="finrow owed"><span>Доступно к выводу</span><b>${p.withdrawable} ${PATRON}</b></div>
        </div>
        <p class="finnote">${p.nextAt ? `До ставки ${p.nextPercent}% осталось ${Math.max(0, p.nextAt - p.volumeKzt).toLocaleString("ru-RU")} ₸ оборота. ` : "Вы на максимальной ставке. "}Вывод от ${p.withdrawMin} ${PATRON}, выплаты раз в 2 недели.</p>
        <button class="btn primary" id="wdBtn" ${canWithdraw ? "" : "disabled"} style="margin-top:8px">
          ${canWithdraw ? `💸 Вывести ${p.withdrawable} ${PATRON}` : `До вывода не хватает ${Math.max(0, p.withdrawMin - p.withdrawable)} ${PATRON}`}
        </button>
        <div class="sec-h" style="margin-top:16px"><h2>Ваши ссылки (${p.activeCodes}/${p.maxCodes})</h2></div>
        <div class="fincard">${codes}</div>
        ${hist ? `<div class="sec-h" style="margin-top:16px"><h2>Выплаты</h2></div><div class="fincard">${hist}</div>` : ""}`;

      host.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = () => {
        navigator.clipboard.writeText(b.dataset.copy).catch(() => {});
        toast("Ссылка скопирована");
      }));
      const wd = document.getElementById("wdBtn");
      if (wd && canWithdraw) wd.onclick = async () => {
        wd.disabled = true;
        // No amount is sent: the server drains the withdrawable balance in one
        // guarded statement, so a client-named figure could only disagree with it.
        const { status, data: r } = await api("/api/partner/withdraw", { method: "POST" });
        if (status === 200) {
          toast(`💸 Заявка №${r.id} создана — выплата в течение 2 недель`);
          await refreshMe();
          await loadPartner();
        } else {
          toast(status === 409 ? "Заявка уже в обработке" : "Не удалось создать заявку");
          wd.disabled = false;
        }
      };
    }

    function refFinanceHtml(f) {
      if (!f) return "";
      const hasPayout = (f.withdrawable + f.pendingPayout + f.paidOut) > 0;
      const rows = [
        `<div class="finrow"><span>Друзья купили пакетов</span><b>${f.broughtPayments} на ${f.broughtKzt.toLocaleString("ru-RU")} ₸</b></div>`,
        `<div class="finrow owed"><span>Начислено вам</span><b>${f.earned} ${PATRON}</b></div>`,
      ];
      if (hasPayout) {
        rows.push(`<div class="finrow"><span>Доступно к выводу</span><b>${f.withdrawable} ${PATRON}</b></div>`);

    function wireDurationSlider(root, durs, priceOf, onPick, wasPriceOf) {

     * event routed here even if the finger slides off the small grip zone).
     * Writes straight to the textarea's inline height AND stu.promptH on
     * every move, live, no re-render — a rebuild mid-drag would cost the
     * cursor position and the in-progress drag itself.
     */
    function wirePromptResize(root) {
      const grip = root.querySelector("#stuPromptGrip");
      const box = root.querySelector("#stuPrompt");
      if (!grip || !box) return;

        e.preventDefault();
        grip.setPointerCapture(e.pointerId);
        grip.classList.add("active");
        box.classList.add("gripping");
        const startY = e.clientY;
        const from = stu.promptH || box.offsetHeight;
        const move = (ev) => {
          const h = Math.max(MIN_H, Math.min(MAX_H, from + (ev.clientY - startY)));
          if (h !== stu.promptH) { stu.promptH = h; box.style.height = h + "px"; }
        };
        const up = () => {
          grip.classList.remove("active");
          box.classList.remove("gripping");
          grip.onpointermove = null;
          grip.onpointerup = null;
          grip.onpointercancel = null;

    /**
     * Dual-mode model picker: a plain tap on #stuMpick still just opens/closes
     * the list (unchanged). A press-and-drag instead scrubs live through
     * `primary` — the SAME compatible-models array this render of viewStudio
     * built — highlighting a preview row, and commits stu.modelKey only on
     * release. A short (<6px) press-release counts as the tap, not a drag.
     *
     * Deliberately does NOT call viewStudio() while the gesture is in
     * progress — that would replace #stuMpick's own DOM node mid-drag and
     * silently drop the pointer capture set on it. #stuMlist is always
     * present in the DOM now (toggled via the .hide CSS class, not by
     * conditionally rendering it) specifically so opening it during a drag
     * is a plain class toggle, not a rebuild.
     */
    function wireModelScrub(root, primary) {
      const pick = root.querySelector("#stuMpick");
      const mlist = root.querySelector("#stuMlist");
      if (!pick || !mlist || !primary.length) return;
      const rows = Array.from(mlist.querySelectorAll("[data-scrub-idx]"));
      pick.onpointerdown = (e) => {
        pick.setPointerCapture(e.pointerId);
        const startY = e.clientY;
        const startIdx = Math.max(0, primary.findIndex((x) => x.key === stu.modelKey));
        const wasOpen = !mlist.classList.contains("hide");
        let hoverIdx = startIdx, moved = false, last = null, step = null;
        // Real row height, not a guessed constant — these rows carry a
        // capability line the mockup's didn't, so their height isn't fixed.
        // Read lazily (only once the list is actually laid out): a
        // display:none row reports 0 for offsetTop/offsetHeight, so measuring
        // this at pointerdown would silently break the gesture whenever the
        // picker starts closed.
        const measureStep = () =>
          rows.length > 1 ? rows[1].offsetTop - rows[0].offsetTop : rows[0].offsetHeight + 8;
        const setHover = (i) => {
          if (i === last) return;
          rows.forEach((r) => r.classList.remove("hover"));
          rows[i].classList.add("hover");
          rows[i].scrollIntoView({ block: "nearest" });
          if (last != null) hapticTick();
          last = i;
        };
        const move = (ev) => {
          const dy = ev.clientY - startY;
          if (Math.abs(dy) > 6) moved = true;
          if (!moved) return;
          if (mlist.classList.contains("hide")) { mlist.classList.remove("hide"); pick.setAttribute("aria-expanded", "true"); }
          if (step == null) { step = measureStep(); setHover(hoverIdx); }
          hoverIdx = Math.max(0, Math.min(rows.length - 1, startIdx + Math.round(dy / step)));
          setHover(hoverIdx);
        };
        const up = () => {
          pick.onpointermove = null; pick.onpointerup = null; pick.onpointercancel = null;
          rows.forEach((r) => r.classList.remove("hover"));
          if (moved) { stu.modelKey = primary[hoverIdx].key; stu.mopen = false; clampStudioOpts(); viewStudio(); }
          else { stu.mopen = !wasOpen; viewStudio(); }
        };
        pick.onpointermove = move;
        pick.onpointerup = up;
        pick.onpointercancel = up;
      };
    }

    function fmtLeft(ms) {

      if (d > 0) return `${d}д ${h}ч ${m}м`;

      return `${m}м ${ss}с`;

      const s = Math.floor(left / 1000);
      const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
      const pad = (n) => String(n).padStart(2, "0");
      const dEl = el.querySelector("[data-cd-d]"), hEl = el.querySelector("[data-cd-h]"), mEl = el.querySelector("[data-cd-m]");
      if (dEl) dEl.textContent = pad(d);

    // Paginated «Мои работы»: a fixed grid region + a pager. Each page is fetched

    var GAL_PAGE = 1, GAL_PAGES = 1;

    async function renderGallery(page) {

      } catch (e) { /* keep the last rendered page on a transient error */ }

        }

      if (cur === 1) {

            <div class="lvlrow">

              <div id="certTileHost">${certTileHtml(d.certificates)}</div>
              <div id="rewardsTileHost">${rewardsTileHtml()}</div>
            </div>
          </section>

          <section class="reveal">
            <div class="sec-h"><h2>Мои работы</h2></div>
            <div class="gallery" id="g"></div>
            <div class="pager" id="pager"></div>
          </section>

          <section class="reveal">
            <div class="sec-h"><h2>Настройки</h2></div>
            <label class="setrow">
              <span><b>🏷 Водяной знак</b><small>на ваших фото и видео</small></span>
              <input type="checkbox" id="wmToggle" ${dash.watermarkEnabled ? "checked" : ""} />
            </label>
          </section>
        </div>

        <!-- ===== ДРУЗЬЯ (referrals) ===== -->
        <div class="page" data-page="friends">
          <section class="reveal">
            <div class="sec-h"><h2>Приглашай друзей</h2></div>
            <div class="refcard">
              <h3>🎁 Приглашай — зарабатывай</h3>
              <p>Друг получает ${d.referral.joinBonus} ${PATRON} при входе, вы — награду за его первую покупку и ${d.referral.percent}% со всех его пакетов. Навсегда.</p>
              <div class="linkrow">
                <div class="linkbox" id="refL">${esc(refLink)}</div>
                <button class="btn primary copy" id="refC">Копировать</button>
              </div>
            </div>
            <div class="stats" style="margin-top:12px">
              <div class="stat"><div class="n">${dash.referralCount}</div><div class="l">друзей</div></div>
              <div class="stat"><div class="n">${dash.referralPaying}</div><div class="l">покупают</div></div>
              <div class="stat"><div class="n">${dash.referralEarned}</div><div class="l">${PATRON} заработано</div></div>
            </div>
            ${refFinanceHtml(d.referralFinance)}
          </section>
          <section class="reveal">
            <div class="sec-h"><h2>Ваши друзья</h2></div>
            <div id="refList">${referralListHtml(d.referrals)}</div>
          </section>

          <section class="reveal" id="partnerHost"></section>
        </div>

        <!-- ===== ПАТРОНЫ (buy) ===== -->
        <div class="page" data-page="buy">
          <section class="reveal">
            <div class="sec-h"><h2>Пакеты патронов</h2></div>
            <p class="ratenote" id="rateNote"></p>
            <div class="packs" id="p"></div>
            <p class="buyhint">Оплата картой Kaspi. После оплаты подтвердите в боте — патроны зачислятся.</p>
          </section>
        </div>

        <!-- ===== ЕЩЁ (about + support + roadmap link) ===== -->
        <div class="page" data-page="more">
          <section class="reveal">
            <div class="aboutcard">
              <div class="ac-hero"><span class="brandtag"><i></i>NEUROSHOT</span></div>
              <h2>Что такое <span>NeuroShot</span></h2>
              <p>Одно фото — и у вас целая студия: загружаете фото, ИИ проводит его через
              стиль и монтаж и отдаёт готовый результат — портрет, карточку товара или
              видео-сюжет.</p>
              <div class="steps3">
                <div class="s"><div class="ic"><img class="appicon" src="/img/ic-camera.png" alt="" /></div><small>Фото</small></div>
                <div class="ar">→</div>
                <div class="s"><div class="ic"><img class="appicon" src="/img/ic-palette.png" alt="" /></div><small>Стиль</small></div>
                <div class="ar">→</div>
                <div class="s"><div class="ic"><img class="appicon" src="/img/ic-sparkle.png" alt="" /></div><small>Результат</small></div>
              </div>
              <div class="valuebar"><span class="em"><img class="appicon" src="/img/ic-patron.png" alt="" /></span><p>Патрон — внутренняя валюта: от 2 ${PATRON} за фото, от 10 ${PATRON} за видео. Чем больше пакет — тем дешевле патрон.</p></div>
              <div class="valuebar"><span class="em">🤝</span><p><b>Честные патроны.</b> Не сгорают, без подписок-ловушек и фейкового «безлимита» — платите только за готовый результат.</p></div>
              <button class="btn primary" id="aboutCta">✨ Начать создавать</button>
            </div>
          </section>

          <section class="reveal">
            <div class="sec-h"><h2>Друзья</h2></div>
            <div class="lnkrow" id="moreFriends"><span class="ic"><img class="appicon" src="/img/ic-gift.png" alt="" /></span><span class="tx">Реферальная программа<small>приглашено ${dash.referralCount} · заработано ${dash.referralEarned} ${PATRON}</small></span><span class="chev">›</span></div>
          </section>

          <section class="reveal">
            <div class="sec-h"><h2>Помощь</h2></div>
            <div class="lnkrow" id="moreSupport"><span class="ic"><img class="appicon" src="/img/ic-chat.png" alt="" /></span><span class="tx">Написать в бот<small>@${esc(BOT)} — отвечаем в чате</small></span><span class="chev">›</span></div>
          </section>

          <section class="reveal">
            <div class="sec-h"><h2>О проекте</h2></div>
            <div class="lnkrow" id="moreRoadmap"><span class="ic"><img class="appicon" src="/img/ic-compass.png" alt="" /></span><span class="tx">Ваш путь в NeuroShot<small>${ROADMAP_STEPS.filter((s) => s.done).length} из ${ROADMAP_STEPS.length} шагов пройдено</small></span><span class="chev">›</span></div>
            <div class="lnkrow" id="moreWelcome"><span class="ic"><img class="appicon" src="/img/ic-book.png" alt="" /></span><span class="tx">Обзор NeuroShot<small>Заново посмотреть введение в продукт</small></span><span class="chev">›</span></div>
          </section>

          <section class="reveal">
            <div class="sec-h"><h2>Связаться</h2></div>
            <div class="lnkrow" id="moreContact"><span class="ic"><img class="appicon" src="/img/ic-plane.png" alt="" /></span><span class="tx">Telegram-бот<small>@${esc(BOT)}</small></span><span class="chev">›</span></div>
          </section>

          <section class="reveal">
            <div class="sec-h"><h2>Документы</h2></div>
            <div class="lnkrow" id="moreTerms"><span class="ic">📄</span><span class="tx">Условия использования</span><span class="chev">›</span></div>
            <div class="lnkrow" id="morePrivacy"><span class="ic">🔒</span><span class="tx">Политика конфиденциальности</span><span class="chev">›</span></div>
            <div class="lnkrow" id="moreRefund"><span class="ic">💳</span><span class="tx">Политика возврата средств</span><span class="chev">›</span></div>
          </section>

          <section class="reveal">
            <div class="sec-h"><h2>Данные и приватность</h2></div>
            <div class="lnkrow" id="moreDeleteData"><span class="ic">🗑️</span><span class="tx">Удалить мои данные<small>Необратимо — стирает профиль, историю, сжигает патроны</small></span><span class="chev">›</span></div>
          </section>
        </div>

        <nav class="tabbar">
          <button class="tabbtn on" data-page="studio"><span><img class="appicon" src="/img/ic-palette.png" alt="" /></span>Студия</button>
          <button class="tabbtn" data-page="profile"><span><img class="appicon" src="/img/ic-frame.png" alt="" /></span>Профиль</button>
          <button class="tabbtn" data-page="friends"><span><img class="appicon" src="/img/ic-gift.png" alt="" /></span>Друзья</button>
          <button class="tabbtn" data-page="buy"><span><img class="appicon" src="/img/ic-patron.png" alt="" /></span>Патроны</button>
          <button class="tabbtn" data-page="more"><span><img class="appicon" src="/img/ic-dots.png" alt="" /></span>Ещё</button>
        </nav>
      </div>`));

      resumePending(); // re-hydrate in-flight renders BEFORE the first gallery paint
      renderGallery();

      const p = document.getElementById("p");
      // Offer packs (the limited-time combo) lead with a live countdown badge;
      // once the deadline passes the offer drops out of the list entirely.
      const comboEndsAt = d.comboOffer?.endsAt || 0;
      const all = d.packs || [];
      // Rank rather than a boolean sort: three classes of tile now share this
      // grid (entry, expiring offer, ladder) and `Number(b.offer)-Number(a.offer)`
      // cannot express three.
      const rank = (x) => (x.once ? 2 : x.offer ? 1 : 0);
      const packsOrdered = [...all]
        .filter((pack) => !(pack.offer && comboEndsAt && comboEndsAt <= Date.now()))
        .sort((a, b) => rank(b) - rank(a));
      for (const pack of packsOrdered) {
        // The one-off entry set gets its own tile — its rate sits below every
        // standing rung, so it is not part of the ladder story.
        if (pack.once) { p.appendChild(firstPackTile(pack, all)); continue; }
        // "Выгоднее всего" — the same claim, the same computation
        // (bestValuePackId) and the same wording as the onboarding ladder
        // slide, so the tag is never fixed to a list slot («Популярный»,
        // packs[1]) regardless of whether that pack's rate actually earns it.
        const badge = pack.offer
          ? `<span class="hot" data-countdown="${comboEndsAt}">🔥 Акция</span>`
          : pack.id === bestPack ? '<span class="hot">Выгоднее всего</span>' : "";
        p.appendChild($(`
          <button class="pack ${pack.offer || pack.id === bestPack ? "best" : ""}" data-buy="${pack.id}">
            ${packTileHtml(pack, { badge })}
          </button>`));
      }
      // Exchange-rate transparency: the patron↔tenge rate is a ladder (bigger
      // pack = cheaper), so show its range up front rather than making the user
      // reverse-engineer it from the pack tiles. The entry tier is excluded from
      // the range — it is below the ladder by design, and folding it in would
      // advertise a floor that most purchases will never be made at.
      const rn = document.getElementById("rateNote");
      if (rn) {
        const rates = all.filter((x) => !x.offer && !x.once).map((x) => x.kzt / x.credits);
        if (rates.length) {
          const minR = Math.round(Math.min(...rates)), maxR = Math.round(Math.max(...rates));
          rn.textContent = `1 ${PATRON} ≈ ${minR === maxR ? `${minR}` : `${minR}–${maxR}`} ₸ — чем больше пакет, тем дешевле`;
        }
      }
      startCountdown();

      document.getElementById("jobsPill").onclick = () => {
        const job = [...jobs.values()].at(-1);
        if (job) { viewedJob = job.id; viewProgress(job.isVideo, job.id); }
      };
      document.getElementById("balancePill").onclick = () => showPage("buy");
      // The chip is painted inline on first render, so bind it here; later
      // repaints (setLevelMini) rebind their own.
      const lvlPill0 = document.getElementById("lvlPill");
      if (lvlPill0) lvlPill0.onclick = () => showPage("profile");
      const achTile0 = document.getElementById("achTile");
      if (achTile0) achTile0.onclick = viewAchievements;
      const certTile0 = document.getElementById("certTile");
      if (certTile0) certTile0.onclick = viewCertificates;
      const rewardsTile0 = document.getElementById("rewardsTile");
      if (rewardsTile0) rewardsTile0.onclick = viewRewards;
      // Release notes come after the page is built, and never on a run where
      // the onboarding slideshow is about to play: a first-time user should
      // meet the product, not a list of what changed before they arrived.
      // (The server already withholds notes from accounts created after the
      // newest one; this covers the older account opening the app for the
      // first time since onboarding shipped.)
      if (d.onboardingSeen) maybeShowWhatsNew(d);
      // Partner block loads its own data — see loadPartner for why it is not
      // part of /api/me.
      void loadPartner();
      document.querySelectorAll("[data-buy]").forEach((b) => (b.onclick = () => buyPack(b.dataset.buy, false)));
      document.querySelectorAll("[data-studio]").forEach((a) => (a.onclick = () => studio(a.dataset.studio)));
      // The 2 quick tiles: straight into the composer, no preset-sheet detour —
      // the inline gallery right below now does what tapping "Фото" used to
      // open a whole sheet for.
      document.querySelectorAll("[data-open]").forEach((b) => (b.onclick = () => { st.pick = null; openStudio({ mode: b.dataset.open }); }));
      document.querySelectorAll("[data-camp-open]").forEach((a) => (a.onclick = () => { st.tab = "scenes"; openSheet(); viewCampaign(a.dataset.campOpen); }));
      const promoBanner0 = document.getElementById("promoBanner");
      if (promoBanner0) promoBanner0.onclick = () => {
        const n = (d.catalog.news || []).find((x) => x.key === "seedance_fast");
        if (n) tryModel(n);
      };
      // TV banner: same openStudio(modelKey) preselect mechanism as tryModel()
      // above, but with the umbrella "seedance" key directly — studioList()
      // (catalog.studio.video) carries that key for the actual Дёшево/Быстро/
      // Качество row; "seedance_fast" (what the promo banner passes) is one of
      // the 3 tiers folded UNDER it and is hidden from that list server-side
      // (HIDDEN_SEEDANCE_KEYS, src/webapp.ts), so it wouldn't resolve here.
      const tvBanner0 = document.getElementById("tvBanner");
      if (tvBanner0) tvBanner0.onclick = () => openStudio({ mode: "video", modelKey: "seedance", origin: "tv" });
      renderPromptGallery("photo");
      startPromoCountdown();
      const gallSeg = document.getElementById("gallSeg");
      if (gallSeg) gallSeg.querySelectorAll("button").forEach((b) => (b.onclick = () => {
        gallSeg.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
        // Drives the sliding indicator's `left` (see .gallseg[data-k]); the
        // .on class only carries the label colour now.
        gallSeg.dataset.k = b.dataset.gk;
        renderPromptGallery(b.dataset.gk);
      }));
      const gallerySeeAll = document.getElementById("gallerySeeAll");
      // "Все ›" has to honour the segment. viewPick branches on st.tab, so
      // hardcoding "shoot" sent anyone browsing Видео into the photo styles —
      // the filter said one thing and the full gallery opened on another.
      if (gallerySeeAll) gallerySeeAll.onclick = () => {
        st.tab = gallSeg && gallSeg.dataset.k === "video" ? "scenes" : "shoot";
        openSheet();
        viewPick();
      };
      // Roadmap steps are the same entry points as "Что создаём" — either into
      // the studio sheet on a given tab, or the Друзья page for the invite step
      // — plus the completion-bonus claim button (see renderRoadmap for the
      // live-refresh path after a job finishes).
      bindRoadmap();
      // "Ещё" tab links.
      const aboutCta = document.getElementById("aboutCta");
      if (aboutCta) aboutCta.onclick = () => studio("shoot");
      const moreFriends = document.getElementById("moreFriends");
      if (moreFriends) moreFriends.onclick = () => showPage("friends");
      const moreRoadmap = document.getElementById("moreRoadmap");
      if (moreRoadmap) moreRoadmap.onclick = () => {
        showPage("studio");
        document.querySelector(".roadmap")?.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      const moreWelcome = document.getElementById("moreWelcome");
      if (moreWelcome) moreWelcome.onclick = async () => {
        await refreshMe();
        renderWelcome(ME, true);
      };
      const moreSupport = document.getElementById("moreSupport");
      if (moreSupport) moreSupport.onclick = () => openBot(BOT);

      // An unfinished purchase outranks everything else on the screen: this is
      // somebody who has just come back from Kaspi, and whether they paid is the
      // only question worth asking them. The app cannot remember the order on its
      // own — paying opens an external browser and returning re-mounts the app —
      // so the server hands it back on /api/me. Raised LAST, after the page
      // beneath is fully wired, so dismissing the sheet leaves a working screen.
      if (d.pendingOrder && d.pendingOrder.link) viewPaid(d.pendingOrder);
      const moreContact = document.getElementById("moreContact");
      if (moreContact) moreContact.onclick = () => openBot(BOT);
      const openExternal = (url) => { if (tg?.openLink) tg.openLink(url); else window.open(url, "_blank"); };
      const moreTerms = document.getElementById("moreTerms");
      if (moreTerms) moreTerms.onclick = () => openExternal(location.origin + "/legal/terms");
      const morePrivacy = document.getElementById("morePrivacy");
      if (morePrivacy) morePrivacy.onclick = () => openExternal(location.origin + "/legal/privacy");
      const moreRefund = document.getElementById("moreRefund");
      if (moreRefund) moreRefund.onclick = () => openExternal(location.origin + "/legal/refund");
      const moreDeleteData = document.getElementById("moreDeleteData");
      if (moreDeleteData) moreDeleteData.onclick = () => {
        const warning =
          "Удалить данные аккаунта? Это необратимо: профиль, история и неиспользованные " +
          PATRON + " патроны будут стёрты. Продолжить?";
        const proceed = async (ok) => {
          if (!ok) return;
          const { status, data } = await api("/api/account/delete", { method: "POST" });
          if (status === 200) {
            toast("Данные удалены");
            localStorage.removeItem(TOKEN_KEY);
            setTimeout(() => location.reload(), 1200);
          } else {
            toast((data && data.error) || "Не удалось удалить данные");
          }
        };
        if (tg?.showConfirm) tg.showConfirm(warning, proceed);
        else proceed(window.confirm(warning));
      };
      document.getElementById("refC").onclick = async () => {
        try { await navigator.clipboard.writeText(refLink); } catch (e) { /* ignore */ }
        document.getElementById("refC").textContent = "Скопировано ✓";
        setTimeout(() => (document.getElementById("refC").textContent = "Копировать"), 1600);
      };
      const wm = document.getElementById("wmToggle");
      if (wm) wm.onchange = async () => {
        const on = wm.checked;
        const { status, data } = await api("/api/settings", { method: "POST", body: JSON.stringify({ watermark: on }) });
        if (status === 200) { haptic("light"); toast(data.watermark ? "🏷 Водяной знак включён" : "Водяной знак выключен"); }
        else { wm.checked = !on; toast("Не удалось сохранить"); }
      };

      // Bottom-tab router. Hidden pages aren't observed by reveal(), so force
      // their sections visible on show; scroll back to the top on each switch.
      window.showPage = (id) => {
        document.querySelectorAll(".page").forEach((p) => p.classList.toggle("on", p.dataset.page === id));
        document.querySelectorAll(".tabbtn").forEach((b) => b.classList.toggle("on", b.dataset.page === id));
        document.querySelectorAll(`.page[data-page="${id}"] .reveal`).forEach((e) => e.classList.add("on"));
        window.scrollTo({ top: 0, behavior: "instant" });
        haptic("light");
      };
      document.querySelectorAll(".tabbtn").forEach((b) => (b.onclick = () => showPage(b.dataset.page)));

      reveal();
    }
    load();
  </script>
</body>
</html>
