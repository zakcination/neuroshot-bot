# Fly.io deploy for the SHARED STAGING app (docs/staging.md) — a second,
# independent deployment of the exact same code/Dockerfile as fly.toml,
# redeployed onto this app by .github/workflows/staging.yml on every push to
# an open PR, so "what does PR #N currently look like in the real Telegram
# Mini App UI" is one bot command away (/staging, admin-only) without ever
# touching production.
#
# Two deliberate differences from fly.toml, both load-bearing:
#   - ROLE=webapp (below): this process never calls bot.start() — it shares
#     the REAL bot token with production (see config.ts's own note on why:
#     Mini App initData is signed with the token the user actually opened it
#     from), and Telegram allows exactly one getUpdates caller per token.
#     Skipping polling here is what makes sharing that token safe at all.
#   - No DATABASE_URL is set → src/db.ts falls back to embedded, in-memory
#     Postgres (pglite). Staging state resets on every DEPLOY, which is
#     exactly right for a "test iteration" box: nobody's real credits or
#     history live here, and there is no separate database to provision.
#     It must NOT also reset on idle — see min_machines_running below.
#
# One-time setup (this repo's CI does the rest automatically thereafter):
#   fly apps create neuroshot-bot-staging
#   fly secrets set -a neuroshot-bot-staging \
#     BOT_TOKEN=<same token as production> FAL_KEY=<same key as production> \
#     BOT_USERNAME=neuroshot_ai_bot ADMIN_IDS=<same as production>
app = "neuroshot-bot-staging"
primary_region = "fra"
kill_timeout = "3m"

[build]
  dockerfile = "Dockerfile"

[env]
  WEBAPP_PORT = "8080"
  WEBAPP_URL = "https://neuroshot-bot-staging.fly.dev"
  ROLE = "webapp"
  # The shared Dockerfile bakes NODE_ENV=production (it's the same image as
  # production's), and src/db.ts requires DATABASE_URL whenever NODE_ENV is
  # "production" — without this override staging crash-loops on boot with
  # "DATABASE_URL is required in production" instead of falling back to
  # pglite. db.ts deliberately doesn't import config.ts (see its own
  # comment), so overriding NODE_ENV here — not gating on ROLE in db.ts — is
  # the fix that doesn't add that coupling.
  NODE_ENV = "staging"
  # STAGING_LABEL is set per-deploy via `flyctl deploy -e STAGING_LABEL=...`
  # (staging.yml) — never hardcoded here, so the in-app banner always names
  # whichever PR is actually live.
  # BOT_TOKEN / FAL_KEY / BOT_USERNAME / ADMIN_IDS → `fly secrets set` (one-time, above)

[http_service]
  internal_port = 8080
  force_https = true
  # This app must NOT scale to zero, even though it has no standing connection
  # to keep alive. Its database is pglite running INSIDE this Node process
  # (see the DATABASE_URL note above), so the machine stopping is the database
  # being deleted. With min_machines_running = 0 that happened after a few
  # minutes idle — you'd set up a character, go make coffee, come back to an
  # empty account and the onboarding again. Worse, every cold start is a fresh
  # DB, so getOrCreateUser re-grants the welcome bonus, and those patrons buy
  # renders against the REAL FAL_KEY this app shares with production. One
  # always-on shared-cpu-1x is the cost of staging state that survives a
  # coffee break; state still resets on deploy, which is the intended
  # "test iteration box" behaviour.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "get"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # Bigger than production's 512mb (fly.toml) on purpose: production talks to
  # Neon over HTTP, but staging's embedded pglite (docs/staging.md) runs a
  # whole WASM Postgres INSIDE this same Node process, and the initial schema
  # bootstrap (initDb() creating every table on a cold, empty pglite) is
  # memory-hungry. Confirmed by the Fly logs on the first real deploy: node
  # got OOM-killed at ~364MB RSS against the 512mb limit, right after boot —
  # a crash loop that made /healthz simply never answer.
  memory = "1gb"
